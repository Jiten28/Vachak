अपनी जान बचाना उसके हाथ में है। उसी रात, जब चाँद आसमान में चमक रहा था और सब तरफ़ सन्नाटा था, वह तालाब के किनारे बने एक छोटे नाले के रास्ते आगे बढ़ी। नाला पतला था और उसमें पत्थर भी थे, पर वह हिम्मत करके तैरती रही और भोर होने से पहले एक दूसरे बड़े तालाब में पहुँच गई।","सुबह हुई तो मछुआरे अपने जाल लेकर आ पहुँचे। उन्होंने जाल को पानी में फैलाकर घुमाया। तालाब में भगदड़ मच गई। मछलियाँ इधर उधर भागने लगीं। समयबुद्धि भी घबराकर तैरी, पर जाल ने उसे चारों ओर से घेर लिया और वह फँस गई। एक पल को उसे अपनी लापरवाही पर बहुत पछतावा हुआ, पर उसने तुरंत खुद को सँभाला और सोचा कि अब सिर्फ़ बुद्धि ही काम आएगी।"],["उसने साँस रोक ली और अपने शरीर को ढीला छोड़कर बिल्कुल बेजान की तरह पड़ गई। मछुआरों ने जाल खींचा और बाकी मछलियों के साथ उसे भी किनारे पर उलट दिया। एक मछुआरे ने उसे उठाकर देखा और कहा, \"यह तो मरी हुई है।\" उसने उसे दूर फेंक दिया। वह लुढ़कती हुई तालाब के किनारे पहुँची और ज़रा सा मौका मिलते ही छप से पानी में कूदकर गहराई में गायब हो गई।","पर टालू की किस्मत इतनी अच्छी नहीं थी। जब जाल पड़ा तो वह कीचड़ में आधा सोया हुआ था। उसे समझ ही नहीं आया कि क्या हो रहा है। जब तक वह भागने की सोचता, जाल उसके ऊपर आ चुका था। उसने बहुत हाथ पैर मारे, पर अब कोई रास्ता नहीं था। वह जाल में फँसा रहा, और मछुआरों ने उसे अपनी टोकरी में डाल लिया। तब उसे दूरदर्शी की बात याद आई, पर अब पछताने का कोई फ़ायदा नहीं था।"],["उधर नए तालाब में दूरदर्शी सुरक्षित थी। कुछ दिन बाद समयबुद्धि भी किसी तरह वहाँ तक पहुँच गई। दोनों सहेलियाँ मिलीं तो समयबुद्धि ने शर्मिंदा होकर कहा, \"बहन, तुम सही थीं। मैं आज बड़ी मुश्किल से बची हूँ। अगर मैंने नाटक न किया होता तो मैं भी टालू की तरह पकड़ी जाती।\" दूरदर्शी ने उसे गले लगाया और कहा, \"जो बच गया, वही अच्छा। अब हम हमेशा मिलकर समय पर फ़ैसले लेंगे।\"","दोनों नए तालाब में हँसी खुशी रहने लगीं। जब भी कोई छोटी मछली लापरवाही करती या किसी काम को कल पर टालती, तो वे उसे अपनी यह कहानी सुनातीं और टालू को याद करके समझातीं कि समय पर लिया गया फ़ैसला ही जान बचाता है। छोटी मछलियाँ ध्यान से सुनतीं और अगली बार से हर बात पर पहले सोच लिया करतीं।","सीख: खतरे को पहले पहचान लेने वाला सबसे समझदार होता है। जो मुसीबत में भी सोच सके, वह भी बच जाता है। पर जो हर बात टालता है, वह अक्सर पछताता है।"]],"w":849},{"id":"hi-birbal-khichdi","lang":"hi","title":"बीरबल की खिचड़ी","sub":"अकबर-बीरबल की कहानी","cat":"story","pg":[["सर्दियों के दिन थे और चारों तरफ़ कड़ाके की ठंड पड़ रही थी। सुबह कोहरा छाया रहता और शाम होते ही लोग अपने घरों में अलाव जलाकर दुबक जाते। एक रात बादशाह अकबर का मन नहीं लगा, तो वे अपने प्यारे मंत्री बीरबल को साथ लेकर महल के बाहर झील के किनारे टहलने निकल पड़े। हवा इतनी ठंडी थी कि हड्डियाँ तक काँप रही थीं, और झील का पानी बर्फ़ जैसा लग रहा था।","चलते चलते अकबर ने अपनी शॉल कसकर लपेटी और कहा, \"बीरबल, इतनी ठंड में तो कोई इंसान झील के पानी में खड़ा नहीं हो सकता। उसकी तो जान ही निकल जाएगी।\" बीरबल मुस्कुराए और बोले, \"जहाँपनाह, पैसे के लिए लोग क्या नहीं करते। जिसके घर में भूख हो, वह सब कुछ सह लेता है।\" अकबर को यह बात ठीक नहीं लगी। वे बोले, \"नहीं बीरबल, यह नामुमकिन है।\"","अगली सुबह अकबर ने दरबार में ढिंढोरा पिटवाया। नगाड़े बजे और सिपाही गली गली में घोषणा करने लगे, \"जो आदमी पूरी रात झील के ठंडे पानी में खड़ा रहेगा, उसे बादशाह की ओर से हज़ार अशर्फ़ियाँ इनाम में मिलेंगी।\" लोगों ने सुना तो हैरान रह गए। कुछ हँसे, कुछ ने सिर हिलाया, और किसी की हिम्मत नहीं हुई।"],["शहर के एक कोने में एक गरीब आदमी रहता था। उसकी झोपड़ी टूटी हुई थी, बच्चे कई दिन से आधा पेट खाकर सो रहे थे, और बूढ़ी माँ बीमार थी। जब उसने इनाम की बात सुनी तो उसका मन डोल गया। उसने सोचा कि अगर एक रात की तकलीफ़ से पूरे परिवार का दुख दूर हो सकता है, तो यह सौदा बुरा नहीं। उसने पत्नी से कहा, \"मैं यह कोशिश करूँगा।\" पत्नी की आँखों में आँसू आ गए, पर उसने रोका नहीं।","शाम को वह झील पर पहुँचा। सिपाही किनारे पर पहरा देने लगे ताकि वह बाहर न निकल सके। वह धीरे धीरे पानी में उतरा। पानी इतना ठंडा था कि पहले ही पल उसके पैर सुन्न हो गए। पर वह कमर तक पानी में जाकर खड़ा हो गया। रात गहरी होती गई, हवा तेज़ होती गई, और उसके दाँत कटकटाने लगे। वह मन ही मन अपने बच्चों का चेहरा याद करता रहा।"],["उसकी नज़र दूर महल की एक मीनार पर पड़ी, जहाँ एक दीया टिमटिमा रहा था। वह छोटी सी रोशनी उसे अकेलेपन में सहारे जैसी लगी। वह पूरी रात उसी दीये को देखता रहा और सोचता रहा कि कोई तो है जो जाग रहा है। जब पौ फटी और सूरज की पहली किरण झील पर पड़ी, तब तक वह नीला पड़ चुका था, पर खड़ा था। सिपाहियों ने उसे बाहर निकाला और दरबार ले गए।","दरबार में अकबर ने पूछा, \"क्या तुम सचमुच पूरी रात खड़े रहे? इतनी ठंड कैसे सह गए?\" उसने काँपती आवाज़ में कहा, \"जहाँपनाह, महल की दूर वाली मीनार पर एक दीया जल रहा था। मैं रात भर उसी को देखता रहा। बस उसी के सहारे रात कट गई।\"","अकबर ने भौंहें चढ़ाईं और बोले, \"तब तो तुमने दीये की गर्मी से रात काटी। शर्त यह थी कि बिना किसी सहारे के खड़े रहना है। इसलिए तुम्हें इनाम नहीं मिलेगा।\" दरबार में सन्नाटा छा गया। बेचारा आदमी हाथ जोड़े खड़ा रहा, फिर चुपचाप सिर झुकाकर लौट गया। उसकी आँखों से आँसू बह रहे थे। बीरबल यह सब देख रहे थे, और उन्हें यह फ़ैसला सही नहीं लगा।"],["अगले दिन दरबार लगा तो बीरबल की कुर्सी खाली थी। अकबर ने पहले एक घंटा इंतज़ार किया, फिर दूसरा, और फिर सेवक को भेजा। सेवक लौटा और बोला, \"जहाँपनाह, बीरबल कहते हैं कि वे खिचड़ी पका रहे हैं, जब पक जाएगी तब आएँगे।\" अकबर को बड़ी हैरानी हुई। भला खिचड़ी पकाने में इतना समय क्यों लगता है? उन्होंने कहा, \"चलो, हम खुद चलकर देखते हैं।\"","बगीचे के एक कोने में अकबर ने जो देखा, उस पर उन्हें यकीन नहीं हुआ। बीरबल ने ज़मीन में तीन लंबे डंडे गाड़कर उन्हें ऊपर से बाँध दिया था। सबसे ऊपर एक हाँडी लटक रही थी, और उसके नीचे बहुत दूर एक छोटी सी आग जल रही थी। बीरबल पास बैठे इत्मीनान से हाँडी को देख रहे थे, जैसे कोई बड़ा ज़रूरी काम कर रहे हों।","अकबर हँस पड़े। \"बीरबल, यह क्या तमाशा है? इतनी दूर की आग से तो पानी भी गरम नहीं होगा, खिचड़ी कैसे पकेगी? क्या तुम्हारी अक़्ल घास चरने गई है?\" बीरबल ने बड़ी शांति से कहा, \"जहाँपनाह, ज़रा और इंतज़ार कीजिए। खिचड़ी ज़रूर पकेगी।\" अकबर ने कहा, \"यह कभी नहीं पक सकती।\""],["तब बीरबल उठे और हाथ जोड़कर बोले, \"जहाँपनाह, गुस्ताखी माफ़ हो। जब महल की दूर वाली मीनार के एक दीये से झील में खड़े आदमी को गर्मी मिल सकती है, तो मेरी हाँडी की खिचड़ी इस आग से क्यों नहीं पक सकती? अगर वह आदमी दीये के सहारे इनाम खो बैठा, तो यह खिचड़ी भी तो उसी तरह पक सकती है।\"","अकबर कुछ पल चुप रहे। फिर उनके चेहरे पर शर्मिंदगी उभर आई। वे समझ गए कि उन्होंने उस गरीब के साथ अन्याय किया था। उन्होंने तुरंत सिपाही भेजकर उस आदमी को बुलवाया, हज़ार अशर्फ़ियाँ उसके हाथ में रखीं और माफ़ी माँगी। वह आदमी खुशी से रो पड़ा। अकबर ने बीरबल की पीठ थपथपाई और सबके सामने उनकी बुद्धि की खूब तारीफ़ की।","उस दिन के बाद अकबर जब भी किसी के बारे में कोई फ़ैसला करते, तो एक बार ज़रूर सोचते कि कहीं उसमें अन्याय तो नहीं हो रहा। और वह गरीब आदमी अपने परिवार के साथ सुख से रहने लगा। उसकी बूढ़ी माँ का इलाज हुआ, बच्चों को भरपेट खाना मिला, और उसकी झोपड़ी की जगह एक पक्का घर बन गया।","सीख: किसी के साथ अन्याय नहीं करना चाहिए, और समझदारी से कही गई बात बड़े से बड़े आदमी को भी सही रास्ता दिखा देती है।"]],"w":933},{"id":"hi-tenali-moorkh","lang":"hi","title":"तेनालीराम और सबसे बड़ा मूर्ख","sub":"तेनालीराम की कहानी","cat":"story","pg":[["विजयनगर का राज्य अपनी खुशहाली और रौनक के लिए दूर दूर तक मशहूर था। राजा कृष्णदेव राय बड़े विद्वान और दयालु शासक थे, और उनके दरबार में एक से बढ़कर एक कवि, कलाकार और मंत्री थे। पर सबसे प्यारा दरबारी था तेनालीराम, जो अपनी हाज़िरजवाबी और हँसी मज़ाक से सबका मन मोह लेता था। राजा को उसकी बातें सुनना बहुत पसंद था, चाहे दरबार के बाकी लोग उससे थोड़ा जलते भी थे।","होली का त्योहार पास आ रहा था। नगर में रंग और गुलाल की दुकानें सज गई थीं और बच्चे पिचकारियाँ लेकर दौड़ रहे थे। एक दिन दरबार में इसी बात की चर्चा चल रही थी कि इस बार त्योहार कैसे मनाया जाए। तभी राजा ने हँसते हुए कहा, \"इस बार हम कुछ नया करेंगे। हम मूर्खों का एक बड़ा सम्मेलन करेंगे। जो दरबारी हमारे लिए सबसे बड़ा मूर्ख ढूँढकर लाएगा, उसे इनाम मिलेगा।\"","सभी दरबारी खुश हो गए। उन्हें लगा कि यह अपनी चतुराई दिखाने का अच्छा मौका है। हर कोई अपने सेवकों को दौड़ाने लगा कि गाँव गाँव और गली गली में जाकर सबसे बड़े मूर्ख का पता लगाओ। कई दिन तक दरबारियों के आदमी इधर उधर भटकते रहे। तेनालीराम ने भी एक सूची बनाई, पर उसने उसे किसी को नहीं दिखाया। वह बस चुपचाप मुस्कुराता रहा।"],["होली के दिन दरबार रंगों से भर गया। सब दरबारी रंगीन कपड़ों में आए और हाथ में अपनी अपनी सूचियाँ लेकर कतार में खड़े हो गए। एक एक करके उन्होंने अपनी सूची राजा को सौंपी। किसी की सूची में एक भोला किसान था जो घी की जगह तेल खा गया था। किसी की सूची में एक व्यापारी था जो अपनी ही दुकान में ताला लगाकर चाबी खो बैठा था। गाँव के कुछ सीधे लोग भी थे। राजा सूचियाँ पढ़ते और हँसते जाते।","आखिर तेनालीराम की बारी आई। उसने अपनी सूची राजा को दी। राजा ने जब पढ़ना शुरू किया तो उनकी हँसी रुक गई। सूची में सबसे ऊपर उनका अपना नाम लिखा था, यानी कृष्णदेव राय। पूरे दरबार में सन्नाटा छा गया। सब दरबारी साँस रोके देखने लगे कि अब क्या होगा।","राजा का चेहरा गुस्से से लाल हो गया। \"तेनालीराम! तुमने मेरा नाम कैसे लिख दिया? क्या तुम यह कहना चाहते हो कि मैं इस राज्य का सबसे बड़ा मूर्ख हूँ? तुम्हारी हिम्मत कैसे हुई?\" दरबारी मन ही मन खुश हो रहे थे कि आज तेनालीराम फँस गया। पर तेनालीराम ज़रा भी नहीं घबराया। वह आगे आया और हाथ जोड़कर शांत भाव से खड़ा हो गया।"],["उसने कहा, \"महाराज, पहले मेरी पूरी बात सुन लीजिए, फिर जो चाहें दंड दीजिए। कल मैंने देखा कि आपने एक आदमी को दस हज़ार अशर्फ़ियाँ दे दीं। वह घोड़े खरीदने के लिए दूर देश जा रहा था। उसने कहा था कि वह अगले हफ़्ते घोड़े लेकर लौटेगा। न आपने उसका पता पूछा, न कोई ज़मानत ली। मुझे तो लगता है कि वह आपके खज़ाने के साथ बहुत दूर भाग गया होगा।\"","राजा कुछ देर सोचते रहे, फिर बोले, \"पर तेनालीराम, अगर वह सचमुच घोड़े लेकर लौट आया तो? तब तुम क्या करोगे?\" तेनालीराम ने मुस्कुराकर कहा, \"तब मैं आपका नाम काटकर उसी का नाम लिख दूँगा, महाराज। क्योंकि जो आदमी इतना धन पाकर भी लौट आए, वह भी कुछ कम मूर्ख नहीं कहलाएगा। पर तब आप इस सूची से बाहर हो जाएँगे।\"","राजा कुछ क्षण चुप रहे। फिर अचानक उनके होंठों पर मुस्कान फैली और वे ठहाका मारकर हँस पड़े। पूरा दरबार चकित रह गया। राजा खिलखिलाकर बोले, \"तेनालीराम, तुम हर बार अपनी बात इतने मज़े से कह देते हो कि मैं गुस्सा कर ही नहीं पाता। और सच यह है कि बात तुमने सही कही। मैंने बिना सोचे समझे एक अनजान आदमी पर भरोसा कर लिया था।\""],["राजा ने तुरंत सिपाहियों को आदेश दिया कि उस आदमी का पता लगाया जाए और उससे हिसाब लिया जाए। फिर उन्होंने अपने गले से मोतियों की माला उतारी और तेनालीराम को पहना दी। \"तुम्हारी सूची सबसे अच्छी थी, क्योंकि इसने मुझे एक सीख दी।\" तेनालीराम को ढेर सारा इनाम मिला, और जो दरबारी उसे फँसा हुआ देखना चाहते थे, वे एक दूसरे का मुँह ताकते रह गए।","शाम को होली के रंग उड़े, मिठाइयाँ बँटीं और दरबार में खूब हँसी गूँजी। राजा ने सबके सामने कहा कि सच्चा मित्र वही है जो कड़वी बात भी ऐसे कहे कि मन को चोट न लगे। उस दिन के बाद राजा किसी को धन देने से पहले दो बार सोचने लगे, और तेनालीराम पर उनका भरोसा और गहरा हो गया।","रात को जब महल में दीये जल गए, तो राजा अकेले बैठे देर तक उस दिन की बातें याद करते रहे। उन्हें हँसी भी आ रही थी और अपने आप पर थोड़ा अफ़सोस भी हो रहा था। उन्होंने सोचा कि दरबार में जी हुज़ूरी करने वाले तो बहुत हैं, पर ऐसा साथी बहुत कम मिलता है जो राजा को उसकी भूल भी हँसते हुए दिखा दे। उन्होंने मन ही मन भगवान का धन्यवाद किया कि ऐसा साथी उन्हें मिला है।","सीख: सच्ची बात अगर हँसी मज़ाक के साथ कही जाए तो सामने वाला उसे बुरा नहीं मानता, बल्कि सीख लेता है।"]],"w":833},{"id":"hi-ekta","lang":"hi","title":"एकता की ताकत","sub":"कबूतर और जाल","cat":"story","pg":[["एक घने जंगल में एक विशाल बरगद का पेड़ खड़ा था। उसकी जटाएँ ज़मीन तक लटकती थीं और डालियाँ इतनी फैली थीं कि सैकड़ों पंछी उन पर आराम से बसेरा कर लेते थे। इसी पेड़ पर बहुत से कबूतर रहते थे। उनका राजा था चित्रग्रीव, जो बहुत समझदार और दयालु था। वह हर कबूतर का हाल पूछता, बीमारों की सेवा करवाता और सबको मिलजुलकर रहना सिखाता।","कबूतर सुबह होते ही दाने की खोज में निकल पड़ते थे और शाम को लौटकर पेड़ पर अपनी अपनी जगह बैठ जाते। पर उस साल जंगल में सूखा पड़ा था। खेत सूखे थे और दाने कम मिल रहे थे। कई दिन से कबूतरों के पेट आधे भरे थे। बच्चे भूख से चूँ चूँ करते और बड़े कबूतर चिंता में डूबे रहते।","एक सुबह कबूतर दाना ढूँढने निकले। उड़ते उड़ते उन्होंने देखा कि दूर ज़मीन पर चावल के बहुत से दाने बिखरे हुए हैं, जैसे किसी ने पूरी बोरी उड़ेल दी हो। एक जवान कबूतर खुशी से चिल्लाया, \"देखो, वहाँ तो दावत है! इतने दाने तो हमने महीनों से नहीं देखे। चलो, जल्दी चलें।\" सब भूखे कबूतर उस ओर मुड़ने लगे।"],["राजा चित्रग्रीव ने सबको रोका। उसने कहा, \"ज़रा ठहरो। इस सुनसान जंगल में, जहाँ दूर दूर तक कोई खेत या आदमी नहीं, इतने दाने कैसे आ गए? कहीं यह कोई जाल तो नहीं?\" पर भूख बड़ी बुरी चीज़ होती है। कबूतरों ने कहा, \"महाराज, आप बेकार डर रहे हैं। देखिए तो, कितने सुंदर दाने हैं।\" किसी ने राजा की बात नहीं मानी।","आखिर राजा भी अपने साथियों को अकेला नहीं छोड़ सकता था, इसलिए वह भी साथ नीचे उतरा। सारे कबूतर दाना चुगने में जुट गए। अभी उन्होंने कुछ ही दाने खाए थे कि अचानक एक बड़ा सा जाल सब पर आ गिरा। झाड़ी के पीछे छिपा शिकारी खुशी से चिल्लाया और डंडा लेकर दौड़ता हुआ आने लगा।","कबूतर घबराकर फड़फड़ाने लगे। कोई इधर उड़ने की कोशिश करता, कोई उधर। कोई रोने लगा, कोई दूसरों को दोष देने लगा। जवान कबूतर शर्म से सिर झुकाकर बोला, \"महाराज, हमने आपकी बात नहीं मानी। यह सब हमारी वजह से हुआ।\" जितना वे ज़ोर लगाते, जाल उतना ही कसता जाता। शिकारी पास आता जा रहा था।"],["चित्रग्रीव ने शांत स्वर में कहा, \"घबराओ मत और एक दूसरे को दोष मत दो। अभी लड़ने का समय नहीं है। अकेले अकेले हम कमज़ोर हैं, पर मिलकर बहुत ताकतवर हैं। जब मैं कहूँ, तब सब एक साथ, एक ही दिशा में उड़ना। एक भी कबूतर अलग नहीं होना चाहिए।\" उसकी शांत आवाज़ सुनकर सबका डर कुछ कम हुआ और सब ध्यान से सुनने लगे।","उसने गिनती शुरू की। \"एक, दो, तीन!\" और सारे कबूतर एक साथ ज़ोर लगाकर आसमान में उड़ गए। पूरा जाल उनके साथ ऊपर उठ गया। शिकारी हक्का बक्का रह गया। उसने जाल पकड़ने के लिए दौड़ लगाई, पर जाल हवा में तैरता हुआ दूर जाने लगा। वह कुछ दूर तक भागा, पर जल्दी ही थककर रुक गया और हाथ मलता रह गया।","चित्रग्रीव ने कहा, \"हमें अपने मित्र चूहे हिरण्यक के पास चलना चाहिए। वही अपने दाँतों से जाल काट सकता है।\" कबूतर जाल को लिए आसमान में उड़ते रहे और एक पुराने खंडहर के पास पहुँचे। वहाँ एक बिल में हिरण्यक रहता था। राजा ने बिल के पास उतरकर आवाज़ दी, \"मित्र हिरण्यक, बाहर आओ। हम मुसीबत में हैं।\""],["हिरण्यक बाहर निकला और अपने मित्रों को जाल में फँसा देखकर दुखी हो गया। उसने कहा, \"महाराज, आप घबराइए मत। मैं अभी काटता हूँ।\" वह सबसे पहले राजा की रस्सी की ओर बढ़ा। पर चित्रग्रीव ने कहा, \"नहीं मित्र, पहले मेरी प्रजा को आज़ाद करो। मैं सबसे अंत में रहूँगा।\" हिरण्यक राजा की यह बात सुनकर बहुत प्रभावित हुआ।","हिरण्यक ने अपने तेज़ दाँतों से एक एक करके जाल की सारी रस्सियाँ कुतर डालीं। आखिर में उसने राजा का फंदा भी काट दिया। सब कबूतर आज़ाद हो गए। उन्होंने हिरण्यक को धन्यवाद दिया और खुशी से उसके चारों ओर उड़ने लगे। चूहे ने कहा, \"सच्चे मित्र वही हैं जो मुसीबत में काम आएँ।\" उस दिन के बाद चित्रग्रीव और हिरण्यक की दोस्ती और गहरी हो गई।","हिरण्यक ने राजा से पूछा, \"महाराज, आपने सबसे अंत में अपना बंधन कटवाने को क्यों कहा?\" चित्रग्रीव मुस्कुराया और बोला, \"मित्र, राजा का काम अपनी प्रजा की रक्षा करना है। अगर मैं पहले आज़ाद हो जाता, तो शायद बाकी कबूतर सोचते कि मुझे उनकी फ़िक्र नहीं। जो नेता सबसे पहले अपने बारे में सोचे, उस पर कोई भरोसा नहीं करता।\" यह सुनकर सब कबूतरों की आँखें भर आईं और वे अपने राजा के प्रति और भी आदर से भर गए।"],["थोड़ी देर आराम करके और हिरण्यक को फिर से धन्यवाद देकर सब कबूतर वहाँ से उड़ चले। रास्ते में नीचे खेतों में हरी फ़सल लहरा रही थी और नदी की लहरें धूप में चमक रही थीं। कबूतरों को लग रहा था कि आज का दिन उन्हें कोई बड़ा पाठ पढ़ा गया है। वे पंख से पंख मिलाकर एक साथ उड़ते रहे, और आज उन्हें अपने साथ का मोल पहले से कहीं ज़्यादा समझ आ रहा था।","कबूतर वापस अपने बरगद के पेड़ पर लौटे। जवान कबूतर ने सबके सामने कहा कि अब से वे बिना सोचे समझे किसी लालच में नहीं पड़ेंगे और हमेशा राजा की सलाह मानेंगे। उस शाम बरगद के पेड़ पर बहुत देर तक कबूतरों की खुशी भरी गुटरगूँ सुनाई देती रही।","सीख: एकता में बड़ी ताकत होती है। जो मिलकर काम करते हैं, वे हर मुश्किल को पार कर लेते हैं।"]],"w":895},{"id":"en-hare-tortoise","lang":"en","title":"The Tortoise and the Hare","sub":"A fable","cat":"story","pg":[["On a sunny hillside, where the grass was long and the wildflowers nodded in the breeze, there lived a hare who was proud of one thing above all: he was fast. He raced the wind, he raced the swallows, and he raced the river as it tumbled down the rocks. Nobody on the hillside had ever beaten him, and he made sure that everyone remembered it.","Every morning he stood on a flat stone at the top of the hill and called out to the other animals. \"Who will race me today?\" he cried. The squirrels shook their heads. The rabbits looked at their feet. The old crow on the branch above him only sighed. \"One day,\" she muttered, \"someone will teach that hare a lesson he cannot run away from.\"","Nearby, in a quiet hollow beside a small pond, lived a tortoise. She moved slowly and thought carefully, and she never did anything without first asking herself whether it was wise. The animals loved her for her kindness. She helped the ducklings find their way home, and she kept a place by her pond where tired travellers could rest."],["One morning the hare was bounding along the path when he saw the tortoise crossing it, one patient step after another. He skidded to a stop and began to laugh. He laughed so hard that he had to hold his sides. \"Oh, my dear friend,\" he said, wiping his eyes, \"at that speed, you will reach the river by next winter!\"","The tortoise did not seem to mind. She looked up calmly, her eyes bright and steady. \"Perhaps I will,\" she said. \"But I would still like to race you.\" The hare stared at her. Then he laughed again, even louder than before. \"You? Race me? This will be the best joke of the whole summer!\" But the tortoise only nodded, and said she would be ready by morning.","By the next morning, the news had spread across the hillside, and every animal had come to watch. The squirrels sat in the branches, the ducklings lined up beside the pond, and even the old crow flew down to a low bough to see. They gathered at the old oak tree, where the path began. The fox, who had been chosen as the judge, trotted to the middle and explained the rules."],["\"The race will run along the path, over the little bridge, and up to the big flat rock by the river,\" said the fox. \"Whoever touches the rock first is the winner.\" The hare stretched his long legs and winked at the crowd. The tortoise took a slow, deep breath and looked straight ahead. \"Ready, steady, go!\" cried the fox, and the hare shot away like an arrow from a bow.","In a few seconds he was so far ahead that the tortoise had barely left the starting line. Dust rose behind him and the crowd could hardly see him at all. The tortoise did not hurry and did not look around. She simply put one foot in front of the other, again and again, and began to climb the gentle slope. Some of the animals giggled, but she did not hear them."],["Halfway along the path, the hare skidded to a stop. He looked back and saw nothing but an empty road. \"I have all the time in the world,\" he yawned. \"She will not be here until dinner.\" Near the path stood a tall tree with thick, cool shade, and the grass beneath it looked as soft as a bed. He lay down, stretched his legs, and closed his eyes. \"Just a little nap,\" he told himself.","The tortoise did not stop. When she came to the little bridge, she crossed it slowly, listening to the water gurgle below. When she came to the steep part of the path, her legs ached and her breath came in short puffs, but she told herself, \"A little further, only a little further.\" Step by step, she walked past the sleeping hare. The sun climbed higher, the birds sang above her, and she kept going."],["At last the hare woke with a start. The shadows had grown long and the air had cooled. He jumped up and looked around in alarm. The path ahead of him was empty, and he did not see the tortoise anywhere. \"She must be behind me,\" he thought, but a cold feeling crept into his chest. Then he ran, faster than he had ever run in his life, with his ears flat against his back.","He flew over the bridge and up the last slope, his heart pounding. But as he came round the final bend, he saw a sight that made him stop. There, by the big flat rock, stood the tortoise with her front foot upon it, and the whole forest was cheering. The squirrels were clapping, the ducklings were flapping their wings, and the old crow was cawing with delight."],["The hare hung his head. His legs were trembling and his face felt hot. He had never been so ashamed. The tortoise walked over to him, tired but happy, and did not boast at all. \"Do not be sad,\" she said kindly. \"You are a wonderful runner. But being quick is a gift. Being steady is a choice.\" The hare looked at her for a long moment, and then he smiled, a little sadly.","After that day, the hare never laughed at anyone for being slow. He often sat by the tortoise's pond in the evening, and the two of them talked until the stars came out. He had learned that pride can make a fast creature lose to a slow one, and the tortoise, for her part, had learned that patience is a quiet kind of strength.","Moral: do not let talent make you careless. Slow and steady effort will often win in the end."]],"w":984},{"id":"en-lion-mouse","lang":"en","title":"The Lion and the Mouse","sub":"A fable","cat":"story","pg":[["In a warm green forest, where the sunlight fell in golden patches through the leaves, there lived a great lion. He was the strongest animal for miles around, and all the creatures treated him with respect. When he roared, the birds flew from their nests and the deer stopped grazing to listen. But after a long morning of walking, even a king needs his rest.","One afternoon he lay down in the cool shade of a banyan tree, rested his big head on his paws, and fell fast asleep. His breath rose and fell like a gentle wind. Not far away, in a hole beneath the roots of the same tree, lived a tiny mouse. She was playful and quick, and she loved to dart through the grass looking for seeds and berries.","That day she scurried out of her hole in a great hurry, thinking only about the seeds she wanted to find. She did not look where she was going, and she ran straight across the lion's paw. In an instant, the lion woke with a thunderous roar. His huge paw came down, and he caught the mouse by the tail. She dangled in the air, shaking with fright."],["\"Who dares to wake me?\" growled the lion. His great golden eyes glared at her, and she could feel his hot breath. The mouse trembled from her whiskers to her tail. \"Please, Your Majesty,\" she squeaked, as bravely as she could. \"I did not mean it. I was not looking. Let me go, and one day I will repay your kindness. I promise.\"","The lion laughed so hard that he nearly let go by himself. \"You, repay me?\" he said, shaking his mane. \"What could a mouse ever do for a lion?\" But he was in a good mood after his rest, and the mouse looked so small and frightened that his heart softened. So he lifted his paw and let the little creature run away. She scampered into the long grass and called back her thanks."],["The mouse ran all the way back to her hole, her heart still thumping. That night she told her family what had happened, and they listened wide eyed. \"You were lucky,\" said her mother. \"Not many creatures escape a lion's paw.\" The mouse smiled and said, \"He let me go because he was kind. I will not forget that.\" And she kept her promise safe in her heart, though she did not yet know how she would keep it.","The seasons turned slowly, and a few weeks later, the lion was walking through the forest at dusk. He was thinking about his supper and did not notice the thin ropes lying across the path. A hunter had hidden a strong net among the leaves, and the lion stepped right into it. In a moment the ropes tightened around him and lifted him half off the ground.","The lion thrashed and roared, but the more he struggled, the more tangled he became. The ropes bit into his fur and he could not move his legs. His roars echoed through the trees, and the birds flew away in fright. The other animals heard him, but none dared to come close. The lion was tired, and he feared the hunter would soon return."],["But far away, a small pair of ears pricked up. The mouse was sitting in her hole when she heard the roar, and she knew at once whose voice it was. She did not stop to think. She ran through the grass, over roots and stones, as fast as her little legs could carry her. When at last she reached the clearing and saw the great lion trapped in the net, her heart ached for him.","\"Stay still, Your Majesty,\" she said. \"I know how to help.\" The lion looked down at her in surprise. \"Little friend, what can you do against such strong ropes?\" he sighed. \"Wait and see,\" she answered. She climbed onto the net and began to gnaw. Her teeth were tiny, but they were sharp, and she did not stop for a moment."],["Strand by strand, she cut the net open. The night grew dark and the stars came out, and still she gnawed, her small jaws growing sore. Now and then she stopped to catch her breath, and the lion whispered, \"Rest, if you must.\" But the mouse shook her head. \"Not until you are free.\" At last the final rope snapped, the net fell apart, and the lion stepped out, stretching his stiff and aching legs.","For a long time the lion could not speak. Then he bowed his great head until his mane touched the ground. \"I laughed at you once, and I was wrong,\" he said in a low voice. \"I thought that only the strong could be of any use. You have saved my life, and I will never forget it.\" The mouse blushed under her whiskers and said it was nothing, only a promise kept."],["From that day on, the lion and the mouse were friends. In the evenings she sat on his broad back, and he told her stories about the far hills, while she told him about the secret paths between the roots and stones. The lion made sure no one in the forest ever frightened her again, and the mouse always kept one ear listening, in case her friend should need her.","The other animals watched the two of them and wondered. Slowly the whole forest learned that no one is too small to help, and that a kind act, even towards someone who seems unimportant, may come back to you when you need it most.","Moral: kindness is never wasted, and even the smallest friend can prove to be the greatest help."]],"w":964},{"id":"en-woodcutter","lang":"en","title":"The Honest Woodcutter","sub":"A folk tale","cat":"story","pg":[["At the edge of a great forest, in a small mud house with a roof of dry grass, lived a poor woodcutter named Ravi. He had no land, no cattle, and no savings. All he had was a strong pair of arms, a kind heart, and a single iron axe that had belonged to his father. The handle was worn smooth by years of use, and the blade had turned dark with age.","Every morning, before the sun was properly up, Ravi walked into the forest. He cut dry branches, tied them into a neat bundle, and carried it to the village on his back. There he sold his firewood for a few coins. With that money he bought rice and lentils, and sometimes, on festival days, a little sweet for his old mother. It was hard work, but he never complained.","The villagers liked Ravi. He greeted everyone with a smile, and he never asked for more money than his wood was worth. If he saw an old woman struggling with her load, he carried it for her. \"Ravi has little,\" they would say, \"but he is the richest man in the village in the ways that matter.\""],["One hot morning, Ravi went further than usual and came to a place where the river curved through the trees. A thick branch hung over the water, and it was just the right size for his bundle. He climbed up, raised his axe, and swung. But his hands were wet with sweat, and as the axe struck the wood, it slipped out of his grip and spun into the air.","It fell with a splash into the deep, dark water, and sank at once. Ravi scrambled down and ran to the bank. He looked and looked, but the river was too deep and the water too muddy. He could not see the bottom, and he could not swim well enough to dive. At last he sat down on the bank and wept. Without the axe he could not earn a single coin, and without coins, there would be no dinner for him or his mother."],["The forest around him was quiet. A woodpecker tapped somewhere, and a squirrel peeped down from a branch as if to ask what was the matter. Ravi thought of his mother waiting at home and of the empty pot on the stove. \"Father gave me this axe,\" he whispered, \"and now I have lost it. What shall I tell her?\"","He sat there for a long time, his head in his hands. The sun moved across the sky and the shadows grew longer. Suddenly the river began to glow with a soft light, and the water rippled in a circle. A gentle spirit rose from the surface, dressed in robes the colour of morning mist. \"Why do you cry, woodcutter?\" she asked in a voice like flowing water. Ravi wiped his eyes and told her everything that had happened.","The spirit listened kindly. \"Do not worry,\" she said. \"Let me see what I can do.\" She dived beneath the surface, and the river closed over her without a sound. Ravi waited, hardly breathing. After a while the water glowed again, and she came back holding a shining golden axe. The blade sparkled in the sun so brightly that Ravi had to shade his eyes. \"Is this yours?\" she asked."],["Ravi stared at it. He had never seen so much gold in his life. One such axe could feed him and his mother for the rest of their days. But he shook his head at once. \"No, my lady, it is not mine. My axe was plain iron.\" The spirit said nothing, but a small smile touched her lips. She dived again.","This time she returned with a silver axe, which gleamed like moonlight. The handle was carved with tiny flowers. \"Is this yours?\" she asked. Ravi looked at it with wonder, but again he shook his head. \"No, it is very beautiful, but it is not mine. Mine was old and black, with a wooden handle.\" He did not look at the silver axe a second time, though his stomach was empty and his heart was heavy.","For the third time the spirit dived, and this time she brought up a dark, worn axe with a plain wooden handle. Ravi's face lit up with joy. \"Yes! That is mine!\" he cried. \"That is my father's axe. Thank you, thank you.\" He reached out his hands as if he feared it might vanish again."],["\"You have told the truth, even when no one was watching,\" said the spirit. \"Many men would have taken the gold, and others the silver, and none would have known. But you wanted only what was yours. Your honesty is rare, and it deserves a reward. Take the gold and silver axes as well. They are my gift to you.\" Ravi could hardly believe his ears. He bowed low, again and again, and thanked her with all his heart.","He carried the three axes home, and his mother wept with joy when she saw them. They sold the gold and silver ones and bought a small field, two goats and a new roof for the house. But Ravi did not keep it all to himself. He shared his good fortune with his neighbours, helped the poorest families in the village, and never forgot that honesty was his real treasure.","Years later, when children asked him how he had become so well respected, Ravi would smile and point to his old iron axe, which hung on the wall. \"That axe taught me something,\" he would say. \"When you tell the truth, you may lose something for a moment, but you will gain something that nobody can take from you.\"","Moral: an honest heart is worth more than gold."]],"w":974},{"id":"en-kings-tea","lang":"en","title":"The King and the Cup of Tea","sub":"A tale of wisdom","cat":"story","pg":[["Long ago, in a land of green hills and quiet rivers, there ruled a wise and gentle king. He was loved by his people not because he was powerful, but because he listened to everyone, from the richest merchant to the poorest farmer. His court was famous for the learned people who came from far and wide to share their knowledge, and the king welcomed each one warmly.","One spring morning, a new visitor arrived at the palace gates. He was a scholar, tall and thin, with a long grey beard and a bundle of scrolls under his arm. He had read hundreds of books, studied the stars, learned many languages, and written long essays on law and medicine. He walked into the court with his chin held high, as if the palace was lucky to have him."],["The scholar loved to talk, and once he began he found it hard to stop. He spoke about the stars and the seasons, about kings and kingdoms, about medicine and music. When the courtiers tried to ask him a question, he cut them off and answered before they finished. \"I have heard that before,\" he would say, or, \"You are mistaken, my friend. Let me explain.\" The courtiers looked at each other and sighed.","At last he turned to the king and said with a bow, \"Your Majesty, I have heard that you are a wise ruler. I have come to see if I can be of service. I must tell you honestly that there is nothing I cannot teach. Ask me anything you wish, and I will answer.\" The court fell silent. Everyone waited to see how the king would reply."],["The king smiled politely. He was not angry, for he had met many proud men in his life, and he knew that pride is often only a cloak for fear. \"I am grateful for your offer, learned sir,\" he said. \"But you must be tired after your long journey. Please sit with me and have some tea. We can talk afterwards.\" The scholar agreed, though he was a little impatient to begin.","A servant brought a tray with a fine teapot and two small cups, and set it down on a low table between them. The steam rose in a soft curl and the smell of jasmine filled the room. The king took up the teapot, and with a gentle hand he poured tea into the scholar's cup. The scholar kept on talking, explaining something about the history of tea, and did not look at what the king was doing."],["The cup filled to the brim, but the king kept pouring. The tea spilled over the edge, ran across the saucer, and dripped onto the carpet. The courtiers gasped. A servant took a step forward, but the king raised his hand, and the servant stopped. The tea made a small dark pool on the floor, and still the king did not stop.","\"Your Majesty, stop!\" cried the scholar at last, jumping back and brushing the drops from his robe. \"What are you doing? The cup is already full. It cannot hold any more!\" The king set down the teapot and looked at him with kind eyes. There was no anger in his face at all, only a quiet understanding.","\"Exactly,\" he said gently. \"Like this cup, your mind is so full of your own opinions and ideas that nothing new can enter. You came here to teach, and you have not asked me a single question. How can I share anything with you, when there is no room to receive it? Empty your cup a little, my friend, and you will find there is always room to learn.\""],["The scholar went very quiet. His face flushed red, and for a moment he stared at the spilled tea on the carpet. Then, to everyone's surprise, he began to laugh. It was not a bitter laugh, but a warm and honest one. \"Your Majesty,\" he said, bowing deeply, \"that is the best lesson I have had in years. I have read so many books, and yet I never noticed that I had stopped listening.\"","The king invited him to stay at the court, and the scholar accepted. He stayed for many seasons. At first it was hard for him to hold his tongue. When a farmer explained how to read the clouds, he wanted to interrupt, but he remembered the cup and kept silent. When a young girl asked him a simple question about the stars, he did not scold her, but answered patiently.","He began to listen to the cooks, the gardeners, the soldiers and the children. Each of them, he found, knew something that he did not. A gardener taught him how seeds know when to wake. A boatman told him secrets about the river. With every new thing he learned, he felt his mind grow lighter, as if someone had opened a window in a crowded room."],["Little by little, he became wiser than he had ever been, and gentler too. People who had once avoided him now sought him out, because he did not just talk, he listened as well. The king often watched him from across the courtyard and smiled to himself, remembering the overflowing cup.","Moral: stay curious. A mind that thinks it knows everything has stopped learning."]],"w":892},{"id":"en-little-lamp","lang":"en","title":"The Little Lamp","sub":"An original story","cat":"story","pg":[["In the small village of Kheda, the streets were so narrow and winding that people often got lost after sunset. The houses leaned close together like old friends sharing a secret, and the lanes twisted between them in a dozen directions. In the daytime the village was bright and busy, full of the sound of bells and bargaining. But when night fell, it became as dark as the inside of a well.","There was no moon on most evenings that season, and the clouds hid the stars. Farmers coming home from distant fields tripped over stones. Mothers called their children in, afraid that they would wander the wrong way. Once, a pot seller lost his donkey in the dark, and it took the whole village until midnight to find it.","The villagers often talked about it. \"Someone should put a light at the corner,\" said one. \"The headman should do it,\" said another. \"The rich merchant has so much oil,\" said a third. They all agreed that a light was needed, and each one went home thinking, \"Someone else will surely do it.\" So night after night, nothing changed."],["At the end of the lane lived a girl named Meera. She was not rich, and she was not important. She lived with her grandmother in a tiny house with a low door, and she spent her days fetching water and helping with the cooking. She had nothing but an old clay lamp that had belonged to her grandmother, a little oil in a small bottle, and a window that faced the road.","One evening, as the sky turned from orange to grey, Meera sat by her window and listened to the sounds outside. She heard a man cough and stumble somewhere in the dark lane. She heard someone mutter that they had lost the path again. Her heart felt heavy. She looked at the old lamp on the shelf, then at the little bottle of oil. It was not much, but it was something.","She filled the lamp, lit the wick with a trembling hand, and placed it on the windowsill. It was a tiny flame, hardly brighter than a firefly. \"It will not help anyone,\" she thought. \"It is far too small.\" But she did not blow it out. She left it burning, and went to help her grandmother with the evening meal."],["That night a farmer returning from the market saw the glow and found the lane. He had been walking in circles for an hour, and he sighed with relief. A mother looking for her lost child saw it from afar and walked straight towards it, and there found the little boy sitting safely on a doorstep. An old man whose lantern had run out of oil followed the light all the way to his own door.","In the morning, the farmer came to Meera's house with a bunch of fresh radishes. \"Your little lamp saved me last night,\" he said. \"I do not know how to thank you.\" Meera was surprised. She had not known that anyone had even noticed it. \"It is only a lamp,\" she said shyly, but she felt a small warmth in her heart that had not been there before."],["The next evening, the farmer put a lamp outside his own gate. Then the mother did the same, and then the old man. The pot seller brought one too, and so did the baker and the blacksmith. Children carried lamps to the corners, and old women lit them with their shaking hands. By the end of the week, every house in the lane had a small flame in its window.","Soon the narrow lanes of Kheda shone like a river of stars. The lamps flickered softly against the old walls, and the golden light lay on the stones like spilled honey. No one tripped any more, and no one lost the way. Mothers let their children play outside after dark, and neighbours sat on their doorsteps, talking and laughing until late into the night.","Travellers from other villages heard about it and came just to walk through the glowing lanes at night. They told stories about Kheda in faraway markets, and the villagers were proud. The headman even said that the village should hold a festival to celebrate, and so they did. Everyone brought lamps, and the whole village sparkled like the sky on a clear night."],["At the festival the headman called Meera forward and thanked her in front of everyone. Meera blushed and shook her head. \"I did not light the village,\" she said. \"I only lit one lamp. You all did the rest.\" The people looked at one another, and each of them understood that it was true.","Meera's grandmother, sitting at the back, wiped her eyes and smiled. She had always told her granddaughter that a small deed done with a good heart is never wasted. And in the narrow lanes of Kheda, in the soft glow of a hundred lamps, everyone could see that she was right.","Moral: do not wait for others to begin. One small light can start something much bigger than itself."]],"w":858},{"id":"en-golden-egg","lang":"en","title":"The Goose and the Golden Eggs","sub":"A fable","cat":"story","pg":[["A farmer and his wife lived on a small plot of land at the edge of a quiet village. They were not rich. Their house had a leaking roof, their field gave only a little wheat, and their wooden cart creaked on every turn. All they had were a few animals, a cow, some hens, and a plain white goose that waddled around the yard and honked at strangers.","The couple worked from dawn until dark. In the evenings they sat by the fire, counting their few coins and wondering how they would pay for the winter. \"If only we had a little luck,\" the wife would sigh. The farmer would pat her hand and say, \"Luck comes to those who are patient.\" But in his heart he, too, was worried.","One morning, when the farmer went to feed the goose, he noticed something shining in her nest. He bent down and rubbed his eyes. It was an egg, but it was not white like other eggs. It gleamed bright yellow in the morning light. He picked it up, and it was heavy and cold in his hand. \"Wife! Come quickly!\" he cried."],["The wife came running. They turned the egg over and over, scarcely daring to believe what they saw. The farmer bit it gently, as he had once seen a trader do. It was hard and smooth. \"It is solid gold,\" he whispered. They stared at each other, and then they began to laugh and dance around the kitchen like children.","The next day they took the egg to the market and sold it to a jeweller for a great sum. They bought a new blanket, a sack of rice, and a pair of warm shoes. And the next morning there was another golden egg in the nest, and the morning after that, another. The couple were delighted, and they thanked the goose each day by feeding her the best grain."],["The goose seemed to enjoy her new life. She walked about the yard with her head held high, and she liked to sit in the sun by the well. The farmer built her a soft nest of straw, and the wife sang to her in the evenings. For the first time in many years, the couple slept well and woke up smiling. They talked of repairing the roof and of buying medicine for their old neighbour, and they thought that life could not get any better.","Soon they were rich. They mended the roof and bought a new cart. They built a bigger house, and bought fine clothes and a pair of oxen. The neighbours began to greet them with great respect. But the more they had, the more they wanted. They began to lie awake at night, thinking about all the things they still did not own."],["\"One egg a day is far too slow,\" said the wife one evening, tapping her fingers on the table. \"At this rate we shall wait years to build the grand house I dream of. Imagine how much gold must be inside her! She must be full of it.\" The farmer looked up. At first he shook his head, but the thought stayed with him, growing like a weed.","\"You are right,\" he said slowly, after a long silence. \"If we cut her open, we can have all the eggs at once. We will be the richest people in the land.\" The goose, who was pecking in the yard, looked up at them with her calm black eyes, as if she knew what they were saying. But she could not speak, and she could not run away.","They took a sharp knife and cut the goose open. But inside, she was just like any other goose. There was no gold, no hidden treasure, nothing shining. The farmer's hands began to shake. The wife covered her mouth. They had been so sure, and so greedy, that they had never stopped to ask whether it could be true. There was no gold at all, and there would never be another golden egg."],["The couple sat in silence for a very long time. The fire burned low and the room grew cold. Outside, the wind moved through the empty yard, and the nest in the corner was bare. The wife began to cry, and the farmer put his head in his hands. \"What have we done?\" he whispered. \"What have we done?\"","In the following days they tried to hold on to what they had. But money runs out faster than it comes in, and with no more golden eggs, the coins in the box grew fewer every week. Soon they had to sell the oxen, then the cart, then the fine clothes. In the end they were poorer than when they began, and far sadder.","The villagers who had once envied them now shook their heads in wonder. \"They had a treasure in their own yard,\" said the old neighbour, \"and they threw it away.\" Nobody laughed, for it was too sad to laugh at. Some of the children went to the empty nest and looked at it quietly, and their mothers told them the story so they would remember."],["Their greed had cost them the one thing that had made them rich. Often, in the evening, the farmer would walk out to the empty nest and stand there for a while. He remembered how the goose had waited each morning, faithful and quiet, giving without being asked. He wished with all his heart that he could turn back the days.","Moral: be patient and grateful for what you have. Greed can destroy the very thing that brings you good fortune."]],"w":949},{"id":"hi-hanuman-chalisa","lang":"hi","title":"हनुमान चालीसा","sub":"गोस्वामी तुलसीदास","cat":"spiritual","pg":[["श्रीगुरु चरन सरोज रज निज मनु मुकुरु सुधारि। बरनउँ रघुबर बिमल जसु जो दायकु फल चारि॥","बुद्धिहीन तनु जानिके सुमिरौं पवन-कुमार। बल बुद्धि बिद्या देहु मोहिं हरहु कलेस बिकार॥","जय हनुमान ज्ञान गुन सागर। जय कपीस तिहुँ लोक उजागर॥","राम दूत अतुलित बल धामा। अंजनि पुत्र पवनसुत नामा॥","महाबीर बिक्रम बजरंगी। कुमति निवार सुमति के संगी॥","कंचन बरन बिराज सुबेसा। कानन कुंडल कुंचित केसा॥","हाथ बज्र औ ध्वजा बिराजै। काँधे मूँज जनेऊ साजै॥","संकर सुवन केसरीनंदन। तेज प्रताप महा जग बंदन॥","बिद्यावान गुनी अति चातुर। राम काज करिबे को आतुर॥","प्रभु चरित्र सुनिबे को रसिया। राम लखन सीता मन बसिया॥","सूक्ष्म रूप धरि सियहिं दिखावा। बिकट रूप धरि लंक जरावा॥","भीम रूप धरि असुर सँहारे। रामचंद्र के काज सँवारे॥","लाय सजीवन लखन जियाये। श्रीरघुबीर हरषि उर लाये॥","रघुपति कीन्ही बहुत बड़ाई। तुम मम प्रिय भरतहि सम भाई॥","सहस बदन तुम्हरो जस गावैं। अस कहि श्रीपति कंठ लगावैं॥","सनकादिक ब्रह्मादि मुनीसा। नारद सारद सहित अहीसा॥"],["जम कुबेर दिगपाल जहाँ ते। कबि कोबिद कहि सके कहाँ ते॥","तुम उपकार सुग्रीवहिं कीन्हा। राम मिलाय राज पद दीन्हा॥","तुम्हरो मंत्र बिभीषन माना। लंकेस्वर भए सब जग जाना॥","जुग सहस्र जोजन पर भानू। लील्यो ताहि मधुर फल जानू॥","प्रभु मुद्रिका मेलि मुख माहीं। जलधि लाँघि गये अचरज नाहीं॥","दुर्गम काज जगत के जेते। सुगम अनुग्रह तुम्हरे तेते॥","राम दुआरे तुम रखवारे। होत न आज्ञा बिनु पैसारे॥","सब सुख लहै तुम्हारी सरना। तुम रक्षक काहू को डर ना॥","आपन तेज सम्हारो आपै। तीनों लोक हाँक तें काँपै॥","भूत पिसाच निकट नहिं आवै। महाबीर जब नाम सुनावै॥","नासै रोग हरै सब पीरा। जपत निरंतर हनुमत बीरा॥","संकट तें हनुमान छुड़ावै। मन क्रम बचन ध्यान जो लावै॥","सब पर राम तपस्वी राजा। तिन के काज सकल तुम साजा॥","और मनोरथ जो कोई लावै। सोई अमित जीवन फल पावै॥","चारों जुग परताप तुम्हारा। है परसिद्ध जगत उजियारा॥","साधु संत के तुम रखवारे। असुर निकंदन राम दुलारे॥"],["अष्ट सिद्धि नौ निधि के दाता। अस बर दीन जानकी माता॥","राम रसायन तुम्हरे पासा। सदा रहो रघुपति के दासा॥","तुम्हरे भजन राम को पावै। जनम जनम के दुख बिसरावै॥","अंत काल रघुबर पुर जाई। जहाँ जन्म हरि-भक्त कहाई॥","और देवता चित्त न धरई। हनुमत सेइ सर्ब सुख करई॥","संकट कटै मिटै सब पीरा। जो सुमिरै हनुमत बलबीरा॥","जै जै जै हनुमान गोसाईं। कृपा करहु गुरु देव की नाईं॥","जो सत बार पाठ कर कोई। छूटहि बंदि महा सुख होई॥","जो यह पढ़ै हनुमान चलीसा। होय सिद्धि साखी गौरीसा॥","तुलसीदास सदा हरि चेरा। कीजै नाथ हृदय महँ डेरा॥","पवनतनय संकट हरन मंगल मूरति रूप। राम लखन सीता सहित हृदय बसहु सुर भूप॥"]],"w":419},{"id":"sa-mantra-stuti","lang":"sa","title":"प्रमुख मंत्र और स्तुतियाँ","sub":"गायत्री, महामृत्युंजय, शांति पाठ और अन्य","cat":"spiritual","pg":[["ॐ भूर्भुवः स्वः। तत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि। धियो यो नः प्रचोदयात्॥","ॐ त्र्यम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम्। उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय माऽमृतात्॥","ॐ सह नाववतु। सह नौ भुनक्तु। सह वीर्यं करवावहै। तेजस्वि नावधीतमस्तु मा विद्विषावहै॥ ॐ शान्तिः शान्तिः शान्तिः॥","ॐ असतो मा सद्गमय। तमसो मा ज्योतिर्गमय। मृत्योर्मा अमृतं गमय॥ ॐ शान्तिः शान्तिः शान्तिः॥","ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते। पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते॥ ॐ शान्तिः शान्तिः शान्तिः॥","वक्रतुण्ड महाकाय सूर्यकोटि समप्रभ। निर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा॥","शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम्। प्रसन्नवदनं ध्यायेत् सर्वविघ्नोपशान्तये॥","या कुन्देन्दुतुषारहारधवला या शुभ्रवस्त्रावृता। या वीणावरदण्डमण्डितकरा या श्वेतपद्मासना। या ब्रह्माच्युतशंकरप्रभृतिभिर्देवैः सदा वन्दिता। सा मां पातु सरस्वती भगवती निःशेषजाड्यापहा॥","शान्ताकारं भुजगशयनं पद्मनाभं सुरेशं। विश्वाधारं गगनसदृशं मेघवर्णं शुभाङ्गम्। लक्ष्मीकान्तं कमलनयनं योगिभिर्ध्यानगम्यम्। वन्दे विष्णुं भवभयहरं सर्वलोकैकनाथम्॥","गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो महेश्वरः। गुरुः साक्षात् परं ब्रह्म तस्मै श्रीगुरवे नमः॥","सर्वे भवन्तु सुखिनः सर्वे सन्तु निरामयाः। सर्वे भद्राणि पश्यन्तु मा कश्चिद्दुःखभाग्भवेत्॥","कराग्रे वसते लक्ष्मीः करमध्ये सरस्वती। करमूले तु गोविन्दः प्रभाते करदर्शनम्॥"]],"w":143},{"id":"hi-aarti-sangrah","lang":"hi","title":"आरती संग्रह","sub":"जय जगदीश, गणेश, शिव, लक्ष्मी, हनुमान","cat":"spiritual","pg":[["ॐ जय जगदीश हरे, स्वामी जय जगदीश हरे। भक्त जनों के संकट, दास जनों के संकट, क्षण में दूर करे॥ ॐ जय जगदीश हरे॥","जो ध्यावे फल पावे, दुख बिनसे मन का। स्वामी दुख बिनसे मन का। सुख संपति घर आवे, सुख संपति घर आवे, कष्ट मिटे तन का॥ ॐ जय जगदीश हरे॥","मात-पिता तुम मेरे, शरण गहूँ किसकी। स्वामी शरण गहूँ मैं किसकी। तुम बिन और न दूजा, तुम बिन और न दूजा, आस करूँ जिसकी॥ ॐ जय जगदीश हरे॥","तुम पूरन परमात्मा, तुम अंतर्यामी। स्वामी तुम अंतर्यामी। पारब्रह्म परमेश्वर, पारब्रह्म परमेश्वर, तुम सबके स्वामी॥ ॐ जय जगदीश हरे॥","तुम करुणा के सागर, तुम पालनकर्ता। स्वामी तुम पालनकर्ता। मैं मूरख खल कामी, मैं सेवक तुम स्वामी, कृपा करो भर्ता॥ ॐ जय जगदीश हरे॥","तुम हो एक अगोचर, सबके प्राणपति। स्वामी सबके प्राणपति। किस विधि मिलूँ दयामय, किस विधि मिलूँ दयामय, तुमको मैं कुमति॥ ॐ जय जगदीश हरे॥","दीनबंधु दुखहर्ता, तुम रक्षक मेरे। स्वामी तुम रक्षक मेरे। करुणा हस्त बढ़ाओ, करुणा हस्त बढ़ाओ, द्वार पड़ा तेरे॥ ॐ जय जगदीश हरे॥"],["विषय-विकार मिटाओ, पाप हरो देवा। स्वामी पाप हरो देवा। श्रद्धा भक्ति बढ़ाओ, श्रद्धा भक्ति बढ़ाओ, संतन की सेवा॥ ॐ जय जगदीश हरे॥","श्री जगदीश जी की आरती जो कोई नर गावे। स्वामी जो कोई नर गावे। कहत शिवानंद स्वामी, कहत हरिहर स्वामी, सुख संपति पावे॥ ॐ जय जगदीश हरे॥","जय गणेश जय गणेश जय गणेश देवा। माता जाकी पार्वती पिता महादेवा॥","एकदंत दयावंत चार भुजाधारी। माथे सिंदूर सोहे मूसे की सवारी॥","अंधन को आँख देत कोढ़िन को काया। बाँझन को पुत्र देत निर्धन को माया॥","पान चढ़े फूल चढ़े और चढ़े मेवा। लड्डुअन का भोग लगे संत करें सेवा॥","सूर श्याम शरण आए सफल कीजे सेवा। माता जाकी पार्वती पिता महादेवा॥","ॐ जय शिव ओंकारा, स्वामी जय शिव ओंकारा। ब्रह्मा विष्णु सदाशिव अर्द्धांगी धारा॥ ॐ हर हर हर महादेव॥","एकानन चतुरानन पंचानन राजे। हंसासन गरुड़ासन वृषवाहन साजे॥ ॐ हर हर हर महादेव॥","दो भुज चार चतुर्भुज दशभुज अति सोहे। त्रिगुण रूप निरखते त्रिभुवन जन मोहे॥ ॐ हर हर हर महादेव॥"],["अक्षमाला वनमाला मुंडमाला धारी। त्रिपुरारी कंसारी कर माला धारी॥ ॐ हर हर हर महादेव॥","श्वेतांबर पीतांबर बाघंबर अंगे। सनकादिक गरुड़ादिक भूतादिक संगे॥ ॐ हर हर हर महादेव॥","कर के मध्य कमंडलु चक्र त्रिशूलधारी। सुखकारी दुखहारी जगपालन कारी॥ ॐ हर हर हर महादेव॥","ब्रह्मा विष्णु सदाशिव जानत अविवेका। प्रणवाक्षर के मध्ये ये तीनों एका॥ ॐ हर हर हर महादेव॥","काशी में विश्वनाथ विराजे नंदी ब्रह्मचारी। नित उठ दर्शन पावत रुचि रुचि भोग लगावत महिमा अति भारी॥ ॐ हर हर हर महादेव॥","त्रिगुण स्वामी जी की आरती जो कोई नर गावे। कहत शिवानंद स्वामी मनवांछित फल पावे॥ ॐ हर हर हर महादेव॥","ॐ जय लक्ष्मी माता, मैया जय लक्ष्मी माता। तुमको निसदिन सेवत, हर विष्णु विधाता॥ ॐ जय लक्ष्मी माता॥","उमा रमा ब्रह्माणी, तुम ही जग माता। सूर्य चंद्रमा ध्यावत, नारद ऋषि गाता॥ ॐ जय लक्ष्मी माता॥","दुर्गा रूप निरंजनी, सुख संपति दाता। जो कोई तुमको ध्यावत, ऋद्धि सिद्धि धन पाता॥ ॐ जय लक्ष्मी माता॥"],["तुम पाताल निवासिनी, तुम ही शुभदाता। कर्म प्रभाव प्रकाशिनी, भवनिधि की त्राता॥ ॐ जय लक्ष्मी माता॥","जिस घर में तुम रहती, तहाँ सब सद्गुण आता। सब संभव हो जाता, मन नहीं घबराता॥ ॐ जय लक्ष्मी माता॥","तुम बिन यज्ञ न होते, वस्त्र न कोई पाता। खान पान का वैभव, सब तुमसे आता॥ ॐ जय लक्ष्मी माता॥","शुभ गुण मंदिर सुंदर, क्षीरोदधि जाता। रत्न चतुर्दश तुम बिन, कोई नहीं पाता॥ ॐ जय लक्ष्मी माता॥","महालक्ष्मी जी की आरती, जो कोई नर गाता। उर आनंद समाता, पाप उतर जाता॥ ॐ जय लक्ष्मी माता॥","आरती कीजै हनुमान लला की। दुष्ट दलन रघुनाथ कला की॥","जाके बल से गिरिवर काँपे। रोग दोष जाके निकट न झाँके॥","अंजनि पुत्र महा बलदायी। संतन के प्रभु सदा सहाई॥","दे बीड़ा रघुनाथ पठाए। लंका जारि सिया सुधि लाए॥","लंका सो कोट समुद्र सी खाई। जात पवनसुत बार न लाई॥","लंका जारि असुर संहारे। सियारामजी के काज सँवारे॥","लक्ष्मण मूर्छित पड़े सकारे। आनि संजीवन प्रान उबारे॥","पैठि पाताल तोरि यम-कारे। अहिरावन की भुजा उखारे॥","बाईं भुजा असुर दल मारे। दाहिनी भुजा संतजन तारे॥","सुर नर मुनि आरती उतारें। जय जय जय हनुमान उचारें॥","कंचन थार कपूर लौ छाई। आरती करत अंजना माई॥","जो हनुमान जी की आरती गावै। बसि बैकुंठ परम पद पावै॥"]],"w":687},{"id":"bn-chatur-shiyal","lang":"bn","title":"চতুর শিয়াল","sub":"বুদ্ধির কাছে গায়ের জোর হার মানে","cat":"story","pg":[["এক ঘন বনের ধারে একটা পুরোনো আমগাছের নিচে থাকত এক শিয়াল। তার নাম ছিল চন্দন। চন্দন গায়ে ছোট, কিন্তু মাথায় ছিল অনেক বুদ্ধি। বনের সব পশুপাখি তাকে চিনত। কেউ বিপদে পড়লে চন্দনের কাছে এসে বলত, \"ভাই চন্দন, একটা উপায় বলে দাও।\" চন্দন হেসে একটা না একটা উপায় ঠিকই বলে দিত। সে জানত, গায়ের জোর না থাকলে বুদ্ধিই একমাত্র ভরসা।","সেই বনে থাকত এক বিশাল বাঘ। তার নাম ছিল ভীমা। ভীমার গর্জন শুনলে গাছের পাতা কাঁপত, পাখিরা উড়ে পালাত। সে নিজেকে বনের সবচেয়ে শক্তিমান মনে করত, আর ভাবত, সবাই তাকে ভয় পাবে, এটাই নিয়ম। কারও কথা সে শুনত না। কেউ কিছু বোঝাতে গেলে ধমক দিয়ে বলত, \"চুপ করো। আমি যা বলব, তাই হবে।\" তাই বনের প্রাণীরা সারাক্ষণ ভয়ে ভয়ে থাকত।","একদিন দুপুরে ভীমার খুব খিদে পেয়েছিল। সারা সকাল সে ঘুরেছে, কিন্তু একটা হরিণও চোখে পড়েনি। সবাই আগেই লুকিয়ে পড়েছে। রাগে গজগজ করতে করতে সে হাঁটছিল। হঠাৎ দেখে, আমগাছের নিচে চন্দন শান্ত হয়ে বসে আছে। ভীমা এক লাফে সামনে এসে গর্জে উঠল, \"আজ তোকেই খাব!\" বনের সব পাখি ভয়ে চুপ হয়ে গেল।"],["চন্দনের বুক কেঁপে উঠল, কিন্তু সে মুখে কিছু দেখাল না। সে ধীরে ধীরে উঠে দাঁড়াল, তারপর মাথা নুইয়ে বলল, \"মহারাজ, আপনি যা ইচ্ছে করুন। তবে আমাকে খেয়ে আপনার পেট ভরবে না। আমি তো এইটুকু প্রাণী। আর একটা কথা, আমি আপনাকে একটা দরকারি খবর দিতে এসেছিলাম। খবরটা না শুনেই আমাকে খেয়ে ফেললে পরে আপনার আফসোস হবে।\"","ভীমা ভুরু কুঁচকে বলল, \"কী খবর? তাড়াতাড়ি বল।\" চন্দন গলা নামিয়ে বলল, \"মহারাজ, এই বনে আজ এক নতুন বাঘ এসেছে। সে সবাইকে বলে বেড়াচ্ছে, সেই নাকি বনের আসল রাজা, আর আপনি একটা ভীতু বুড়ো বাঘ। সে আপনার জায়গা দখল করতে চায়।\" কথাটা শুনে ভীমার চোখ রাগে লাল হয়ে গেল। সে লেজ আছড়ে বলল, \"কোথায় সে? আমাকে এখনই নিয়ে চল!\"","চন্দন বলল, \"চলুন মহারাজ, আমি দেখিয়ে দিচ্ছি। তবে সে খুব চালাক। একটা গভীর কুয়োর ভেতরে দুর্গ বানিয়ে লুকিয়ে আছে। সামনে গেলেই আপনি তাকে দেখতে পাবেন।\" ভীমা আর অপেক্ষা করতে পারল না। দুজনে বনের পথ ধরে চলল। চন্দন আগে আগে, ভীমা পেছনে। চন্দন মনে মনে ভাবছিল, রাগ মানুষকে, আর বাঘকেও, অন্ধ করে দেয়। রাগী মন কিছুই ভেবে দেখে না।"],["অনেকটা হাঁটার পর তারা এক পুরোনো কুয়োর কাছে পৌঁছাল। কুয়োটা অনেকদিন কেউ ব্যবহার করেনি। ভেতরে টলটলে পরিষ্কার জল। চন্দন আঙুল তুলে ফিসফিস করে বলল, \"ওই দেখুন, ভেতরে সে বসে আছে। আপনি উঁকি দিয়ে দেখুন, আমি একটু দূরে দাঁড়াচ্ছি।\" ভীমা পা টিপে টিপে কুয়োর পাড়ে গিয়ে নিচে তাকাল।","জলের ভেতর একটা বিশাল বাঘ তার দিকে কটমট করে তাকিয়ে আছে। ভীমা গর্জন করল, জলের বাঘও গর্জন করল। ভীমা দাঁত দেখাল, জলের বাঘও দাঁত দেখাল। ভীমার আর সহ্য হলো না। \"দাঁড়া, তোকে মজা দেখাচ্ছি!\" বলে সে ঝপাং করে কুয়োর ভেতরে ঝাঁপ দিল। জলের ওপর ঢেউ উঠল, তারপর সব শান্ত হয়ে গেল। জলের বাঘটাও আর রইল না।","কুয়োটা ছিল বেশ গভীর, আর তার দেয়াল ছিল পিচ্ছিল। ভীমা অনেক চেষ্টা করল ওপরে উঠতে, কিন্তু পারল না। সে তখন বুঝল, কী বোকামি করেছে। নিজের ছায়াকে শত্রু ভেবে সে নিজেই ফাঁদে পড়েছে। কুয়োর ভেতর থেকে সে চেঁচিয়ে ডাকল, \"চন্দন, ভাই, আমাকে বাঁচাও!\" কিন্তু চন্দন তখন অনেক দূরে, বনের পথে, হাসিমুখে ফিরে যাচ্ছে।"],["সেদিন সন্ধ্যায় বনে খবর ছড়িয়ে গেল। হরিণ, খরগোশ, বানর, পাখি, সবাই চন্দনের কাছে এসে জড়ো হলো। সবাই একসঙ্গে বলল, \"চন্দন ভাই, তুমি আমাদের বাঁচিয়েছ।\" চন্দন বিনয় করে বলল, \"আমি কিছুই করিনি। শুধু একটু ভেবে কথা বলেছি। ভীমা নিজের রাগেই নিজেকে হারিয়েছে।\" তারপর অনেকদিন বনে আর কোনো ভয় ছিল না। সবাই নির্ভয়ে খেলত, গান গাইত।","শিক্ষা: গায়ের জোর যতই বেশি হোক, বুদ্ধির কাছে তা হার মানে। আর রাগ যার মাথায় চড়ে, সে সামনের বিপদটাও দেখতে পায় না। তাই বিপদের সময় ভয় পেলে চলবে না। শান্ত থেকে ভাবতে হবে, তাহলেই পথ খুঁজে পাওয়া যায়।"]],"w":589},{"id":"bn-gopal-bhar","lang":"bn","title":"গোপাল ভাঁড় আর বোকার খোঁজ","sub":"কৃষ্ণনগরের রাজসভার মজার গল্প","cat":"story","pg":[["অনেক দিন আগের কথা। কৃষ্ণনগরের রাজা কৃষ্ণচন্দ্রের সভায় ছিলেন এক মজার মানুষ, নাম গোপাল ভাঁড়। গোপাল হাসাতে পারতেন, আবার হাসির ভেতর দিয়ে এমন কথা বলতেন, যা শুনে রাজাও ভাবতে বসতেন। রাজসভায় যেদিন গোপাল থাকতেন, সেদিন সবার মুখে হাসি লেগে থাকত। মন্ত্রীরা মাঝে মাঝে হিংসে করতেন, কিন্তু রাজা গোপালকে খুব ভালোবাসতেন।","একদিন সকালে রাজা সভায় এসে বসলেন। তাঁর মুখে একটু দুষ্টু হাসি। তিনি বললেন, \"গোপাল, আমার মনে একটা প্রশ্ন জেগেছে। আমার রাজ্যে সবচেয়ে বোকা লোক কে? তুমি তো সবার খবর রাখো। যাও, তিন দিনের মধ্যে তিনজন সবচেয়ে বড় বোকা খুঁজে আনো। যদি পারো, পুরস্কার পাবে। না পারলে সভায় সবার সামনে হার মানতে হবে।\" মন্ত্রীরা মুচকি হাসলেন। তাঁরা ভাবলেন, এবার গোপাল ফাঁদে পড়েছেন।","গোপাল মাথা চুলকে বললেন, \"মহারাজ, কাজটা কঠিন। তবে চেষ্টা করে দেখি।\" তিনি একটা পুরোনো চাদর কাঁধে ফেলে, লাঠি হাতে বেরিয়ে পড়লেন। সবাই ভাবল, গোপাল এবার বিপদে। কিন্তু গোপালের মুখে কোনো চিন্তার ছাপ নেই। তিনি গুনগুন করে গান গাইতে গাইতে বাজারের পথ ধরলেন।"],["প্রথম দিন গোপাল বাজারের মোড়ে এক লোককে দেখলেন। লোকটা ঘোড়ার পিঠে বসে আছে, আর তার মাথায় মস্ত এক বোঝা। গোপাল অবাক হয়ে জিজ্ঞেস করলেন, \"ভাই, বোঝাটা ঘোড়ার পিঠে রাখলেই তো পারো। মাথায় নিয়ে কষ্ট করছ কেন?\" লোকটা গর্বের সঙ্গে বলল, \"আরে, ঘোড়া বেচারা আমাকে বইছে, তার ওপর আবার বোঝা চাপাব? আমি দয়া করে বোঝাটা নিজের মাথায় নিয়েছি!\"","গোপাল মনে মনে হেসে বললেন, \"বাহ, তোমার মতো দয়ালু মানুষ আর হয় না। চলো, রাজসভায় একবার ঘুরে আসবে। মহারাজ তোমাকে দেখে খুশি হবেন।\" লোকটা খুব খুশি হয়ে সঙ্গে চলল। গোপাল ভাবলেন, প্রথম বোকা তো পাওয়া গেল। এবার দ্বিতীয়জনকে খুঁজতে হবে।","পরদিন গোপাল নদীর ধারে গেলেন। সেখানে এক লোক রাতের অন্ধকারে হারানো আংটি খুঁজছে, কিন্তু খুঁজছে ঘরের উঠোনে, প্রদীপের আলোর নিচে। গোপাল জিজ্ঞেস করলেন, \"আংটিটা কোথায় হারিয়েছিলে?\" লোকটা বলল, \"ওই দূরের মাঠে।\" গোপাল বললেন, \"তাহলে এখানে খুঁজছ কেন?\" লোকটা বলল, \"মাঠে তো অন্ধকার, এখানে আলো আছে। আলোতেই তো খোঁজা সহজ!\"","গোপাল এবার আর হাসি চাপতে পারলেন না। তিনি লোকটার হাত ধরে বললেন, \"ভাই, তোমার বুদ্ধিতে আমি মুগ্ধ। রাজসভায় চলো।\" এবার তাঁর সঙ্গে দুজন হলো। তৃতীয় বোকার জন্য গোপাল অনেক ঘুরলেন, কিন্তু তৃতীয় দিন দুপুর পর্যন্ত কাউকে পেলেন না। তখন তিনি বসে বসে কী যেন ভাবলেন, আর একটা মজার হাসি তাঁর মুখে খেলে গেল।"],["তৃতীয় দিন বিকেলে গোপাল দুই বোকাকে নিয়ে রাজসভায় হাজির হলেন। রাজা কৌতূহল নিয়ে তাকালেন। গোপাল সব ঘটনা খুলে বললেন। শুনে রাজা হো হো করে হেসে উঠলেন, মন্ত্রীরাও হাসি চাপতে পারলেন না। রাজা বললেন, \"বাহ গোপাল, দুজন তো পেয়ে গেলে। কিন্তু তৃতীয়জন কোথায়? শর্ত তো তিনজনের।\"","গোপাল হাতজোড় করে বললেন, \"মহারাজ, তৃতীয়জনকে খুঁজে পেয়েছি, কিন্তু তাঁকে সঙ্গে আনতে পারিনি।\" রাজা জিজ্ঞেস করলেন, \"কেন? সে কি পালিয়ে গেছে?\" গোপাল বললেন, \"না মহারাজ। তিনি এই সভাতেই বসে আছেন। যিনি দুই বোকাকে আনার হুকুম দিয়ে নিজের রাজকাজ ফেলে তিন দিন ধরে অপেক্ষা করলেন, তিনি তো তৃতীয়। আর আমি তো আছিই, চতুর্থ হয়ে।\"","সভা এক মুহূর্ত চুপ হয়ে রইল। তারপর রাজা এত জোরে হেসে উঠলেন যে সিংহাসন নড়ে উঠল। তিনি বললেন, \"গোপাল, তুমি আমাকেই বোকা বানালে, আর আমি রাগ করতে পারছি না!\" তিনি গোপালকে অনেক মোহর পুরস্কার দিলেন। দুই বোকাও খালি হাতে ফিরল না। সবাই মিলে খেয়ে, গল্প করে, সেদিন সভা ভাঙল। মন্ত্রীরা সেদিন আর কিছু বললেন না।"]],"w":505},{"id":"bn-tin-prashna","lang":"bn","title":"রাজা আর তিন প্রশ্ন","sub":"কোন কাজ, কোন সময়, কোন মানুষ","cat":"story","pg":[["অনেকদিন আগে এক দেশে ছিলেন এক রাজা, নাম সুদর্শন। তিনি ছিলেন সৎ ও পরিশ্রমী। প্রজারা তাঁকে ভালোবাসত। কিন্তু রাজার মনে একটা অশান্তি ছিল। কাজ করতে গিয়ে তাঁর বারবার মনে হতো, কখনও কখনও তিনি ভুল সময়ে ভুল কাজ করে ফেলছেন, কিংবা ভুল মানুষের কথা শুনছেন। তিনি ভাবলেন, যদি তিনটা প্রশ্নের ঠিক উত্তর জানা যায়, তাহলে আর কোনো ভুল হবে না।","প্রশ্ন তিনটা ছিল এই। প্রথম, কোন সময়টা কোনো কাজ শুরু করার জন্য সবচেয়ে ভালো? দ্বিতীয়, কোন মানুষটা আমাদের কাছে সবচেয়ে দরকারি? তৃতীয়, কোন কাজটা সবচেয়ে জরুরি? রাজা ঢোল পিটিয়ে ঘোষণা করলেন, যে এই তিন প্রশ্নের ঠিক উত্তর দেবে, তাকে বিশাল পুরস্কার দেওয়া হবে। দেশ বিদেশ থেকে অনেক জ্ঞানী মানুষ এলেন।","একজন পণ্ডিত বললেন, \"মহারাজ, সবকিছুর জন্য আগে থেকে একটা সময়সারণি বানান। দিন, ঘণ্টা, মিনিট ধরে কাজ ভাগ করুন। তাহলে ঠিক সময় জানা যাবে।\" আরেকজন বললেন, \"আগে থেকে সব ঠিক করা যায় না। যিনি জ্যোতিষী বা মন্ত্রী, তাঁদের কাছ থেকে ঠিক সময় জেনে নিন।\" তৃতীয়জন বললেন, \"মন্ত্রীর পরামর্শ সবচেয়ে দরকারি।\" চতুর্থজন বললেন, \"না, সবচেয়ে দরকারি হলেন পুরোহিত।\""],["আরও কেউ বললেন যুদ্ধই সবচেয়ে জরুরি কাজ, কেউ বললেন বিদ্যা, কেউ বা ধনসম্পদ। উত্তর যত শোনা গেল, রাজার মন তত ভারী হলো। কোনো উত্তরই তাঁকে সন্তুষ্ট করল না। সবাই যা বলছে, তা অন্য কেউ ভুল বলছে। শেষে রাজা ঠিক করলেন, তিনি বনের গভীরে থাকা এক সাধুর কাছে যাবেন। লোকে বলত, সাধু কখনও রাজা বা ধনীর সঙ্গে দেখা করেন না, কিন্তু জ্ঞানী বলে তাঁর খ্যাতি আছে।","রাজা সাধারণ পোশাক পরে, একা ঘোড়ায় চেপে বনে গেলেন। সাধুর কুটিরের অনেক আগে ঘোড়াটাকে গাছের সঙ্গে বেঁধে রেখে হেঁটে এগোলেন। গিয়ে দেখলেন, সাধু কুটিরের সামনে বাগানে কোদাল দিয়ে মাটি খুঁড়ছেন। সাধুর বয়স হয়েছে, নিশ্বাস ভারী। রাজা প্রণাম করে নিজের তিনটা প্রশ্ন জানালেন। সাধু কোনো উত্তর দিলেন না। শুধু মাথা নেড়ে আবার মাটি খুঁড়তে লাগলেন।","রাজা বললেন, \"আপনি ক্লান্ত। কোদালটা আমাকে দিন, আমি কিছুক্ষণ খুঁড়ি।\" সাধু কোদালটা দিয়ে একটা পাথরের ওপর বসে পড়লেন। রাজা মাটি খুঁড়তে খুঁড়তে ঘেমে গেলেন। সূর্য ধীরে ধীরে নামতে লাগল। শেষে রাজা আবার প্রশ্নটা করলেন। সাধু তখনও কিছু বলার আগেই দূর থেকে একটা শব্দ এল। কেউ যেন গোঙাচ্ছে। দুজনেই মুখ তুলে তাকালেন।"],["বনের দিক থেকে এক লোক টলতে টলতে দৌড়ে আসছিল। তার পেট চেপে ধরা, আঙুলের ফাঁক দিয়ে রক্ত ঝরছে। সে এসে রাজার পায়ের কাছে মাটিতে পড়ে গেল, তারপর জ্ঞান হারাল। রাজা আর দেরি করলেন না। তিনি লোকটার জামা খুলে ক্ষত দেখলেন, গভীর ক্ষত। নিজের চাদর ছিঁড়ে ক্ষত বাঁধলেন, কিন্তু রক্ত থামছিল না। কাপড় বারবার ভিজে যাচ্ছিল, রাজা আবার বাঁধছিলেন।","অনেকক্ষণ পর রক্ত থামল। লোকটা চোখ খুলে জল চাইল। রাজা কুটির থেকে জল এনে তার মুখে দিলেন। ততক্ষণে সূর্য ডুবে গেছে, চারদিকে ঠান্ডা বাতাস। রাজা আর সাধু দুজনে মিলে লোকটাকে ধরে কুটিরের ভেতরে এনে বিছানায় শুইয়ে দিলেন। রাজা নিজেও এত ক্লান্ত ছিলেন যে দরজার কাছে বসেই ঘুমিয়ে পড়লেন।","সকালে ঘুম ভেঙে রাজা দেখলেন, লোকটা তাঁর দিকে অবাক হয়ে তাকিয়ে আছে। চোখে জল। সে ধীরে ধীরে বলল, \"মহারাজ, আমাকে ক্ষমা করুন। আমি আপনার শত্রু। আমার ভাইকে আপনি একবার শাস্তি দিয়েছিলেন। তাই আমি প্রতিজ্ঞা করেছিলাম, আপনাকে মারব। আজ আপনি একা বনে আসছেন শুনে আমি ঘাপটি মেরে ছিলাম। কিন্তু আপনার রক্ষীরা আমাকে দেখতে পেয়ে আঘাত করেছিল। আপনিই আমার প্রাণ বাঁচালেন।\""],["রাজা হেসে বললেন, \"তোমার ভাইকে আমি অন্যায় করেছিলাম কি না, সে কথা আমি আবার ভেবে দেখব। তুমি এখন সুস্থ হয়ে ওঠো।\" লোকটা কাঁদতে কাঁদতে বলল, \"আজ থেকে আমি আপনার বন্ধু।\" রাজা খুব খুশি হলেন। তারপর তিনি সাধুর কাছে গিয়ে আবার বললেন, \"গুরুদেব, আমার প্রশ্নের উত্তর আজও পেলাম না।\" সাধু শান্ত গলায় বললেন, \"তুমি তো উত্তর পেয়েই গেছ।\"","সাধু বললেন, \"গতকাল তুমি যদি আমার কষ্ট দেখে কোদাল না নিতে, তাহলে ফেরার পথে ওই লোকটার হাতে প্রাণ হারাতে। তাই সবচেয়ে জরুরি সময় হলো এখনই, এই বর্তমান মুহূর্ত, কারণ কেবল এখনই আমাদের হাতে কিছু করার ক্ষমতা থাকে। সবচেয়ে দরকারি মানুষ সে, যে এই মুহূর্তে তোমার সামনে আছে, কারণ কাল তার সঙ্গে আর দেখা হবে কি না কেউ জানে না। আর সবচেয়ে জরুরি কাজ হলো তার ভালো করা, কারণ মানুষ সেই জন্যই পৃথিবীতে এসেছে।\"","শিক্ষা: সবচেয়ে ভালো সময় হলো এখন, সবচেয়ে দরকারি মানুষ হলো যে আমাদের সামনে আছে, আর সবচেয়ে জরুরি কাজ হলো তার প্রতি দয়া করা। কাজ ফেলে রাখলে সুযোগ হারিয়ে যায়। তাই আজ, এখন, যে মানুষটি সামনে আছে, তার জন্য ভালো কিছু করো।"]],"w":671},{"id":"bn-chhoto-pradip","lang":"bn","title":"ছোট প্রদীপ","sub":"একটি ছোট চেষ্টার গল্প","cat":"story","pg":[["পাহাড়ের কোলে ছোট একটা গ্রাম ছিল, নাম সোনাঝুরি। গ্রামের বাইরে দিয়ে একটা সরু পথ বনের ভেতর ঢুকে নদীর ঘাটে গিয়ে মিশেছে। দিনে সেই পথে চলতে কোনো অসুবিধা হতো না। কিন্তু সন্ধ্যার পর পথটা এমন অন্ধকার হয়ে যেত যে হাতের আঙুলও দেখা যেত না। কত লোক সেই পথে হোঁচট খেয়ে পড়ত, কেউ কেউ পথ হারিয়ে ফেলত। গ্রামের সবাই এ নিয়ে অনেক দুঃখ করত, কিন্তু কেউ কিছু করত না।","সবাই বলত, \"এই অন্ধকার তো আজকের নয়, এ আমাদের ঠাকুরদার আমল থেকে আছে। এখানে আলো জ্বালানো কি একজনের কাজ? গ্রামের মোড়ল বা রাজার লোক এসে সব ঠিক করে দেবে।\" এই ভাবে বছরের পর বছর কেটে গেল। কেউ এল না, আর অন্ধকারও থেকে গেল।","সেই গ্রামে থাকত এক ছোট মেয়ে, নাম মিনু। বয়স তার বারো। বাবা ছিলেন জেলে, প্রতিদিন ভোরে নদীতে যেতেন। একদিন সন্ধ্যায় বাবা ফিরছিলেন, অন্ধকারে পা পিছলে পড়ে গেলেন। পায়ে চোট লাগল, অনেকদিন তাঁকে ঘরে বসে থাকতে হলো। মিনু কাঁদতে কাঁদতে ভাবল, এই অন্ধকারের জন্যই বাবার এত কষ্ট। কেউ যদি পথে একটা আলো রাখত!"],["পরদিন মিনু মাকে বলল, \"মা, আমাদের ঘরে একটা পুরোনো মাটির প্রদীপ আছে না? আর একটু সর্ষের তেল দাও।\" মা হেসে বললেন, \"ওই এক প্রদীপে কী হবে মা? সারা পথ তো অন্ধকার।\" মিনু বলল, \"জানি মা, সারা পথ আলো হবে না। কিন্তু অন্তত এক জায়গায় তো হবে।\" মা আর কিছু বললেন না। তিনি তেল ঢেলে দিলেন।","সন্ধ্যা নামতেই মিনু প্রদীপটা নিয়ে পথের সবচেয়ে বিপজ্জনক বাঁকে গেল। সেখানে একটা বড় পাথরের পাশে বাঁশের খুঁটি পুঁতে প্রদীপটা রাখল। দেশলাই জ্বেলে শিখাটা ধরাল। ছোট একটা হলুদ আলো কেঁপে কেঁপে উঠল। আশেপাশের কয়েক হাত জায়গা আলোকিত হলো। মিনু অনেকক্ষণ দাঁড়িয়ে দেখল, তারপর খুশি মনে বাড়ি ফিরল।","পরদিন আবার সন্ধ্যায় সে গিয়ে নতুন করে তেল ঢালল, আবার প্রদীপ জ্বালল। তার পরদিনও। গ্রামের লোকেরা যাওয়া আসার সময় দেখত, আর হাসত। কেউ বলত, \"মেয়েটা পাগল।\" কেউ বলত, \"এক ফোঁটা আলোতে কী হয়?\" ছেলেরা তাকে ঠাট্টা করত। কিন্তু মিনু কারও কথায় কান দিত না। সে প্রতিদিন নিজের কাজটা করে যেত, চুপচাপ।"],["এক রাতে ভীষণ ঝড় উঠল। আকাশ কালো, বিদ্যুৎ চমকাচ্ছে, বৃষ্টি পড়ছে মুষলধারে। সেই রাতে নদীর ঘাট থেকে কয়েকজন জেলে ফিরছিল। তাদের মধ্যে ছিল গ্রামের মোড়লের ছেলে। অন্ধকারে কেউ পথ চিনতে পারছিল না। একজন চেঁচিয়ে বলল, \"আমরা তো পথ হারিয়েছি! সামনে খাদ আছে, সাবধান!\" সবাই ভয়ে দাঁড়িয়ে গেল।","ঠিক তখনই বৃষ্টির পর্দার ভেতর দূরে একটা ছোট আলো কেঁপে উঠল। প্রদীপটা বাঁশের খুঁটিতে বাঁধা ছিল, মিনুর বাবা ঝড়ের আগে শক্ত করে ঢেকে দিয়েছিলেন। জেলেরা সেই আলো দেখে এগোল। আলোটা ছোট, কিন্তু তারা বুঝল, আলো যেখানে, পথও সেখানে। সেই আলোর দিকে হেঁটে হেঁটে তারা খাদ এড়িয়ে নিরাপদে গ্রামে পৌঁছাল।","পরদিন সকালে মোড়লের ছেলে মিনুর বাড়িতে গিয়ে বলল, \"তোমার ওই ছোট প্রদীপই কাল আমাদের প্রাণ বাঁচিয়েছে।\" কথাটা সারা গ্রামে ছড়িয়ে গেল। যারা হেসেছিল, তারা লজ্জায় মাথা নিচু করল। সেদিন সন্ধ্যায় এক বৃদ্ধ নিজের ঘর থেকে একটা প্রদীপ এনে মিনুর প্রদীপের পাশে রাখলেন। তারপর আরেকজন, তারপর আরও একজন।","কয়েকদিনের মধ্যে পুরো পথের দুই পাশে প্রদীপের সারি জ্বলে উঠল। কেউ তেল দিল, কেউ প্রদীপ বানাল, কেউ রোজ সন্ধ্যায় জ্বালানোর দায়িত্ব নিল। এখন আর কেউ ঠাকুরদার আমলের অন্ধকারের কথা বলে না। রাতের সোনাঝুরির পথ দূর থেকে দেখলে মনে হয় যেন তারাদের একটা মালা মাটিতে নেমে এসেছে। সবার আগে যে প্রদীপ জ্বলেছিল, সেটা এখনও বাঁকের কাছে আছে।","শিক্ষা: কোনো কাজ ছোট বলে ছোট নয়। একজন মানুষের একটা ছোট চেষ্টাও অন্যদের মনে সাহস জাগাতে পারে। সবাই অপেক্ষা করলে কিছুই বদলায় না। তাই বড় কিছু করার অপেক্ষা না করে আজই তোমার ছোট প্রদীপটা জ্বালাও।"]],"w":548},{"id":"bn-ghumer-golpo","lang":"bn","title":"জোনাকি আর মাঝি","sub":"ঘুমের আগে এক নদীর ধারের গল্প","cat":"story","pg":[["চলো, আজ একটা শান্ত গ্রামের গল্প শুনি। গ্রামটার নাম বকুলতলা। গ্রামের পাশ দিয়ে একটা চওড়া, শান্ত নদী বয়ে গেছে। নদীর নাম ছিল মধুমতী। সারা দিন সূর্যের আলোয় নদীর জল ঝিকমিক করে, আর সন্ধ্যা হলে সেই জলে আকাশের রং ধীরে ধীরে গোলাপি, তারপর হালকা বেগুনি হয়ে মিশে যায়। চারদিকে খুব ধীরে ধীরে সবকিছু নরম হয়ে আসে।","গ্রামের মানুষেরা সারাদিনের কাজ শেষ করে ঘরে ফিরছিল। কেউ মাঠ থেকে, কেউ বাজার থেকে। রাখাল গরুগুলোকে গোয়ালে তুলে দিচ্ছিল। গরুরা আস্তে আস্তে, একটা একটা করে, ঘাড় নেড়ে ভেতরে ঢুকছিল। তাদের গলার ঘণ্টা টুংটাং করে বাজছিল। একসময় সেই শব্দটাও থেমে গেল। আকাশে প্রথম তারাটা ফুটে উঠল, খুব ছোট, খুব শান্ত।","ঘরে ঘরে মায়েরা প্রদীপ জ্বালিয়েছেন। প্রদীপের হলুদ আলো জানালা দিয়ে উঠোনে এসে পড়েছে। কোথাও রান্নার মিষ্টি গন্ধ, কোথাও ধানের গন্ধ, কোথাও ভিজে মাটির গন্ধ। বাচ্চারা উঠোনে বসে দাদুর কাছে গল্প শুনছে। দাদু ধীরে ধীরে বলছেন, আর বাচ্চাদের চোখ একটু একটু করে ভারী হয়ে আসছে। বকুলতলায় এখন কোনো তাড়া নেই।"],["নদীর ঘাটে একটা পুরোনো নৌকা বাঁধা ছিল। নৌকাটার মাঝির নাম হরিদাস। হরিদাসের বয়স অনেক, মাথার চুল সাদা, কিন্তু তাঁর হাসিটা ছিল খুব নরম। তিনি চল্লিশ বছর ধরে এই নদীতে নৌকা বেয়েছেন। মানুষকে এপার থেকে ওপারে নিয়ে গেছেন, কখনও ধান, কখনও হাঁড়ি, কখনও বিয়ের বর। তিনি নদীটাকে নিজের বন্ধুর মতো চিনতেন, আর নদীও তাঁকে চিনত।","আজ সারাদিন হরিদাস অনেকবার নদী পার করেছেন। এখন তিনি ধীরে ধীরে নৌকার দড়ি খুলছিলেন, না, বাঁধছিলেন। আজ আর কোথাও যেতে হবে না। তিনি লগিটা নৌকার ভেতরে শুইয়ে রাখলেন। গলুইয়ের ওপর পুরোনো একটা কাপড় বিছিয়ে বসলেন। নৌকাটা জলের ওপর খুব হালকা দুলছিল, দোলনার মতো। এক দুই, এক দুই, ধীরে ধীরে।","হরিদাস নদীর দিকে তাকালেন। জল এখন প্রায় কালো, কিন্তু তাতে আকাশের তারা ভেসে আছে। তিনি আস্তে করে একটা লম্বা নিশ্বাস নিলেন, আর ছাড়লেন। বাতাসটা ঠান্ডা, কিন্তু কোনো কষ্ট দিচ্ছে না। দূরে কোথাও একটা পেঁচা ডাকল, তারপর আবার সব চুপ। হরিদাস মনে মনে বললেন, কী শান্ত রাত। এমন রাতে ঘুম আপনিই চলে আসে।"],["ঠিক তখন নদীর পাড়ের ঝোপ থেকে একটা ছোট্ট আলো ভেসে এল। সেটা ছিল একটা জোনাকি। তার নাম ছিল ঝিকিমিকি। ঝিকিমিকি খুব ছোট, তার ডানা দুটো স্বচ্ছ কাচের মতো, আর তার পেটের কাছে জ্বলছিল একটা নরম সবুজ আলো। সে জ্বলছে, নিভছে, আবার জ্বলছে। মনে হচ্ছিল, সে যেন ধীরে ধীরে কিছু একটা ফিসফিস করে বলছে।","ঝিকিমিকি নৌকার চারদিকে একবার ঘুরল। তারপর হরিদাসের কাঁধের কাছে এসে থামল। হরিদাস হাসলেন। তিনি ফিসফিস করে বললেন, \"এসো, ছোট্ট বন্ধু। আজ তুমি একা কেন?\" জোনাকি একটু জ্বলে উঠল, একটু নিভল। হরিদাস বললেন, \"ও, তুমি তোমার দলকে খুঁজছ। তারা কোথায় গেছে, সন্ধ্যাবেলা হারিয়ে ফেলেছ বুঝি?\"","জোনাকি আস্তে আস্তে নৌকার গলুইয়ের ওপর বসল। হরিদাস তাকে বিরক্ত করলেন না। তিনি শুধু বললেন, \"ভয় নেই। রাত অনেক বড়, আর আমাদের কোনো তাড়া নেই। চলো, আমরা দুজনে মিলে খুঁজি।\" ঝিকিমিকি যেন বুঝতে পারল। তার আলোটা একটু উজ্জ্বল হলো, তারপর আবার নরম হয়ে এল। সে এখন আর একা নয়।","হরিদাস লগিটা হাতে নিলেন, না, এবার তিনি দাঁড় তুললেন। নৌকাটা আস্তে আস্তে ঘাট ছেড়ে নদীর মাঝখানে এল। দাঁড়ের শব্দ হলো ছপ, ছপ, ছপ। প্রতিবার জল একটু একটু করে সরে যাচ্ছিল, আবার মিলে যাচ্ছিল। জোনাকিটা নৌকার সামনে বসে আলো দেখাচ্ছিল। ছোট সেই আলোয় নদীর জলে একটা সোনালি সবুজ রেখা পড়ছিল।"],["নদীর দুই পাড়ে বড় বড় গাছ ঘুমিয়ে আছে। তাদের ডালপালা বাতাসে সামান্য নড়ছে, যেন ঘুমের মধ্যে কেউ হাত নাড়ছে। তালগাছের মাথা আকাশ ছুঁয়েছে। বাঁশঝাড় নুয়ে নুয়ে জলের ওপর ছায়া ফেলছে। কোথাও একটা ব্যাঙ আস্তে আস্তে ডাকল, তারপর থামল। হরিদাস আর ঝিকিমিকি কেউ কিছু বলছিল না। দুজনে চুপচাপ ভেসে চলছিল।","একটু পরে তাঁরা এক জায়গায় এলেন, যেখানে নদী বাঁক নিয়েছে। সেখানে জল আরও শান্ত, একেবারে আয়নার মতো। আকাশের সব তারা সেখানে নেমে এসে ভাসছে। হরিদাস দাঁড় তুলে রাখলেন। নৌকাটা নিজে নিজেই ধীরে ধীরে এগিয়ে চলল। তিনি জোনাকিকে বললেন, \"দেখো, কত তারা। তোমার সঙ্গীরাও হয়তো এখানেই কোথাও আছে।\"","নদীর বাঁকের পর ছিল একটা পুরোনো বাঁশবন। হরিদাস নৌকাটা পাড়ের কাছে নিয়ে গেলেন। বাঁশবনের ভেতরটা অন্ধকার, কিন্তু একদম ভয়ের নয়। সেখানে ঠান্ডা, নরম একটা গন্ধ। ঝিকিমিকি ওড়ার জন্য ডানা মেলল, তারপর থামল। সে একবার জ্বলল, দুবার জ্বলল, আর চুপ করে অপেক্ষা করতে লাগল। কিছুক্ষণ কোনো উত্তর এল না।","তারপর, বহু দূরে বাঁশের ফাঁক দিয়ে একটা ছোট্ট সবুজ আলো জ্বলে উঠল। তারপর আরেকটা। আরও একটা। দেখতে দেখতে ঝাঁকে ঝাঁকে আলো ফুটে উঠল। যেন বনের ভেতর কেউ ছোট ছোট তারা ছড়িয়ে দিয়েছে। ঝিকিমিকি আনন্দে জ্বলে উঠল। সে একবার হরিদাসের মাথার চারপাশে ঘুরল, তারপর ধীরে ধীরে উড়ে চলল তাদের দিকে।"],["হরিদাস চুপ করে দেখলেন। জোনাকিরা একে অপরকে চিনতে পেরে নরম আলোয় কথা বলছিল। জ্বলছে, নিভছে, জ্বলছে। মনে হচ্ছিল, তারা যেন একটা ধীর, মিষ্টি গান গাইছে, যার কোনো শব্দ নেই। হরিদাসের মুখে হাসি ফুটল। তিনি মনে মনে ভাবলেন, কাউকে ঠিক জায়গায় পৌঁছে দেওয়ার মতো শান্তি আর কিছুতে নেই।","ঝিকিমিকি একবার ফিরে এল। সে হরিদাসের নৌকার গলুইয়ের ওপর ঘুরে ঘুরে তিনবার জ্বলল। যেন বলল, ধন্যবাদ। হরিদাস মাথা নেড়ে বললেন, \"যাও, ছোট্ট বন্ধু। তোমার ঘর তোমার জন্য অপেক্ষা করছে।\" জোনাকিটা আবার উড়ে গিয়ে বাকিদের সঙ্গে মিশে গেল। এখন হাজার হাজার ছোট আলো একসঙ্গে বাঁশবনে দুলছে, যেন একটা নরম, সবুজ মেঘ।","হরিদাস নৌকার মুখ ঘোরালেন। এবার ফেরার পালা। দাঁড় ফেলতে ফেলতে তিনি অনুভব করলেন, তাঁর শরীরটা কেমন হালকা। সারাদিনের ক্লান্তি যেন নদীর জলে একটু একটু করে ধুয়ে যাচ্ছে। বাতাসে ভেসে আসছে রাতজাগা ফুলের মিষ্টি গন্ধ। আকাশের চাঁদটা এতক্ষণে পূর্বদিকে উঠে এসেছে, গোল আর হলুদ, ঠিক একটা বড় প্রদীপের মতো।","চাঁদের আলোয় নদীটা রুপোর মতো জ্বলছে। নৌকাটা ধীরে ধীরে ভেসে চলেছে, জলের ওপর কোনো দাগ না রেখে। দূরে বকুলতলার ঘরগুলোর জানালায় প্রদীপগুলো একে একে নিভে যাচ্ছে। যেন একেকটা ঘর চোখ বুজছে। কুকুরের ডাকও থেমে গেছে। কোথাও কোনো শব্দ নেই, শুধু জলের ছলছল আর দূরের ঝিঁঝিঁর একটানা সুর।"],["হরিদাস ঘাটে ফিরে এলেন। নৌকাটা আস্তে করে কিনারায় লাগল। তিনি দড়িটা খুঁটিতে বেঁধে নিলেন। একবার নদীর দিকে তাকিয়ে মাথা নুইয়ে বললেন, \"শুভরাত্রি, মধুমতী।\" নদী যেন একটু ছলছল করে উত্তর দিল। জলের ঢেউ নৌকার গায়ে আলতো করে এসে লাগল, ঠিক যেন কেউ নরম হাতে পিঠ চাপড়ে দিচ্ছে।","গ্রামের পথ দিয়ে হরিদাস বাড়ি ফিরলেন। পথের দুই পাশে ঘুমন্ত গাছ, আর মাথার ওপর অগুনতি তারা। ঘাসের ওপর শিশির পড়তে শুরু করেছে। ঠান্ডা, কিন্তু আরামের। কোথায় যেন একটা রাতপাখি একবার ডেকে উঠল, তারপর থেমে গেল। হরিদাস উঠোনে ঢুকলেন। ঘরের ভেতর তাঁর বুড়ি স্ত্রী তাঁর জন্য ভাত ঢেকে রেখে ঘুমিয়ে পড়েছেন।","হরিদাস নিঃশব্দে হাতমুখ ধুলেন। ধীরে ধীরে খেলেন। তারপর বিছানায় গিয়ে চাদরটা গায়ে টেনে নিলেন। জানালার ফাঁক দিয়ে চাঁদের আলো এসে বালিশের পাশে পড়েছে। তিনি চোখ বন্ধ করলেন। মনের ভেতর তখনও সেই সবুজ আলোগুলো জ্বলছে আর নিভছে, জ্বলছে আর নিভছে। তাঁর নিশ্বাস ধীর হলো, আরও ধীর, আরও ধীর। একটু পরেই তিনি গভীর ঘুমে ডুবে গেলেন।"],["বকুলতলা এখন পুরোপুরি ঘুমিয়ে। গরুরা গোয়ালে চোখ বুজে জাবর কাটছে, আস্তে আস্তে, থেমে থেমে। বিড়ালটা চুলার পাশে গুটিসুটি হয়ে শুয়ে আছে। উঠোনের তুলসীতলায় একটা ছোট প্রদীপ তখনও টিমটিম করে জ্বলছে। বাতাস নরম, আকাশ পরিষ্কার। গাছের পাতারা একটু একটু দুলছে, যেন তারাও আজ রাতে ঘুমের গান শুনছে।","নদীর ওপর জোনাকিরা এখনও ভেসে বেড়াচ্ছে। ঝিকিমিকি এখন তার দলের মাঝখানে। সে একটা বাঁশপাতার ওপর বসে আছে, তার আলোটা এখন খুব ম্লান, খুব আস্তে আস্তে জ্বলছে। সে ক্লান্ত, কিন্তু খুব খুশি। একে একে অন্য জোনাকিরাও তাদের আলো কমিয়ে আনছে। সবুজ আলোগুলো একটা একটা করে মৃদু হয়ে আসছে, যেন ঘুমের দেশে যাওয়ার জন্য তৈরি হচ্ছে।","আকাশের তারারা একে অপরের দিকে তাকিয়ে মিটমিট করছে। চাঁদ ধীরে ধীরে পশ্চিমে নামছে। নদী বয়ে যাচ্ছে, খুব ধীরে, খুব নীরবে। সে জানে, সে যেখানেই যাক, রাত তাকে আগলে রাখবে। আর বকুলতলার প্রতিটা ঘরে, প্রতিটা বিছানায়, ছোট বড় সবাই এখন নিশ্চিন্তে ঘুমাচ্ছে, কারণ তারা জানে, কাল সকালে আবার সূর্য উঠবে।","শিক্ষা: দিনের শেষে সব তাড়া থামিয়ে দিতে শিখলে মন শান্ত হয়। একটা ছোট আলোও অন্ধকারে কাউকে পথ দেখাতে পারে, আর কাউকে সাহায্য করার আনন্দ ঘুমকে মিষ্টি করে তোলে। এবার তুমিও ধীরে ধীরে চোখ বন্ধ করো। নিশ্বাস নাও, নিশ্বাস ছাড়ো। নদীর জল ছলছল করছে, জোনাকিরা ঘুমিয়ে পড়ছে, চাঁদের আলো তোমার বিছানায় নরম হয়ে ঝরছে। শুভরাত্রি, সুন্দর স্বপ্ন দেখো।"]],"w":1244},{"id":"bn-kothin-pothe","lang":"bn","title":"কঠিন পথের যাত্রী","sub":"ধৈর্য আর সাহসের এক দীর্ঘ যাত্রা","cat":"story","pg":[["পাহাড়ের নিচে ছিল এক ছোট গ্রাম, নাম ঝর্ণাপুর। নামটা শুনলে মনে হয়, সেখানে বুঝি অনেক ঝর্ণা আছে, কিন্তু একসময় সত্যিই ছিল। এখন অনেক বছর ধরে বৃষ্টি কম, আর গ্রামের একমাত্র কুয়োটা শুকিয়ে এসেছে। মেয়েরা এখন দুই ক্রোশ দূরের ডোবা থেকে ঘোলা জল আনে। ফসল শুকিয়ে যাচ্ছে, গরুগুলো রোগা হয়ে গেছে, আর মানুষের মুখে হাসি কমে গেছে।","সেই গ্রামে থাকত এক মেয়ে, নাম রূপা। বয়স তার তেরো। রূপা ছিল চঞ্চল, অধৈর্য। কোনো কাজ ধীরে ধীরে করতে তার ভালো লাগত না। বই পড়তে বসলে দু পাতা পড়েই উঠে যেত, খেলায় হেরে গেলে রেগে যেত। দিদিমা বলতেন, \"রূপা, সব কিছুর একটা সময় আছে রে। তাড়াহুড়ো করলে কাজ নষ্ট হয়।\" রূপা মুখ বাঁকিয়ে বলত, \"সময়ের অপেক্ষা করলে তো গ্রাম মরে যাবে।\"","এক সন্ধ্যায় গ্রামের বুড়ো ঠাকুরদা সবাইকে বসিয়ে একটা পুরোনো কথা বললেন। তিনি বললেন, \"আমার ঠাকুরদার কাছে শুনেছি, তিনটা পাহাড়ের ওপারে এক বিশাল বনের ভেতর একটা ঝর্ণা আছে, যার জল কখনও শুকোয় না। সেই ঝর্ণাই একসময় আমাদের কুয়োয় জল দিত। কোনো কারণে তার পথ আটকে গেছে। কেউ গিয়ে দেখে এলে হয়তো রাস্তা বের হতো।\" সবাই চুপ করে রইল। কেউ যাওয়ার সাহস করল না।"],["সেই রাতে রূপা ঘুমোতে পারল না। শুয়ে শুয়ে সে শুধু ভাবল, কেউ না গেলে কে যাবে? ভোর হতেই সে একটা ঝোলায় কিছু চিড়ে, গুড়, একটা জলের বোতল আর দিদিমার দেওয়া একটা ছোট প্রদীপ ভরে নিল। তারপর মাকে সব খুলে বলল। মা অনেকক্ষণ চুপ করে রইলেন। চোখে জল, কিন্তু তিনি জানতেন, মেয়ের মনটা ঠিক করা আছে। শেষে তিনি মেয়ের কপালে হাত রেখে বললেন, \"যা, কিন্তু সাবধানে।\"","দিদিমা রূপার হাতে একটা লাঠি দিলেন। বললেন, \"মনে রাখিস, পথটা লম্বা। যে হাঁটে সে পৌঁছায়, যে দৌড়ে সে হাঁপায়। এক এক পা করে চলবি।\" রূপা মাথা নেড়ে হাসল, কিন্তু কথাটা ভালো করে বুঝল না। গ্রামের প্রান্ত পর্যন্ত অনেকে তাকে এগিয়ে দিল। তারপর সে একা ধুলোভরা পথ ধরে প্রথম পাহাড়ের দিকে হাঁটতে শুরু করল।","প্রথম দিনটা খুব ভালো কাটল। রোদ ছিল, কিন্তু বাতাস ঠান্ডা। রূপা দ্রুত পা ফেলে এগোচ্ছিল। সন্ধ্যা পর্যন্ত সে অনেকটা পথ পার হলো। রাতে এক গাছের নিচে ঝোলা মাথায় দিয়ে শুয়ে পড়ল। আকাশের তারাগুলো দেখে তার মনে হলো, এটা তো সহজ। দুই তিন দিনেই পৌঁছে যাব। কিন্তু এই ভাবনাটাই ছিল ভুল।"],["পরদিন সকালে প্রথম পাহাড় শুরু হলো। পথ খাড়া, পাথরে ভরা। রূপা আগের দিনের মতোই ছুটে ওঠার চেষ্টা করল। কিন্তু কিছুদূর গিয়েই তার দম ফুরিয়ে গেল। সে হাঁপাতে হাঁপাতে বসে পড়ল। পা কাঁপছে, বুক ধড়ফড় করছে। ওপরে তাকিয়ে দেখল, চূড়াটা তখনও কত দূরে। সে ভেবে পেল না, এই পাহাড় কি কোনোদিন শেষ হবে?","এমন সময় একজন বুড়ো কাঠুরে সেই পথ দিয়ে নামছিলেন। রূপার দিকে তাকিয়ে হেসে বললেন, \"খুকি, এত তাড়ায় কোথায় যাচ্ছিস?\" রূপা সব বলল। কাঠুরে মাথা নেড়ে বললেন, \"তুই পাহাড়ের সঙ্গে লড়ছিস। পাহাড় তো লড়াই করে না, ধৈর্য ধরলে সে নিজেই পথ দেয়। চূড়ার দিকে তাকাস না। শুধু পরের পাথরটার দিকে তাকা। তারপর তার পরেরটা।\"","রূপা কাঠুরের কথাটা মনে মনে রাখল। এবার সে চূড়ার দিকে না তাকিয়ে শুধু সামনের এক পা, তারপর পরের এক পা ফেলে চলল। আশ্চর্য, কিছুক্ষণ পর আর হাঁপাচ্ছিল না। দুপুরের মধ্যে সে চূড়ায় পৌঁছে গেল। ওপরে দাঁড়িয়ে চারদিকে তাকাতেই তার বুক ভরে গেল। সে বুঝল, ধীরে হাঁটলে পথ ছোট হয়ে যায়।"],["দ্বিতীয় পাহাড় পেরোনোর পর তার সামনে পড়ল একটা চওড়া নদী। আগের রাতে পাহাড়ে বৃষ্টি হয়েছিল, তাই নদীতে ঘোলা জল ছুটছে, ঢেউয়ের মাথায় ফেনা। রূপা পাড়ে দাঁড়িয়ে ভাবল, এক্ষুনি পেরিয়ে যাই। সে জলে এক পা দিল, আর সঙ্গে সঙ্গে স্রোত তার পা টেনে নিতে চাইল। সে ভয়ে লাফ দিয়ে পিছিয়ে এল। বুক ধুকপুক করছে। কিন্তু সে ফিরতে চাইল না।","সে ঠিক করল, কী করা যায় ভাবতে হবে। অনেকক্ষণ বসে নদীর দিকে তাকিয়ে রইল। এক সময় লক্ষ করল, স্রোতটা আস্তে আস্তে কমছে। জলের রংও পরিষ্কার হচ্ছে। সে বুঝল, নদী নিজের সময়ে শান্ত হবে। তখন সে নদীর ধারে বসে তার চিড়ে আর গুড় খেল, একটু ঘুমিয়ে নিল। এই অপেক্ষা তার কাছে আগে অসম্ভব মনে হতো, কিন্তু আজ তার মনে কোনো অস্থিরতা নেই।","বিকেলের দিকে জল অনেক নেমে এল। রূপা লাঠি দিয়ে জলের গভীরতা মেপে মেপে, ধীরে ধীরে, পাথর খুঁজে খুঁজে পা ফেলে ওপারে পৌঁছাল। জামা ভিজে গেছে, কিন্তু সে নিরাপদ। সে নদীর দিকে ফিরে তাকিয়ে মনে মনে বলল, ধন্যবাদ। সে বুঝল, কখনও কখনও থেমে থাকাটাই সবচেয়ে বুদ্ধিমানের কাজ, আর অপেক্ষা মানে হেরে যাওয়া নয়।"],["নদীর ওপারেই শুরু হলো সেই বিশাল বন। গাছগুলো এত উঁচু আর ঘন যে দিনের বেলাতেও আলো ঢোকে না। রূপা যতই এগোল, চারদিক ততই অন্ধকার হলো। সন্ধ্যা নামতেই একেবারে ঘুটঘুটে। কোথাও পাতা নড়ছে, কোথাও কোনো রাতপাখি ডেকে উঠছে, আর দূর থেকে ভেসে আসছে কোনো জন্তুর ডাক। তার বুকের ভেতর হৃৎপিণ্ড দুমদাম করে লাফাচ্ছে।","সে ঝোলা থেকে দিদিমার দেওয়া ছোট প্রদীপটা বের করল। হাত কাঁপছিল, তাই দেশলাই জ্বালাতে কয়েকবার ব্যর্থ হলো। অবশেষে প্রদীপ জ্বলল। ছোট্ট শিখাটা কাঁপতে কাঁপতে চারপাশে সামান্য আলো ছড়াল। আলোটা বেশি দূর যায় না, কিন্তু রূপা দেখল, সামনের চার পাঁচ হাত পথ পরিষ্কার। তার মনে পড়ল দিদিমার কথা, এক এক পা করে চলবি।","রূপা ভয় পেল, এটা সে অস্বীকার করল না। সে জানত, সাহস মানে ভয় না পাওয়া নয়। সাহস মানে ভয় নিয়েও এগিয়ে যাওয়া। সে নিজেকে বলল, আমি একা নই, আমার সঙ্গে আমার প্রদীপ আছে, আমার ইচ্ছা আছে। সে প্রদীপটা সামনে ধরে, ফিসফিস করে একটা গান গাইতে গাইতে ধীরে ধীরে হাঁটতে লাগল। গান গাইলে ভয়টা একটু কমে যায়।"],["রাতটা সে একটা বিশাল গাছের গুঁড়ির কোটরে কাটাল। ঠান্ডা, ভয় আর খিদে, সবকিছু একসঙ্গে। কিন্তু প্রদীপটা পাশে জ্বলছিল। একসময় তার চোখ বুজে এল। ভোরের আলো যখন গাছের ফাঁক দিয়ে ঢুকল, রূপা চোখ খুলে দেখল, সে বেঁচে আছে, আর বনটা এখন আর ভয়ের নয়, বরং সুন্দর। পাখিরা গান গাইছে, শিশিরে পাতা ঝলমল করছে।","বন পেরিয়ে শুরু হলো তৃতীয় পাহাড়। এটা আগের দুটোর চেয়ে অনেক উঁচু, আর অনেক বেশি পিচ্ছিল। কয়েকদিন ধরে হাঁটার ফলে রূপার পা ফুলে গেছে, ঝোলার খাবারও প্রায় শেষ। এক জায়গায় সে হোঁচট খেয়ে পড়ে গেল, হাঁটু ছিঁড়ে রক্ত বেরোল। তার চোখ ভরে জল এল। সে ভাবল, আর পারব না। ফিরে যাই।","কিন্তু ফিরে যাওয়ার কথা ভাবতেই তার মনে পড়ল ঝর্ণাপুরের শুকনো কুয়ো, মায়ের রোগা মুখ, ছোট ছোট বাচ্চাদের ঘোলা জলের গ্লাস। সে চোখ মুছল। নিজের কাপড় ছিঁড়ে হাঁটুতে বাঁধল। তারপর ধীরে ধীরে উঠে দাঁড়াল। আবার এক পা, তারপর আরেক পা। কঠিন পথ, তবে তার মন এখন আগের চেয়ে অনেক শক্ত।"],["তিন দিন ধরে সে ওই পাহাড়ে উঠল। কখনও হামাগুড়ি দিয়ে, কখনও লাঠিতে ভর করে। শেষ দিন সকালে, চূড়ার কাছে পৌঁছে সে একটা অদ্ভুত
