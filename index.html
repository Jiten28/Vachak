শব্দ শুনল। কুলকুল, ছলছল। জলের শব্দ! তার হৃৎপিণ্ড লাফিয়ে উঠল। সে ক্লান্ত পা টেনে টেনে শব্দের দিকে এগোল, আর পাথরের আড়াল সরিয়ে দেখল, সামনে একটা সুন্দর, স্বচ্ছ ঝর্ণা পাথর বেয়ে নেমে আসছে।","রূপা আনন্দে কেঁদে ফেলল। সে আঁজলা ভরে জল খেল। এত মিষ্টি, এত ঠান্ডা জল সে জীবনে খায়নি। অনেকক্ষণ সে ঝর্ণার ধারে বসে রইল। তারপর সে মন দিয়ে দেখল, ঝর্ণার জল কোথায় যাচ্ছে। দেখল, একটা বড় পাথর আর কিছু শুকনো ডালপালা জমে জলের পথ আটকে দিয়েছে, ফলে জল অন্য দিকে ঘুরে যাচ্ছে। ঝর্ণাপুরের দিকে আর যাচ্ছে না।","রূপা নিজের ছোট হাতে ডালপালা সরানোর চেষ্টা করল, কিন্তু পাথরটা অনেক ভারী। একা সে পারল না। তখন সে বুঝল, শুধু ঝর্ণা খুঁজে পাওয়াটাই যথেষ্ট নয়। গ্রামের সবাইকে নিয়ে আসতে হবে। সে ঝোলা ভরে ঝর্ণার জল নিল, আর পথের নিশানা মনে রাখার জন্য গাছের গায়ে ছোট ছোট চিহ্ন এঁকে এঁকে ফেরার পথে রওনা দিল।"],["ফেরার পথ আসার পথের চেয়ে সহজ লাগল, কারণ এবার সে জানত, কীভাবে হাঁটতে হয়। পাহাড়ে সে ধীরে ধীরে উঠল, নদীর ধারে অপেক্ষা করল, বনের ভেতর প্রদীপ জ্বালিয়ে এগোল। যে পথে আসার সময় তার চোখে জল এসেছিল, সেই পথেই ফিরতি যাত্রায় সে গুনগুন করে গান গাইল। সে নিজেই অবাক হলো, নিজের ভেতর এত বদল কখন এল।","একদিন সন্ধ্যায় সে ঝর্ণাপুরের সীমানায় পৌঁছাল। গ্রামের সবাই ছুটে এল। মা তাকে বুকে জড়িয়ে ধরে কাঁদলেন। দিদিমা হেসে বললেন, \"বলেছিলাম না, যে হাঁটে সে পৌঁছায়।\" রূপা ঝোলা থেকে জল বের করে সবাইকে খেতে দিল। প্রথম চুমুক খেয়েই ঠাকুরদার চোখে জল এসে গেল। তিনি বললেন, \"এ তো সেই ঝর্ণার জল, আমার ছোটবেলার স্বাদ।\"","কয়েকদিন পরেই গ্রামের তিরিশজন মানুষ কোদাল, দড়ি আর শাবল নিয়ে রূপার সঙ্গে ঝর্ণার দিকে রওনা দিল। রূপা সবার আগে আগে, নিশানা দেখিয়ে। সবাই মিলে পাথর সরাল, ডালপালা কাটল, নালা খুঁড়ল। কয়েক সপ্তাহের পরিশ্রমে ঝর্ণার জল আবার নতুন নালা বেয়ে ঝর্ণাপুরের শুকনো কুয়োর দিকে নামতে লাগল। একদিন সকালে কুয়োর তলায় জল চিকচিক করে উঠল।"],["আজ ঝর্ণাপুরে আবার ফসল ফলে। গরুরা মোটা, বাচ্চারা হাসে। কুয়োর পাশে একটা ছোট গাছ লাগানো হয়েছে, তার তলায় বসে রূপা এখন গ্রামের ছোটদের গল্প শোনায়। কেউ জিজ্ঞেস করলে সে হেসে বলে, \"আমি বিশেষ কিছু করিনি। শুধু এক এক পা করে হেঁটেছি, আর ভয় পেলেও থামিনি।\" দিদিমার সেই লাঠিটা এখনও ঘরের কোণে রাখা, যত্ন করে।","শিক্ষা: বড় লক্ষ্যে পৌঁছাতে হলে ধৈর্য আর সাহস দুটোই লাগে। তাড়াহুড়ো করলে পথ কঠিন হয়, কিন্তু এক এক পা করে এগোলে সবচেয়ে লম্বা পথও শেষ হয়। ভয় পাওয়া দোষের নয়, ভয় নিয়েও এগিয়ে যাওয়াই সাহস। আর মনে রাখতে হবে, বড় কাজ কখনও একা হয় না। যা খুঁজে পাও, সবার সঙ্গে ভাগ করে নিলে তবেই তার আসল মূল্য।"]],"w":1420}];

  }
  selectPackVoice(kind, id);
});
el.popBody.addEventListener('change', function (e) { if (e.target.id === 'popChant') { CHANT = e.target.checked; store.set('chant', CHANT); toast(CHANT ? 'Chant style on.' : 'Chant style off.', 1500); } if (e.target.id === 'popAuto') { S.auto = e.target.checked; save('auto'); el.autoAdv.checked = S.auto; } });
el.voiceBadge.onclick = openPop; el.tuneBtn.onclick = openPop;
dragSheet(el.grabPop, el.pop, function () { closePop(); });

el.fontUp.onclick = function () { S.font = Math.min(2.4, +(S.font + 0.1).toFixed(2)); save('font'); applyFont(); };
el.fontDown.onclick = function () { S.font = Math.max(1, +(S.font - 0.1).toFixed(2)); save('font'); applyFont(); };
el.tabText.onclick = function () { setView('text'); };
el.tabPage.onclick = function () { setView('page'); };
el.toc.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.p) { jump(+b.dataset.p, 0, true); closeRail(); } else if (b.dataset.o) gotoOutline(+b.dataset.o);
});
function playFrom(i) { var was = P.playing; P.token++; P.playing = false; stopAudio(); P.idx = i; markCurrent(); play(); }
(function () {
  var t = 0, sx = 0, sy = 0, span = null, fired = false;
  el.textView.addEventListener('pointerdown', function (e) { var s = e.target.closest('.u'); if (!s || s.classList.contains('silent')) return; span = s; fired = false; sx = e.clientX; sy = e.clientY; clearTimeout(t); t = setTimeout(function () { fired = true; toggleSaved(1, +s.dataset.i); if (navigator.vibrate) try { navigator.vibrate(15); } catch (x) {} }, 550); }, { passive: true });
  el.textView.addEventListener('pointermove', function (e) { if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 10) clearTimeout(t); }, { passive: true });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { el.textView.addEventListener(n, function () { clearTimeout(t); }, { passive: true }); });
  el.textView.addEventListener('contextmenu', function (e) { if (e.target.closest('.u')) e.preventDefault(); });
  el.textView.addEventListener('click', function (e) { if (fired) { fired = false; e.stopImmediatePropagation(); e.preventDefault(); } }, true);
})();
el.textView.addEventListener('click', function (e) { var s = e.target.closest('.u'); if (!s || s.classList.contains('silent')) return; playFrom(+s.dataset.i); });
el.pageView.addEventListener('click', function (e) {
  var d = e.target.closest('.ov'); if (!d) return;
  var l = +d.dataset.l, m = P.model; for (var i = 0; i < m.units.length; i++) if (m.units[i].lines.indexOf(l) >= 0) { if (m.units[i].ok) playFrom(i); return; }
});
var dragN = 0;
window.addEventListener('dragenter', function (e) { e.preventDefault(); dragN++; document.body.classList.add('dragging'); });
window.addEventListener('dragover', function (e) { e.preventDefault(); });
window.addEventListener('dragleave', function () { dragN = Math.max(0, dragN - 1); if (!dragN) document.body.classList.remove('dragging'); });
window.addEventListener('drop', function (e) {
  e.preventDefault(); dragN = 0; document.body.classList.remove('dragging');
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f && (/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name))) openPdf(f); else if (f) toast('That is not a PDF file.');
});
window.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && (el.panel.classList.contains('open') || el.rail.classList.contains('open') || el.pop.classList.contains('open'))) { closePop(); closePanel(); closeRail(); return; }
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') { closePanel(); closeRail(); return; }
  if (e.key === ' ' && tag !== 'button') { e.preventDefault(); P.playing ? pause() : play(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); } else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if ((e.key === 'h' || e.key === 'H') && tag !== 'input' && tag !== 'textarea') { toggleSaved(1); }
  else if ((e.key === 'b' || e.key === 'B') && tag !== 'input' && tag !== 'textarea') { toggleSaved(0); }
  else if (e.key === 'PageDown') { e.preventDefault(); jump(P.page + 1, 0); } else if (e.key === 'PageUp') { e.preventDefault(); jump(P.page - 1, 0); }
  else if (e.key === ']' || e.key === '[') { var a = [0.7, 0.8, 0.9, 1, 1.1, 1.25, 1.5], i = a.indexOf(closestRate(S.rate)) + (e.key === ']' ? 1 : -1); S.rate = a[Math.max(0, Math.min(a.length - 1, i))]; save('rate'); syncRate(); toast('Speed ' + S.rate + '×', 1200); if (P.playing) { var k = P.idx; P.token++; P.playing = false; stopAudio(); P.idx = k; play(); } }
});
window.addEventListener('beforeunload', savePos);
window.addEventListener('resize', (function () { var t; return function () { clearTimeout(t); t = setTimeout(function () { if (P.view === 'page') renderPageView(); }, 250); }; })());
if ('mediaSession' in navigator) {
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Vachak Reader', artist: 'Reading aloud' });
    navigator.mediaSession.setActionHandler('play', play); navigator.mediaSession.setActionHandler('pause', pause);
    navigator.mediaSession.setActionHandler('previoustrack', function () { step(-1); }); navigator.mediaSession.setActionHandler('nexttrack', function () { step(1); });
  } catch (e) {}
}


/* ---------- saved lines ---------- */
async function openSaved(x) {
  closePanel();
  if (!DOC || DOC.key !== x.k) {
    if (x.k === 'gita') await openGita(x.p);
    else if (x.k.indexOf('book:') === 0) await openBook(x.k.slice(5), x.p);
    else { toast('Open "' + x.d + '" again to jump to this line.', 4500); return; }
  }
  jump(x.p, x.i, true);
}
function buildSaved() {
  var h = '<div class="group"><span class="hint">Tap the bookmark button to save the line being read. Press and hold any line (or press H on a keyboard) to highlight it.</span>';
  if (!saved.length) h += '<div class="card"><div class="doc-meta">Nothing saved yet.</div></div>';
  var list = saved.map(function (x, n) { return [x, n]; }).reverse();
  list.forEach(function (r) {
    var x = r[0]; h += '<div class="item" data-n="' + r[1] + '"><button type="button" class="tx" style="all:unset;flex:1;min-width:0;display:grid;gap:2px;cursor:pointer" data-go="' + r[1] + '"><b>' + esc(x.t) + '</b><small>' + (x.h ? 'Highlight' : 'Bookmark') + ' · ' + esc(x.d) + ' · ' + (x.kind === 'gita' ? 'Chapter ' : 'Page ') + x.p + '</small></button><button type="button" class="rm" data-rm="' + r[1] + '" aria-label="Remove">✕</button></div>';
  });
  el.panelBody.innerHTML = h + '</div>';
  el.panelBody.onclick = function (e) {
    var g = e.target.closest('[data-go]'), rm = e.target.closest('[data-rm]');
    if (g) openSaved(saved[+g.dataset.go]); else if (rm) { saved.splice(+rm.dataset.rm, 1); saveSaved(); applyHl(); updateBm(); buildSaved(); }
  };
}

/* ---------- search ---------- */
var srchTok = 0;
function normQ(t) { return String(t).toLowerCase(); }
function snippet(t, q) {
  var lt = normQ(t), k = lt.indexOf(q); if (k < 0) return esc(t.slice(0, 120));
  var a = Math.max(0, k - 40), b = Math.min(t.length, k + q.length + 70);
  return (a ? '…' : '') + esc(t.slice(a, k)) + '<mark>' + esc(t.slice(k, k + q.length)) + '</mark>' + esc(t.slice(k + q.length, b)) + (b < t.length ? '…' : '');
}
function buildSearch() {
  var what = DOC ? DOC.title : 'nothing open';
  el.panelBody.innerHTML = '<div class="group"><div class="srch"><input type="search" id="srchQ" placeholder="Search in ' + esc(what) + '" aria-label="Search" autocomplete="off" lang="hi"><button type="button" class="btn primary" id="srchGo">Search</button></div><div id="srchOut" aria-live="polite"></div></div>';
  var run = function () { doSearch($('#srchQ').value); };
  $('#srchGo').onclick = run; $('#srchQ').onkeydown = function (e) { if (e.key === 'Enter') run(); };
  if (!DOC) $('#srchOut').innerHTML = '<div class="doc-meta">Open a book, the Gita or a PDF first.</div>';
  setTimeout(function () { var q = $('#srchQ'); if (q && !narrow.matches) q.focus(); }, 60);
}
async function doSearch(raw) {
  var q = normQ(raw).trim(), out = $('#srchOut'); if (!DOC || q.length < 2) { out.innerHTML = '<div class="doc-meta">Type at least two letters.</div>'; return; }
  var tok = ++srchTok, hits = [], MAX = 60;
  function add(p, t) { hits.push([p, t]); }
  function paint(note) {
    out.innerHTML = (note ? '<div class="doc-meta" style="margin-bottom:8px">' + note + '</div>' : '') + hits.map(function (x, n) { return '<button type="button" class="item" data-hit="' + n + '"><span class="tx"><b>' + snippet(x[1], q) + '</b><small>' + (DOC.kind === 'gita' ? 'Chapter ' : 'Page ') + x[0] + '</small></span></button>'; }).join('');
  }
  if (DOC.kind === 'gita') {
    window.GITA.forEach(function (c) { c.v.forEach(function (v) { if (hits.length >= MAX) return; var t = v[1].join(' ').replace(/।।\s*\d+\.\d+(?:-\d+\.\d+)?\s*।।/g, '').replace(/\s+/g, ' ').trim(); if (normQ(t).indexOf(q) >= 0) add(c.n, t); }); });
  } else if (DOC.kind === 'book') {
    DOC.book.pg.forEach(function (pg, i) { pg.forEach(function (p) { if (hits.length < MAX && normQ(p).indexOf(q) >= 0) add(i + 1, p); }); });
  } else if (DOC.kind === 'text') {
    spans.forEach(function (sp) { if (hits.length < MAX && normQ(sp.textContent).indexOf(q) >= 0) add(1, sp.textContent); });
  } else {
    var n = DOC.pages, doc = DOC;
    for (var pg = 1; pg <= n && hits.length < MAX; pg++) {
      if (tok !== srchTok || doc !== DOC) return;
      if (pg % 5 === 1) { out.firstChild && 0; paint('Searching… page ' + pg + ' of ' + n + ' · <button type="button" class="btn" id="srchStop">Stop</button>'); var sb = $('#srchStop'); if (sb) sb.onclick = function () { srchTok++; paint('Stopped.'); }; await new Promise(function (r) { setTimeout(r, 0); }); }
      try { var m = await getModel(pg); m.units.forEach(function (u) { if (hits.length < MAX && normQ(u.text).indexOf(q) >= 0) add(pg, u.text); }); } catch (e) {}
    }
    if (tok !== srchTok) return;
  }
  paint(hits.length ? (hits.length >= MAX ? 'Showing the first ' + MAX + ' matches.' : hits.length + ' match' + (hits.length === 1 ? '' : 'es') + '.') : 'No matches.');
  out.onclick = async function (e) {
    var b = e.target.closest('[data-hit]'); if (!b) return; var h = hits[+b.dataset.hit]; closePanel();
    await showPage(h[0], 0); var m = P.model, idx = 0;
    for (var i = 0; i < m.units.length; i++) if (normQ(m.units[i].text).indexOf(q) >= 0) { idx = i; break; }
    P.idx = idx; markCurrent(); savePos();
  };
}

/* ---------- sloka of the day ---------- */
function slokaOfDay() {
  var list = []; window.GITA.forEach(function (c) { c.v.forEach(function (v) { list.push([c, v]); }); });
  var d = new Date(), doy = Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(d.getFullYear(), 0, 0)) / 864e5);
  return list[(doy * 7 + d.getFullYear()) % list.length];
}
async function gotoVerse(ch, no) {
  await openGita(ch); var m = P.model, idx = -1;
  for (var i = 0; i < m.units.length; i++) if (m.units[i].no === no) { idx = i; break; }
  if (idx >= 0) { P.idx = idx; markCurrent(); }
  closeRail(); play();
}

/* ---------- boot ---------- */
applyPlatform(); applyPlayer(); applyTheme(); applyFont(); syncRate();
loadVoices(); checkVoiceQuality(); el.voiceTip.onclick = function () { openPanel('settings'); }; 
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = function () { loadVoices(); checkVoiceQuality(); if (el.panel.classList.contains('open') && el.panelTitle.textContent === 'Voice and reading') buildSettings(); };
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = PATHS.pdfWorker;
el.modeBtn.onclick = function () { S.mode = resolvedTheme() === 'dark' ? 'light' : 'dark'; save('mode'); applyTheme(); };
if (PATHS.pack && S.engine == null) Pack.peekLocal().then(function (ok) { if (ok && S.engine == null) { S.engine = 'pack'; checkVoiceQuality(); toast('Natural voice is selected. Getting it ready…', 4500); } }).then(function () { renderBadge(); maybeWarm(); });
Pack.onstage(function (stg) { if (stg === 'ready') setVBState('ready'); else if (stg === 'error') setVBState('error'); else setVBState('loading', stg); });
renderBadge();
(window.requestIdleCallback || function (f) { setTimeout(f, 1200); })(function () { maybeWarm(); }, { timeout: 4000 });

/* ---------- install as an app ---------- */
var deferredInstall = null;
function isStandalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
if (PATHS.sw && !isStandalone()) {
  if (isIOS) { el.installBtn.hidden = false; el.installTxt.textContent = 'Add to Home Screen'; }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; el.installBtn.hidden = false; el.installTxt.textContent = 'Install app'; });
}
el.installBtn.onclick = async function () {
  if (deferredInstall) { deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) {} deferredInstall = null; el.installBtn.hidden = true; }
  else if (isIOS) toast('Tap the Share button, then “Add to Home Screen”.', 6000);
  else toast('Use your browser menu and choose Install app.', 5000);
};
window.addEventListener('appinstalled', function () { el.installBtn.hidden = true; toast('Vachak is installed.'); });
if (PATHS.sw && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    reg.addEventListener('updatefound', function () { var w = reg.installing; if (w) w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('A new version is ready. Reload to use it.', 7000); }); });
  }).catch(function () {});
}
if ('launchQueue' in window) launchQueue.setConsumer(async function (p) { if (p && p.files && p.files.length) { var f = await p.files[0].getFile(); openPdf(f); } });
if (store.get('view', 'text') === 'page') P.view = 'text';
openGita();
window.__vachak = { openBook: openBook, Pack: Pack, P: P, S: S, play: play, pause: pause, jump: jump, openText: openText, get DOC() { return DOC; }, buildUnits: buildUnits, openPdf: openPdf };
})();
