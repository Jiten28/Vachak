ेन धनञ्जय।।18.29।।"]],[30,["प्रवृत्तिं च निवृत्तिं च कार्याकार्ये भयाभये।बन्धं मोक्षं च या वेत्ति बुद्धिः सा पार्थ सात्त्विकी।।18.30।।"]],[31,["यया धर्ममधर्मं च कार्यं चाकार्यमेव च।अयथावत्प्रजानाति बुद्धिः सा पार्थ राजसी।।18.31।।"]],[32,["अधर्मं धर्ममिति या मन्यते तमसाऽऽवृता।सर्वार्थान्विपरीतांश्च बुद्धिः सा पार्थ तामसी।।18.32।।"]],[33,["धृत्या यया धारयते मनःप्राणेन्द्रियक्रियाः।योगेनाव्यभिचारिण्या धृतिः सा पार्थ सात्त्विकी।।18.33।।"]],[34,["यया तु धर्मकामार्थान् धृत्या धारयतेऽर्जुन।प्रसङ्गेन फलाकाङ्क्षी धृतिः सा पार्थ राजसी।।18.34।।"]],[35,["यया स्वप्नं भयं शोकं विषादं मदमेव च।न विमुञ्चति दुर्मेधा धृतिः सा पार्थ तामसी।।18.35।।"]],[36,["सुखं त्विदानीं त्रिविधं श्रृणु मे भरतर्षभ।अभ्यासाद्रमते यत्र दुःखान्तं च निगच्छति।।18.36।।"]],[37,["यत्तदग्रे विषमिव परिणामेऽमृतोपमम्।तत्सुखं सात्त्विकं प्रोक्तमात्मबुद्धिप्रसादजम्।।18.37।।"]],[38,["विषयेन्द्रियसंयोगाद्यत्तदग्रेऽमृतोपमम्।परिणामे विषमिव तत्सुखं राजसं स्मृतम्।।18.38।।"]],[39,["यदग्रे चानुबन्धे च सुखं मोहनमात्मनः।निद्रालस्यप्रमादोत्थं तत्तामसमुदाहृतम्।।18.39।।"]],[40,["न तदस्ति पृथिव्यां वा दिवि देवेषु वा पुनः।सत्त्वं प्रकृतिजैर्मुक्तं यदेभिः स्यात्ित्रभिर्गुणैः।।18.40।।"]],[41,["ब्राह्मणक्षत्रियविशां शूद्राणां च परंतप।कर्माणि प्रविभक्तानि स्वभावप्रभवैर्गुणैः।।18.41।।"]],[42,["शमो दमस्तपः शौचं क्षान्तिरार्जवमेव च।ज्ञानं विज्ञानमास्तिक्यं ब्रह्मकर्म स्वभावजम्।।18.42।।"]],[43,["शौर्यं तेजो धृतिर्दाक्ष्यं युद्धे चाप्यपलायनम्।दानमीश्वरभावश्च क्षात्रं कर्म स्वभावजम्।।18.43।।"]],[44,["कृषिगौरक्ष्यवाणिज्यं वैश्यकर्म स्वभावजम्।परिचर्यात्मकं कर्म शूद्रस्यापि स्वभावजम्।।18.44।।"]],[45,["स्वे स्वे कर्मण्यभिरतः संसिद्धिं लभते नरः।स्वकर्मनिरतः सिद्धिं यथा विन्दति तच्छृणु।।18.45।।"]],[46,["यतः प्रवृत्तिर्भूतानां येन सर्वमिदं ततम्।स्वकर्मणा तमभ्यर्च्य सिद्धिं विन्दति मानवः।।18.46।।"]],[47,["श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात्।स्वभावनियतं कर्म कुर्वन्नाप्नोति किल्बिषम्।।18.47।।"]],[48,["सहजं कर्म कौन्तेय सदोषमपि न त्यजेत्।सर्वारम्भा हि दोषेण धूमेनाग्निरिवावृताः।।18.48।।"]],[49,["असक्तबुद्धिः सर्वत्र जितात्मा विगतस्पृहः।नैष्कर्म्यसिद्धिं परमां संन्यासेनाधिगच्छति।।18.49।।"]],[50,["सिद्धिं प्राप्तो यथा ब्रह्म तथाप्नोति निबोध मे।समासेनैव कौन्तेय निष्ठा ज्ञानस्य या परा।।18.50।।"]],[51,["बुद्ध्या विशुद्धया युक्तो धृत्याऽऽत्मानं नियम्य च।शब्दादीन् विषयांस्त्यक्त्वा रागद्वेषौ व्युदस्य च।।18.51।।"]],[52,["विविक्तसेवी लघ्वाशी यतवाक्कायमानसः।ध्यानयोगपरो नित्यं वैराग्यं समुपाश्रितः।।18.52।।"]],[53,["अहङ्कारं बलं दर्पं कामं क्रोधं परिग्रहम्।विमुच्य निर्ममः शान्तो ब्रह्मभूयाय कल्पते।।18.53।।"]],[54,["ब्रह्मभूतः प्रसन्नात्मा न शोचति न काङ्क्षति।समः सर्वेषु भूतेषु मद्भक्तिं लभते पराम्।।18.54।।"]],[55,["भक्त्या मामभिजानाति यावान्यश्चास्मि तत्त्वतः।ततो मां तत्त्वतो ज्ञात्वा विशते तदनन्तरम्।।18.55।।"]],[56,["सर्वकर्माण्यपि सदा कुर्वाणो मद्व्यपाश्रयः।मत्प्रसादादवाप्नोति शाश्वतं पदमव्ययम्।।18.56।।"]],[57,["चेतसा सर्वकर्माणि मयि संन्यस्य मत्परः।बुद्धियोगमुपाश्रित्य मच्चित्तः सततं भव।।18.57।।"]],[58,["मच्चित्तः सर्वदुर्गाणि मत्प्रसादात्तरिष्यसि।अथ चेत्त्वमहङ्कारान्न श्रोष्यसि विनङ्क्ष्यसि।।18.58।।"]],[59,["यदहङ्कारमाश्रित्य न योत्स्य इति मन्यसे।मिथ्यैष व्यवसायस्ते प्रकृतिस्त्वां नियोक्ष्यति।।18.59।।"]],[60,["स्वभावजेन कौन्तेय निबद्धः स्वेन कर्मणा।कर्तुं नेच्छसि यन्मोहात्करिष्यस्यवशोऽपि तत्।।18.60।।"]],[61,["ईश्वरः सर्वभूतानां हृद्देशेऽर्जुन तिष्ठति।भ्रामयन्सर्वभूतानि यन्त्रारूढानि मायया।।18.61।।"]],[62,["तमेव शरणं गच्छ सर्वभावेन भारत।तत्प्रसादात्परां शान्तिं स्थानं प्राप्स्यसि शाश्वतम्।।18.62।।"]],[63,["इति ते ज्ञानमाख्यातं गुह्याद्गुह्यतरं मया।विमृश्यैतदशेषेण यथेच्छसि तथा कुरु।।18.63।।"]],[64,["सर्वगुह्यतमं भूयः श्रृणु मे परमं वचः।इष्टोऽसि मे दृढमिति ततो वक्ष्यामि ते हितम्।।18.64।।"]],[65,["मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु।मामेवैष्यसि सत्यं ते प्रतिजाने प्रियोऽसि मे।।18.65।।"]],[66,["सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज।अहं त्वा सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः।।18.66।।"]],[67,["इदं ते नातपस्काय नाभक्ताय कदाचन।न चाशुश्रूषवे वाच्यं न च मां योऽभ्यसूयति।।18.67।।"]],[68,["य इमं परमं गुह्यं मद्भक्तेष्वभिधास्यति।भक्ितं मयि परां कृत्वा मामेवैष्यत्यसंशयः।।18.68।।"]],[69,["न च तस्मान्मनुष्येषु कश्िचन्मे प्रियकृत्तमः।भविता न च मे तस्मादन्यः प्रियतरो भुवि।।18.69।।"]],[70,["अध्येष्यते च य इमं धर्म्यं संवादमावयोः।ज्ञानयज्ञेन तेनाहमिष्टः स्यामिति मे मतिः।।18.70।।"]],[71,["श्रद्धावाननसूयश्च श्रृणुयादपि यो नरः।सोऽपि मुक्तः शुभाँल्लोकान्प्राप्नुयात्पुण्यकर्मणाम्।।18.71।।"]],[72,["कच्चिदेतच्छ्रुतं पार्थ त्वयैकाग्रेण चेतसा।कच्चिदज्ञानसंमोहः प्रनष्टस्ते धनञ्जय।।18.72।।"]],[73,["अर्जुन उवाचनष्टो मोहः स्मृतिर्लब्धा त्वत्प्रसादान्मयाच्युत।स्थितोऽस्मि गतसन्देहः करिष्ये वचनं तव।।18.73।।"]],[74,["सञ्जय उवाचइत्यहं वासुदेवस्य पार्थस्य च महात्मनः।संवादमिममश्रौषमद्भुतं रोमहर्षणम्।।18.74।।"]],[75,["व्यासप्रसादाच्छ्रुतवानेतद्गुह्यमहं परम्।योगं योगेश्वरात्कृष्णात्साक्षात्कथयतः स्वयम्।।18.75।।"]],[76,["राजन्संस्मृत्य संस्मृत्य संवादमिममद्भुतम्।केशवार्जुनयोः पुण्यं हृष्यामि च मुहुर्मुहुः।।18.76।।"]],[77,["तच्च संस्मृत्य संस्मृत्य रूपमत्यद्भुतं हरेः।","विस्मयो मे महान् राजन् हृष्यामि च पुनः पुनः।।18.77।।"]],[78,["यत्र योगेश्वरः कृष्णो यत्र पार्थो धनुर्धरः।","तत्र श्रीर्विजयो भूतिर्ध्रुवा नीतिर्मतिर्मम।।18.78।"]]]}];
window.STORIES = [{"id":"hi-betal-pehli","lang":"hi","title":"विक्रम और बेताल: पहली कहानी","sub":"लंबी कहानी · बेताल पच्चीसी की शैली में","cat":"story","pg":[["बहुत पुरानी बात है। उज्जैन नगरी में राजा विक्रमादित्य राज करते थे। वे न्यायप्रिय थे, बहादुर थे और अपने वचन के पक्के थे। दूर-दूर तक उनकी बुद्धि और साहस की चर्चा होती थी।","एक दिन एक साधु उनके दरबार में आया। वह हर रोज़ आता, राजा को एक फल भेंट करता और चुपचाप चला जाता। राजा फल कोषाध्यक्ष को सौंप देते थे। यह सिलसिला बहुत दिनों तक चला।","एक दिन एक फल एक बंदर के हाथ लग गया। बंदर ने फल तोड़ा तो उसके अंदर से एक चमकता हुआ रत्न निकला। कोषाध्यक्ष ने बाकी सारे फल तोड़े और हर फल में एक कीमती रत्न मिला। राजा हैरान रह गए।","अगले दिन राजा ने साधु से पूछा, \"आप मुझे इतने बहुमूल्य उपहार क्यों देते हैं?\" साधु ने कहा, \"राजन, मुझे आपकी थोड़ी-सी सहायता चाहिए। अमावस की रात को श्मशान में एक पीपल के पेड़ पर एक शव लटका है। आप उसे मेरे पास ले आइए।\""],["विक्रम ने बिना सोचे कहा, \"यह काम हो जाएगा।\" उनके लिए वचन देना ही काफ़ी था।","अमावस की रात थी। चारों ओर घना अँधेरा था। बादल गरज रहे थे और बीच-बीच में बिजली चमकती थी। राजा ने तलवार उठाई और अकेले श्मशान की ओर चल पड़े।","श्मशान में हवा सीटियाँ बजा रही थी। दूर कहीं सियार चीख रहे थे। विक्रम निडर होकर पीपल के पेड़ के पास पहुँचे। ऊपर देखा तो डाल पर एक शव उलटा लटका हुआ था।","उन्होंने पेड़ पर चढ़कर डाल काटी। शव धम से नीचे गिरा और ज़ोर से कराहने की आवाज़ आई। राजा चौंके, पर उन्होंने हिम्मत नहीं छोड़ी। उन्होंने शव को कंधे पर लादा और चल दिए।","तभी शव के भीतर से एक अट्टहास गूँजा। \"राजा, तू बहुत बहादुर है। पर मैं बेताल हूँ। रास्ता लंबा है, इसलिए मैं तुझे एक कहानी सुनाता हूँ।\"","बेताल बोला, \"सुन राजा, मेरी शर्त यह है कि कहानी के अंत में मैं तुझसे एक सवाल पूछूँगा। अगर तू उसका उत्तर जानते हुए भी चुप रहा, तो तेरा सिर टुकड़े-टुकड़े हो जाएगा। और अगर तूने बोल दिया, तो मैं उड़कर वापस पेड़ पर चला जाऊँगा।\""],["विक्रम मुस्कुराए। उन्होंने कहा, \"ठीक है बेताल। सुनाओ।\" और बेताल ने कहानी शुरू की।","बेताल बोला, \"बनारस में एक राजा था। उसकी एक बहुत सुंदर और गुणवान बेटी थी, जिसका नाम था मृगनयनी। जब वह विवाह के योग्य हुई तो तीन राजकुमार उससे विवाह करना चाहते थे।\"","\"राजा ने कहा कि वह इसका फैसला अपनी बेटी पर छोड़ेगा। पर इससे पहले ही एक अजीब घटना घट गई। मृगनयनी अचानक बीमार पड़ गई और कुछ ही दिनों में उसके प्राण निकल गए।\"","\"तीनों राजकुमार उसके दुख में डूब गए। पहला राजकुमार श्मशान में उसकी राख के पास बैठ गया और वहीं रहने लगा। दूसरा राजकुमार उसकी अस्थियाँ लेकर गंगा के किनारे चला गया और तपस्या करने लगा।\"","\"तीसरा राजकुमार देश-देश घूमने लगा। उसे विश्वास था कि कहीं कोई ऐसा उपाय मिलेगा, जिससे वह फिर से जीवित हो सके।\"","\"घूमते-घूमते तीसरे राजकुमार की भेंट एक ऋषि से हुई। ऋषि के पास एक ऐसी विद्या थी जिससे मरा हुआ आदमी जीवित हो सकता था। राजकुमार ने ऋषि के चरण पकड़ लिए और कई महीने उनकी सेवा की।\""],["\"ऋषि प्रसन्न हुए। उन्होंने राजकुमार को वह विद्या सिखा दी। राजकुमार दौड़ता हुआ श्मशान पहुँचा। वहाँ पहला राजकुमार राख के पास बैठा था। उसने उसे सारी बात बताई, फिर दोनों गंगा के किनारे दूसरे राजकुमार के पास गए।\"","\"तीनों ने मिलकर अस्थियाँ इकट्ठी कीं। तीसरे राजकुमार ने मंत्र पढ़ा और देखते-देखते मृगनयनी जीवित हो उठी। वह पहले से भी अधिक सुंदर लग रही थी।\"","\"पर अब एक नई समस्या खड़ी हो गई। तीनों राजकुमार उससे विवाह करना चाहते थे और तीनों का कहना था कि मृगनयनी पर उसका ही अधिकार है।\"","इतना कहकर बेताल रुक गया। फिर उसने पूछा, \"विक्रम, अब बता, इन तीनों में से मृगनयनी का सच्चा अधिकारी कौन है? याद रखना, जानते हुए भी चुप रहा तो तेरा सिर फट जाएगा।\"","विक्रम ने थोड़ी देर सोचा। फिर शांत स्वर में बोले, \"बेताल, जिस राजकुमार ने मंत्र सीखकर उसे जीवन दिया, वह तो उसका पिता जैसा हुआ, क्योंकि जीवन देने वाला पिता ही कहलाता है। जिसने अस्थियों को सँभाल कर रखा और गंगा में तपस्या की, वह पुत्र जैसा हुआ, क्योंकि वही अंतिम संस्कार करता है।\""],["\"और जो श्मशान में राख के पास बैठा रहा, वह उसका सच्चा साथी था। जिसने उसके चले जाने के बाद भी उसका साथ नहीं छोड़ा। इसलिए मृगनयनी पर उसी का अधिकार है।\"","बेताल ज़ोर से हँसा। \"वाह राजा! तेरी बुद्धि का जवाब नहीं। पर तू बोल पड़ा, इसलिए मैं चला।\" और अगले ही पल बेताल शव सहित उड़कर फिर पीपल के पेड़ पर जा लटका।","विक्रम ने एक गहरी साँस ली, पर वे हारे नहीं। उन्होंने फिर तलवार संभाली और बेताल को लाने के लिए दोबारा पेड़ की ओर चल पड़े। वे जानते थे कि जो काम शुरू किया है उसे पूरा करना ही सच्चा वचन है।","सीख: सच्चा रिश्ता वही है जो कठिन समय में भी साथ न छोड़े। और जो वचन दिया है, उसे निभाने के लिए बार-बार कोशिश करनी पड़ती है।"]],"w":826},{"id":"hi-kisan-beti","lang":"hi","title":"किसान की चतुर बेटी","sub":"लंबी कहानी · लोककथा","cat":"story","pg":[["बहुत समय पहले एक राज्य में एक राजा रहता था। वह न्यायप्रिय तो था, पर उसे अपनी बुद्धि पर बहुत घमंड था। उसे पहेलियाँ बुझाने का बड़ा शौक था। वह अक्सर अपने दरबारियों से पहेलियाँ पूछता और जब कोई जवाब नहीं दे पाता, तो खूब हँसता।","एक दिन राजा शिकार के लिए जंगल गया। लौटते समय उसे एक छोटे-से गाँव में एक झोपड़ी दिखी। झोपड़ी के बाहर एक बूढ़ा किसान और उसकी बेटी बैठे थे। राजा ने पानी माँगा तो लड़की ने स्वागत से उसे ठंडा पानी पिलाया।","राजा ने लड़की से कुछ बातें कीं। हर बात का जवाब उसने इतनी सूझ-बूझ से दिया कि राजा चकित रह गया। उसने सोचा, \"इस लड़की को परखना चाहिए।\"","अगले दिन राजा के सिपाही किसान के घर पहुँचे और बोले, \"राजा ने आदेश दिया है कि तुम तीन दिन में तीन काम करो। पहला, मेरे लिए बिना धागे के एक रस्सी बुनकर लाओ। दूसरा, ऐसा घड़ा लाओ जिसमें पानी न हो और जो भरा हुआ भी हो। तीसरा, ऐसे कपड़े पहनकर आओ जो न कपड़े हों और न बिना कपड़ों के।\""],["बूढ़ा किसान घबरा गया। उसने कहा, \"बेटी, यह तो असंभव है। अब राजा हमें सज़ा देगा।\"","बेटी मुस्कुराई। उसने कहा, \"बाबा, आप चिंता मत कीजिए। मैं सब सँभाल लूँगी।\"","अगले दिन लड़की राजा के महल पहुँची। उसके हाथ में थोड़ी-सी रेत थी। वह बोली, \"महाराज, आपने बिना धागे की रस्सी मँगाई थी। मैं रस्सी बुन सकती हूँ, पर रेत से। कृपया आप पहले एक छोटा नमूना बनाकर दिखा दीजिए, ताकि मैं उसी तरह रस्सी बुनूँ।\"","राजा चुप रह गया। वह रेत की रस्सी कैसे बनाता? अगले दिन लड़की एक घड़ा लेकर आई, जिसमें धुआँ भरा हुआ था। \"महाराज, इसमें पानी नहीं है, पर यह खाली भी नहीं है। इसमें धुआँ भरा है।\"","राजा अब भी हार नहीं मानना चाहता था। तीसरे दिन लड़की ने एक जाल अपने चारों ओर लपेटा और दरबार में पहुँची। \"महाराज, मैंने न कपड़े पहने हैं, न मैं बिना कपड़ों के हूँ। मैंने मछली पकड़ने का जाल ओढ़ रखा है।\""],["पूरा दरबार तालियों से गूँज उठा। राजा ने मान लिया कि वह लड़की उससे कहीं अधिक बुद्धिमान है।","राजा ने कहा, \"लड़की, तुमने मुझे तीन बार हरा दिया। मैं तुम्हारी बुद्धि से बहुत प्रभावित हूँ। मैं तुम्हें अपनी रानी बनाना चाहता हूँ।\"","लड़की ने कहा, \"महाराज, मैं रानी बनने को तैयार हूँ, पर मेरी एक शर्त है। आप कभी मेरी सलाह के बिना किसी का फ़ैसला नहीं करेंगे। और अगर कभी मैंने कुछ ऐसा कहा जो आपको बुरा लगे, तो आप मुझे महल से निकाल सकते हैं, पर मुझे अपनी सबसे प्रिय वस्तु ले जाने देंगे।\"","राजा ने खुशी से यह शर्त मान ली। कुछ दिनों बाद दोनों का विवाह हो गया। लड़की अब रानी थी, पर वह अपने गाँव के लोगों को कभी नहीं भूली।","कुछ महीने बीते। एक दिन दरबार में दो किसान झगड़ते हुए आए। एक के पास बैलगाड़ी थी और दूसरे के पास एक घोड़ी। रात को घोड़ी ने एक बछड़ा दिया, जो बैलगाड़ी के नीचे जाकर खड़ा हो गया।"],["बैलगाड़ी वाला बोला, \"बछड़ा मेरी बैलगाड़ी के नीचे मिला, इसलिए यह बैलगाड़ी ने जन्म दिया है। बछड़ा मेरा है।\" राजा मूर्खतापूर्ण बात पर भी कुछ सोच न सका और उसने बैलगाड़ी वाले के पक्ष में फ़ैसला सुना दिया।","घोड़ी का मालिक रोता हुआ बाहर निकला। रानी ने यह सब सुन लिया। उसने उस किसान को एक उपाय बताया। अगले दिन वह एक सूखी नदी की रेत में मछली पकड़ने का जाल लेकर बैठ गया।","राजा ने उसे वहाँ बैठा देखा तो हँसकर पूछा, \"अरे मूर्ख, सूखी रेत में मछलियाँ कहाँ से मिलेंगी?\" किसान ने जवाब दिया, \"महाराज, जब बैलगाड़ी बछड़ा दे सकती है, तो रेत में मछलियाँ क्यों नहीं मिल सकतीं?\"","राजा समझ गया कि यह जवाब किसी और ने सिखाया है। उसने सच पूछा तो किसान ने रानी का नाम ले लिया। राजा गुस्से से भर गया। \"तुमने मेरे फ़ैसले का अपमान करवाया!\"","उसने रानी से कहा, \"तुम अभी महल छोड़कर चली जाओ। शर्त के अनुसार तुम अपनी सबसे प्यारी चीज़ साथ ले जा सकती हो।\" रानी ने सिर झुकाकर कहा, \"जैसी आपकी आज्ञा। पर आज रात मैं आपके साथ अंतिम भोजन करना चाहती हूँ।\""],["राजा मान गया। भोजन में रानी ने ऐसी दवा मिला दी, जिससे राजा गहरी नींद में सो गया। रानी ने सिपाहियों से कहा कि राजा को उसके पिता की झोपड़ी तक पहुँचा दो।","सुबह राजा की आँख खुली तो वह एक झोपड़ी में लेटा था। वह हैरान होकर उठा और चिल्लाया, \"यह क्या है? मैं यहाँ कैसे आया?\"","रानी मुस्कुराती हुई सामने खड़ी थी। उसने कहा, \"महाराज, आपने कहा था कि मैं अपनी सबसे प्यारी चीज़ साथ ले जा सकती हूँ। मेरे लिए आप सबसे प्यारे हैं। इसलिए मैं आपको अपने साथ ले आई।\"","राजा कुछ देर चुप रहा। फिर उसकी आँखें नम हो गईं। उसने कहा, \"तुमने मुझे आज एक बहुत बड़ी बात सिखाई है। बुद्धि का घमंड नहीं करना चाहिए, और जिसके साथ हम जीवन बाँटते हैं, उसकी बात सुननी चाहिए।\"","वह रानी को सम्मान के साथ महल वापस ले गया। उस दिन के बाद वह हर बड़े फ़ैसले से पहले रानी की सलाह लेने लगा। राज्य में सब सुखी रहे।","सीख: असली बुद्धिमानी विनम्रता में है। जो दूसरों की सुनता है, वही सही फ़ैसला करता है।"]],"w":861},{"id":"hi-bansuri","lang":"hi","title":"चरवाहे की जादुई बाँसुरी","sub":"लंबी कहानी · मौलिक कथा","cat":"story","pg":[["हिमालय की तलहटी में बसा एक छोटा-सा गाँव था, जिसका नाम था देवकुंड। वहाँ के लोग मेहनती थे। वे भेड़ें पालते, ऊन कातते और सर्दियों के लिए अनाज जमा करते थे।","इसी गाँव में अर्जुन नाम का एक चरवाहा लड़का रहता था। वह बारह साल का था। उसके माता-पिता नहीं थे और वह अपनी बूढ़ी दादी के साथ रहता था। उसके पास भेड़ों का एक छोटा-सा झुंड था और एक पुरानी बाँसुरी, जो उसके पिता ने उसे दी थी।","अर्जुन रोज़ सुबह भेड़ों को लेकर ऊँचे चरागाह पर जाता और शाम तक बाँसुरी बजाता रहता। उसकी धुन इतनी मीठी थी कि पक्षी पेड़ों पर रुक जाते और झरने का पानी भी धीमा बहने लगता।","एक साल गाँव में भयंकर सूखा पड़ा। बारिश नहीं हुई। चरागाह की घास पीली पड़ गई और झरने सूख गए। भेड़ें दुबली होने लगीं और लोग घबरा गए।","गाँव के बुज़ुर्ग इकट्ठे हुए। एक बूढ़े ने कहा, \"कहते हैं कि पहाड़ की चोटी पर एक झील है, जो कभी नहीं सूखती। पर वहाँ जाने का रास्ता बहुत कठिन है। आज तक कोई वहाँ से लौटकर नहीं आया।\""],["सब चुप हो गए। तभी अर्जुन ने कहा, \"मैं जाऊँगा। मेरी भेड़ें भी प्यासी हैं और गाँव भी।\" बड़ों ने उसे बहुत रोका, पर अर्जुन का निश्चय पक्का था। दादी ने उसके माथे पर हाथ रखा और कहा, \"बेटा, अपनी बाँसुरी साथ ले जाना। संगीत कभी अकेला नहीं छोड़ता।\"","अगली सुबह अर्जुन अपनी बाँसुरी और थोड़ी रोटी लेकर निकल पड़ा। चढ़ाई कठिन थी। रास्ते में एक गहरी खाई आई, जिस पर एक पुराना और कमज़ोर पुल बना था। पुल के पास एक बूढ़ा कुत्ता बैठा काँप रहा था।","अर्जुन ने अपनी आधी रोटी कुत्ते को दे दी। कुत्ता पूँछ हिलाता हुआ उसके साथ चल पड़ा। पुल हिल रहा था और नीचे गहरी घाटी थी। अर्जुन डर गया। उसने धीरे से बाँसुरी उठाई और एक शांत धुन बजाई।","धुन सुनकर उसका डर कम हो गया। एक-एक कदम रखता हुआ वह पुल के पार पहुँच गया।","ऊपर चढ़ते-चढ़ते मौसम बदलने लगा। ठंडी हवा हड्डियों को चीरती थी। चारों ओर बर्फ़ ही बर्फ़ थी और रास्ता दिखाई नहीं देता था। अर्जुन थककर एक चट्टान के पास बैठ गया।"],["उसे लगा कि अब आगे नहीं जा पाएगा। तभी उसे दादी की बात याद आई। उसने बाँसुरी होंठों से लगाई और अपने गाँव की सबसे पुरानी लोरी बजाई।","धुन हवा में दूर तक फैल गई। थोड़ी देर बाद बर्फ़ की सफ़ेद चादर के बीच से एक हिम तेंदुआ निकला। अर्जुन डरकर पीछे हट गया। पर तेंदुआ उसके पास आकर चुपचाप बैठ गया, मानो संगीत सुन रहा हो।","जब धुन खत्म हुई तो तेंदुआ उठा और कुछ कदम चलकर मुड़कर देखने लगा। जैसे कह रहा हो, \"मेरे पीछे आओ।\" अर्जुन और कुत्ता उसके पीछे चल दिए। तेंदुए ने उन्हें बर्फ़ीले तूफ़ान के बीच से सुरक्षित रास्ता दिखाया।","दो दिन की कठिन यात्रा के बाद अर्जुन चोटी पर पहुँचा। वहाँ एक नीली, शांत झील थी। पानी इतना साफ़ था कि उसमें आसमान के बादल तैरते दिखाई देते थे।","अर्जुन ने झील के पास घुटनों के बल बैठकर पानी पिया। फिर उसने सोचा, \"पर मैं इस पानी को गाँव तक कैसे ले जाऊँ?\" वह सोच ही रहा था कि झील के बीच से एक बूढ़ी, तेजस्वी स्त्री प्रकट हुई। वह झील की रक्षक थी।"],["उसने कहा, \"बेटा, तुमने इतनी कठिन यात्रा की। तुम्हारे मन में लालच नहीं है, इसलिए मैं तुम्हारी सहायता करूँगी। पर पहले मुझे वही धुन सुनाओ जो तुमने रास्ते में बजाई थी।\"","अर्जुन ने बाँसुरी उठाई और पूरे मन से बजाई। झील की लहरें धुन के साथ नाचने लगीं। रक्षक की आँखों में आँसू आ गए। उसने कहा, \"बहुत दिनों बाद किसी ने इतना सच्चा संगीत सुनाया है।\"","रक्षक ने कहा, \"मैं तुम्हें वरदान देती हूँ। जब भी तुम अपनी बाँसुरी बजाओगे, तुम्हारे गाँव के सूखे झरनों में पानी लौट आएगा। पर याद रखना, इस धुन को केवल तभी बजाना जब सचमुच ज़रूरत हो, और कभी अपने लिए नहीं, सबके लिए।\"","अर्जुन ने सिर झुकाकर प्रणाम किया। लौटते समय रास्ता आसान लगा। तेंदुआ उन्हें पुल तक छोड़कर चला गया और कुत्ता खुशी से कूदता-फाँदता उसके साथ चलता रहा।","गाँव के बाहर पहुँचकर अर्जुन ने बाँसुरी उठाई और वही धुन बजाई। धुन पहाड़ों में गूँज उठी। थोड़ी देर बाद ऊँचाई से कल-कल की आवाज़ आने लगी। सूखे झरने फिर से बहने लगे। चरागाह की घास हरी हो गई।"],["गाँव के लोग दौड़कर आए। बच्चे खुशी से नाचने लगे। बूढ़े अर्जुन को आशीर्वाद देने लगे। दादी ने उसे गले से लगा लिया और उसकी आँखों में खुशी के आँसू थे।","उस दिन के बाद देवकुंड में कभी पानी की कमी नहीं हुई। हर साल जब बारिश आती, तो गाँव वाले चरागाह पर इकट्ठे होते और अर्जुन की धुन पर मिलकर गाते।","अर्जुन बड़ा होकर पूरे इलाके का सबसे प्रसिद्ध बाँसुरी वादक बना। पर वह हमेशा कहता था, \"यह धुन मेरी नहीं है। यह उस साहस की है जो डर के बावजूद आगे बढ़ता है, और उस दया की है जो रास्ते में मिले हर साथी का हाथ थाम लेती है।\"","सीख: साहस, दया और सच्चे मन से किया गया काम सबसे बड़ी कठिनाई को भी आसान बना देता है।"]],"w":843},{"id":"en-three-questions","lang":"en","title":"The King's Three Questions","sub":"A longer tale · inspired by an old folk story","cat":"story","pg":[["Once there was a king who believed that if he could only answer three questions, he would never fail in anything he did. The questions were these. When is the right time to begin anything? Who are the right people to listen to? And what is the most important thing to do?","He sent out a proclamation across the kingdom. Anyone who could give the right answers would receive a great reward. Scholars, priests, soldiers and merchants came to the palace, and each of them gave a different answer.","One said, \"You must plan every hour in advance.\" Another said, \"You must have wise counsellors.\" A third said, \"The most important thing is to defend the kingdom.\" The king listened to all of them and was not satisfied with any answer.","At last the king heard of a hermit who lived in the forest beyond the river. The hermit was said to be very wise, and he never left his hut or spoke to anyone who was rich or powerful."],["The king dressed himself as a simple traveller, left his guards at the edge of the forest, and walked the last few miles alone. When he reached the hut, he found the old hermit digging a garden bed in front of his door.","The hermit nodded politely, but kept working. He was thin and tired, and each time he pushed the spade into the hard earth, he breathed heavily.","\"I have come to ask you three questions,\" said the king. \"When is the right time to begin anything? Who are the people I should listen to? And what is the most important thing to do?\"","The hermit did not answer. He only wiped his forehead and went on digging.","The king said, \"You look tired. Give me the spade, and I will help you.\"","The hermit thanked him and handed over the spade. The king dug one bed, and then another. The sun climbed high in the sky. When the king stopped to ask his questions again, the hermit only pointed to the next row."],["By late afternoon the king was sore and weary. He said, \"I came for answers. If you cannot give them, tell me, and I will go home.\"","At that moment, a man came running out of the forest. His shirt was red with blood, and he held his hands against his stomach. He fell at the king's feet and lay still.","The king and the hermit lifted the man and carried him into the hut. The king washed the wound, bandaged it with a clean cloth, and stayed beside the stranger through the long evening.","When the moon rose, the stranger opened his eyes and looked at the king. \"Forgive me,\" he whispered. \"I am your enemy. Years ago you took my land and my brother. When I heard you had gone to see the hermit alone, I decided to wait for you on the road and kill you.\"","\"But your guards found me instead, and I was wounded. If you had not helped me, I would have died. I came to harm you, and you saved my life.\""],["The king was moved. He said, \"I forgive you, and I will return your land. I will send my own physician to treat you.\"","The next morning, the king went to the hermit to say goodbye. \"Wise man,\" he said, \"I still have not received my answers.\"","The hermit smiled. \"But you have received them already. If you had not stopped to help me yesterday, you would have gone home alone, and that man would have killed you. So the most important time was the time when you were digging. The most important person was the one in front of you. And the most important thing was to do him good.\"","\"There is only one time that matters, and it is now. The most important person is whoever is with you. And the most important work is to be kind to that person, because that is the reason we are alive.\"","The king bowed deeply. He went back to his palace and ruled with patience and kindness for the rest of his life.","Moral: the present moment, the person before you, and a kind act are the three things that matter most."]],"w":716},{"id":"en-weaver-cloth","lang":"en","title":"The Weaver and the Invisible Cloth","sub":"A longer tale · inspired by Hans Christian Andersen","cat":"story","pg":[["In a bright city by the sea lived an emperor who cared about nothing so much as his clothes. He changed his outfit every hour. Other kings called a council when they had business to discuss. The people of this city said, \"The emperor is in his wardrobe.\"","He had a coat for the morning, a coat for noon, and a different coat for each of the gatherings in the evening. He spent most of the kingdom's money on silk and gold thread, and he rarely listened to his ministers.","One day two strangers arrived in the city. They said they were weavers, and that they could make the most beautiful cloth in the world.","\"Our cloth has an extraordinary quality,\" they told the emperor. \"Anyone who is unfit for his position, or too foolish to see the truth, will be unable to see it at all.\"","The emperor was delighted. \"What a wonderful way to find out who is wise and who is a fool!\" he thought. He gave the weavers a bag of gold coins, the finest silk and the purest gold thread, and the use of two looms in a quiet room."],["The weavers set up the looms and pretended to work. They moved their hands and shuttles through the air all day and all night. But the looms were empty. The silk and the gold thread went into their own bags.","After a few days the emperor grew curious. He said, \"I would like to know how the cloth is coming along. But what if I cannot see it?\" He decided to send his oldest and most trusted minister first.","The minister walked into the room and saw two men working at empty looms. He opened his eyes wide. He saw nothing. \"Heavens,\" he thought, \"am I a fool? Or unfit for my post? I must not let anyone find out.\"","\"What do you think of it?\" asked the weavers, waving their hands at the empty frames. \"Magnificent,\" said the minister. \"What colours! What patterns! I shall tell the emperor that I am very pleased.\""],["The weavers thanked him and asked for more gold thread. The minister reported to the emperor that the cloth was wonderful.","The emperor sent another official, and then another. Each one saw nothing, and each one praised the cloth in the same way, because none dared to be the first to admit it.","At last the emperor decided to visit the looms himself, with a crowd of courtiers behind him. When he entered the room, his heart sank. \"I see nothing at all!\" he thought. \"Am I not fit to be emperor? That would be the worst thing that could happen.\"","But aloud he said, \"Beautiful! It has my full approval.\" The courtiers all nodded and cried, \"Beautiful, Your Majesty! Splendid!\" One even suggested that he wear the new suit in the grand procession the following week.","On the night before the procession, the weavers stayed up late with sixteen candles, so that everyone could see how hard they were working. They pretended to take the cloth from the loom, cut the air with huge scissors and sew with needles that held no thread."],["On the morning of the procession, the two weavers helped the emperor undress and then pretended to fit the new clothes on him piece by piece. \"Here are the trousers. Here is the coat. Here is the cloak. It is all as light as a spider's web!\"","The emperor turned in front of the mirror, as if he could see everything. The chamberlains bent down and pretended to pick up the train.","And so the emperor walked out under a beautiful canopy, in front of the entire city.","The people lined the streets. Everyone had heard about the magic cloth and had been waiting to find out who among their neighbours was a fool. \"How splendid the emperor's new clothes are!\" they called, because no one wanted to be thought unfit or stupid.","Then a small child, who did not care about being clever, pointed at the emperor and said in a loud, clear voice, \"But he has nothing on!\""],["\"Listen to the innocent child!\" said her father. The whisper spread through the crowd from person to person. \"He has nothing on! A child says he has nothing on!\" At last, the whole crowd was shouting it.","The emperor shivered, because he suspected they were right. But he thought, \"I must go through with the procession.\" So he held his head higher than before, and the chamberlains walked behind him, holding the train that was not there.","Moral: speak the truth even when everyone else is afraid to. A child's honest eyes can be wiser than a court full of flatterers."]],"w":794},{"id":"en-mountain-village","lang":"en","title":"The Boy Who Brought the Spring","sub":"A longer tale · an original story","cat":"story","pg":[["High in the mountains there was a village called Sunmarg, so far above the valleys that the clouds often floated below its houses. The people kept goats, grew barley, and spun wool. They were poor, but they were proud of the beauty around them.","In one small house lived a boy named Tashi, who was eleven. His grandfather taught him the names of the stars and the paths of the mountain, and he told him an old story: that deep in the mountains, beyond the Seven Ridges, there was a spring that never froze, even in the coldest winter.","Nobody in the village had ever found it. Most people thought it was only a story.","One year the winter came early and stayed long. Snow lay on the roofs until it was spring everywhere else. The stream that fed the village froze solid, and the wells ran dry. The villagers melted snow for water, but there was never enough, and the goats grew thin."],["The elders met in the village hall. \"We cannot stay here,\" said the oldest of them. \"If this goes on, we must leave for the valley.\" The thought made everyone sad, because Sunmarg had been their home for a hundred years.","That night Tashi lay awake. He remembered his grandfather's story. In the morning he packed a flask, a blanket, a bag of roasted barley and his grandfather's old walking stick, and he set off towards the Seven Ridges before anyone woke.","The first ridge was easy. The second was steep, and Tashi had to use his hands to climb. On the third ridge a snowstorm closed in, and for hours he sheltered in a cave, listening to the wind. He ate a handful of barley and slept a little.","On the fourth ridge he found a small goat caught in a crack between two rocks. It bleated in fear. Tashi worked for an hour with the stick until the rocks loosened, and he freed it. The goat was tiny and shivering, and it followed him like a shadow from then on. He named it Moti."],["By the fifth ridge his flask was empty and his lips were cracked. He chewed snow, but it only made him colder. Moti nuzzled his hand. \"I know,\" said Tashi quietly. \"But we have come too far to turn back.\"","On the sixth ridge there was a deep gorge with nothing but a thin ice bridge. Tashi stood at the edge, afraid. He tested the ice with his stick, and it cracked. Then Moti walked calmly onto it, step after careful step, as if she knew. Tashi followed in her footprints, and the bridge held.","At the top of the seventh ridge the wind suddenly stopped. Below him lay a small, green valley, warm and quiet, as if it had been tucked away from the winter. Steam rose from the middle of it.","There, between mossy rocks, Tashi found the spring. The water bubbled out of the ground and ran in a bright, clear stream down the hillside. It was warm to the touch, and when he drank, he felt his strength return."],["He filled his flask and sat down on the grass to rest. For the first time in days, he laughed out loud. The story was true.","But he also noticed something else. The water ran down the valley and vanished into a heap of boulders and fallen ice. The spring had been flowing for years, but it had no way to reach the village. A landslide had blocked the old channel.","Tashi studied the rocks for a long time. He could not move them alone, but he could clear a path through the small stones, so the water would find its own way around the big ones. He worked until the stars came out.","He slept in the valley that night, wrapped in his blanket with Moti pressed against his side. In the morning he went back to work. By noon a thin ribbon of water had begun to trickle along the new channel and over the ridge."],["It was a start, but he knew it would take more hands. He filled his flask, called Moti, and began the long climb home to bring the others.","It took him three days to reach Sunmarg. When the villagers saw him, thin and weary but smiling, they ran to meet him. He held out the flask. \"It is warm,\" he said. \"The spring is real. We only need to open the way.\"","The elders listened in silence. Then the oldest of them said, \"A child has found what we stopped believing in. We must go.\"","The next morning, every able man, woman and older child set out with shovels and ropes. Tashi led them, with Moti trotting beside him. They crossed the Seven Ridges together, carrying the weak and helping each other over the ice bridge.","In the hidden valley they worked for four days. They moved boulders with ropes and levers, dug a channel along the old path, and lined it with flat stones. On the fourth evening the last rock was lifted, and the water leapt forward into the new channel."],["It ran down the ridge, round the bend and into the village stream. The ice cracked and began to melt. By the next morning, Sunmarg could hear running water for the first time in months.","That year, the barley grew greener than it had ever been, and the goats grew fat. Every spring after that, the villagers walked to the hidden valley, repaired the channel and held a festival by the warm water.","Tashi grew up to be the village's guide, and he taught every child the names of the stars and the way across the Seven Ridges. When people asked him how he had found the spring, he always said the same thing.","\"I did not find it because I was brave. I found it because I believed my grandfather, and because I was not alone. A small goat and a lot of stubbornness are enough to start.\"","Moral: a hard journey is easier when you keep faith and help whoever you meet, and a great task is best finished with many hands."]],"w":1038},{"id":"hi-chandni-nagar","lang":"hi","title":"चाँदनी नगर की रात","sub":"रात की कहानी · धीरे-धीरे नींद की ओर","cat":"story","pg":[["पहाड़ों की गोद में एक छोटा-सा नगर बसा था, जिसका नाम था चाँदनी नगर। वहाँ की रातें बहुत शांत होती थीं। जब सूरज ढल जाता, तो आसमान में चाँद धीरे-धीरे ऊपर उठता और पूरे नगर पर चाँदी जैसी रोशनी बिखेर देता। घरों की छतें चमकने लगतीं, गलियों में हल्की-हल्की परछाइयाँ उतर आतीं और हवा में चमेली की खुशबू तैरने लगती।","इसी नगर के आख़िरी छोर पर, एक पुराने नीम के पेड़ के पास, एक छोटा-सा घर था। उसमें चंदा नाम की एक नन्ही लड़की अपनी नानी के साथ रहती थी। चंदा आठ साल की थी। उसकी आँखें बड़ी-बड़ी थीं और उसे सवाल पूछना बहुत पसंद था। दिन भर वह तितलियों के पीछे दौड़ती, पेड़ों से बातें करती और नदी में पत्ते बहाती। पर रात होते ही उसे एक अजीब-सी परेशानी घेर लेती। उसे नींद नहीं आती थी।","उस रात भी यही हुआ। नानी ने उसे कंबल ओढ़ाया, माथे पर हाथ फेरा और बोलीं, \"बेटा, अब आँखें बंद करो। सपनों की नाव तुम्हारा इंतज़ार कर रही है।\" फिर वे अपने कमरे में चली गईं। चंदा ने आँखें बंद कीं, पर थोड़ी ही देर में फिर खोल दीं। खिड़की के बाहर चाँद बहुत बड़ा और बहुत पास लग रहा था।"],["चंदा धीरे से उठी। उसने अपनी ऊनी चप्पलें पहनीं, नानी की पुरानी शॉल ओढ़ी और दबे पाँव दरवाज़े तक पहुँची। बाहर की हवा ठंडी थी, पर बहुत मीठी। उसने सोचा, \"मैं बस थोड़ी देर बाहर बैठूँगी, फिर लौट आऊँगी।\"","आँगन में बैठते ही उसे एक धीमी-सी आवाज़ सुनाई दी। \"हू... हू...\" यह नीम के पेड़ की सबसे ऊँची डाल से आ रही थी। चंदा ने ऊपर देखा। वहाँ एक बड़ा-सा उल्लू बैठा था। उसकी आँखें दो सुनहरी गोलियों जैसी चमक रही थीं।","\"नमस्ते, चंदा,\" उल्लू ने कहा। चंदा को ज़रा भी डर नहीं लगा। उसने पूछा, \"आप मुझे कैसे जानते हैं?\" उल्लू मुस्कुराया, \"मैं इस पेड़ पर बहुत सालों से रहता हूँ। रात में जो बच्चे जागते हैं, उन्हें मैं सबसे पहले पहचान लेता हूँ। आओ, मैं तुम्हें रात की सैर कराता हूँ। पर शर्त यह है कि तुम धीरे-धीरे चलोगी और हर चीज़ को ध्यान से सुनोगी।\"","चंदा ने खुशी से सिर हिलाया। उल्लू पंख फैलाकर नीचे आया और उसके कंधे पर बैठ गया। \"चलो,\" उसने कहा, \"पहले हम जुगनुओं के पास चलेंगे।\""],["दोनों बगीचे के पीछे वाले मैदान में पहुँचे। वहाँ सैकड़ों जुगनू घास के ऊपर नाच रहे थे। कभी एक साथ चमकते, कभी बुझ जाते, मानो तारे नीचे उतर आए हों। चंदा की साँस रुक गई। \"कितने सुंदर हैं!\" उसने धीमे से कहा।","एक बूढ़ा जुगनू उड़कर उसकी हथेली पर बैठ गया। \"बेटी, हम बहुत छोटे हैं,\" उसने कहा, \"हमारी रोशनी भी बहुत छोटी है। पर जब हम सब मिलकर चमकते हैं, तो अँधेरे को डरने की ज़रूरत नहीं रहती। अकेली रोशनी कम लगती है, पर साथ मिलकर वह रास्ता बन जाती है।\"","चंदा ने उसकी बात को मन में दोहराया। \"अकेली रोशनी कम लगती है, पर साथ मिलकर वह रास्ता बन जाती है।\" उसे यह बात बहुत अच्छी लगी। उसने जुगनू को धीरे से हवा में उड़ा दिया और वह फिर अपने साथियों के बीच जाकर चमकने लगा।","उल्लू बोला, \"अब चलो, नदी तुम्हारा इंतज़ार कर रही होगी।\"","नदी का नाम था शांता। वह नगर के किनारे-किनारे बहती थी और रात में उसका पानी चाँदी की चादर जैसा लगता था। किनारे पर पहुँचकर चंदा बैठ गई और पानी में पैर डुबो दिए। पानी ठंडा और मुलायम था।"],["\"आज तुम बहुत धीरे बह रही हो, शांता,\" चंदा ने कहा। नदी ने हल्की कल-कल की आवाज़ में जवाब दिया, \"दिन में मुझे बहुत जल्दी होती है। मुझे पहाड़ों से उतरकर समंदर तक पहुँचना है। पर रात में मैं थोड़ा रुकती हूँ, चाँद को अपने भीतर उतरने देती हूँ और आराम करती हूँ। जो हर समय दौड़ता रहता है, वह सुंदर चीज़ें देख ही नहीं पाता।\"","चंदा ने पानी में अपना चेहरा देखा। वहाँ चाँद भी था और उसकी अपनी परछाईं भी। उसे लगा जैसे वह चाँद के साथ बैठी हो। उसने कहा, \"मुझे भी दिन में बहुत जल्दी रहती है। मैं सारा दिन भागती रहती हूँ। शायद इसीलिए रात को मेरा मन शांत नहीं होता।\"","\"हाँ,\" नदी ने कहा। \"शरीर को आराम मिल जाए तो मन भी धीरे-धीरे शांत हो जाता है। गहरी साँस लो, चंदा। एक... दो... तीन...\" चंदा ने गहरी साँस ली और धीरे से छोड़ी। उसे लगा कि उसके कंधे हल्के हो गए हैं।"],["उल्लू ने हल्के से पंख फड़फड़ाए। \"चलो, अब हम बरगद दादा से मिलेंगे। वे इस नगर के सबसे बूढ़े पेड़ हैं।\"","वे गाँव के चौराहे पर पहुँचे। वहाँ एक विशाल बरगद का पेड़ खड़ा था। उसकी जटाएँ ज़मीन तक झूल रही थीं और उसकी शाखाओं पर सैकड़ों पक्षी सोए हुए थे। हवा चलती तो पत्तियाँ हल्की-हल्की सरसराहट करतीं, मानो कोई लोरी गा रहा हो।","\"आओ बिटिया,\" बरगद ने गहरी, धीमी आवाज़ में कहा। \"मैं तुम्हारी नानी की नानी को भी जानता हूँ। वे भी रात को यहाँ आकर बैठती थीं।\" चंदा ने हैरानी से पूछा, \"आप इतने बूढ़े हैं, आपको नींद कैसे आती है?\"","बरगद हँस पड़ा। उसकी हँसी से पत्तियाँ काँप उठीं। \"बेटी, मैंने सैकड़ों तूफ़ान देखे हैं, बिजलियाँ झेली हैं, सूखे का समय भी काटा है। पर हर रात मैं एक काम करता हूँ। जो हो चुका, उसे छोड़ देता हूँ, और जो होने वाला है, उसकी चिंता कल पर रख देता हूँ। आज की रात केवल आज की है।\""],["चंदा सोचने लगी। उसने कहा, \"आज मैं नानी से थोड़ा रूठ गई थी, क्योंकि उन्होंने मुझे आम तोड़ने नहीं दिया। मैं उसी के बारे में सोचती रही।\" बरगद ने कहा, \"तो कल सुबह नानी से माफ़ी माँग लेना। जो बात सुबह सुलझ सकती है, उसे रात भर मन में रखने से बोझ ही बढ़ता है।\"","चंदा ने सिर हिलाया। उसे लगा जैसे एक छोटा-सा पत्थर उसके दिल से उतर गया हो।","उल्लू ने कहा, \"अब आख़िरी जगह बाकी है। हम चाँद के पास चलेंगे।\"","चंदा ने हैरानी से पूछा, \"चाँद के पास? पर वह तो बहुत दूर है।\" उल्लू ने रहस्यमय ढंग से कहा, \"रात में दूरी का मतलब बदल जाता है। बस मेरी आँखों में आँखें डालकर देखो।\"","चंदा ने उल्लू की सुनहरी आँखों में देखा। एक पल को सब कुछ धुँधला हो गया। फिर जब उसने आँखें खोलीं, तो वह एक ऊँची पहाड़ी की चोटी पर खड़ी थी। चाँद बिलकुल सामने था, इतना बड़ा कि लगता था हाथ बढ़ाओ तो छू लो। चाँद की रोशनी उसके चेहरे पर पड़ी तो उसे बहुत सुकून महसूस हुआ।"],["\"नमस्ते, चंदा,\" चाँद की आवाज़ बहुत कोमल थी, जैसे किसी की लोरी। \"तुम आज देर से जाग रही हो।\" चंदा ने सिर झुकाकर कहा, \"मुझे नींद नहीं आ रही थी। मैं सोचती थी कि कहीं मैं कुछ ज़रूरी चीज़ छोड़ न दूँ। दिन में इतना कुछ होता है, और रात में मन बार-बार उसी में चला जाता है।\"","चाँद मुस्कुराया। \"बेटी, मैं पूरे आसमान में अकेला चलता हूँ। पर मुझे कभी अकेलापन नहीं लगता, क्योंकि मुझे पता है कि मैं नीचे सोती हुई दुनिया की रखवाली कर रहा हूँ। रात का काम है सबको आराम देना। जो कुछ तुमने दिन में किया, वह अच्छा था। जो कुछ बाकी है, वह कल हो जाएगा। अब तुम्हारा काम बस इतना है कि चैन से सो जाओ।\"","चंदा ने धीरे से कहा, \"क्या सच में इतना ही काम है?\" चाँद ने कहा, \"हाँ, इतना ही। आराम करना भी एक बहुत बड़ा और ज़रूरी काम है। इसके बिना सुबह की रोशनी का आनंद नहीं लिया जा सकता।\""],["तब चाँद ने अपनी किरणों से एक हल्का-सा सुनहरा धागा चंदा की ओर बढ़ाया। \"इसे अपनी मुट्ठी में रख लो। जब कभी रात को नींद न आए, तो इसे याद करना और तीन बातें दोहराना। पहली, अकेली रोशनी कम लगती है पर साथ मिलकर रास्ता बन जाती है। दूसरी, जो हो चुका उसे छोड़ दो। तीसरी, आज की रात केवल आज की है।\"","चंदा ने धागा अपनी मुट्ठी में बंद कर लिया। उसके पूरे शरीर में एक गर्म, सुखद थकान दौड़ गई। उसकी पलकें भारी होने लगीं। उसने जम्हाई ली और बोली, \"मुझे लगता है अब मुझे नींद आ रही है।\"","उल्लू ने धीरे से कहा, \"तो चलो, घर चलते हैं।\" उसने पंख फैलाए और चंदा को अपने साथ उठाकर आसमान में उड़ चला। नीचे चाँदनी नगर सोया हुआ था। घरों की छतें चाँदी जैसी चमक रही थीं। नदी चुपचाप बह रही थी। बरगद की पत्तियाँ हल्के-हल्के हिल रही थीं और जुगनू मैदान में टिमटिमा रहे थे।"],["वे नीम के पेड़ के पास उतरे। उल्लू ने चंदा को आँगन में धीरे से रखा। चंदा ने उनींदी आवाज़ में कहा, \"धन्यवाद, उल्लू दादा।\" उल्लू ने कहा, \"शुभ रात्रि, नन्ही सैलानी।\" और वह फिर अपनी डाल पर जाकर बैठ गया।","चंदा दबे पाँव घर में आई। उसने जूते उतारे, शॉल को तह करके रखा और अपने बिस्तर पर लेट गई। कंबल ओढ़ते ही उसे नानी की गोद जैसी गर्माहट मिली। उसने मुट्ठी खोली तो हथेली में एक हल्की-सी रोशनी चमक रही थी, फिर वह धीरे से बुझ गई।","उसने आँखें बंद कर लीं। \"अकेली रोशनी कम लगती है, पर साथ मिलकर रास्ता बन जाती है,\" उसने मन ही मन दोहराया। \"जो हो चुका उसे छोड़ दो। आज की रात केवल आज की है।\"","खिड़की से चाँद की एक किरण भीतर आई और उसके माथे पर ठहर गई। बाहर हवा ने चमेली की खुशबू को हल्के से उसके कमरे तक पहुँचाया। नदी की कल-कल दूर से आती रही, बहुत धीमी, बहुत मीठी।"],["थोड़ी ही देर में चंदा की साँसें गहरी और शांत हो गईं। वह मुस्कुरा रही थी, क्योंकि वह सपनों की उसी नाव में बैठ चुकी थी जिसके बारे में नानी ने कहा था।","सुबह नानी ने आकर देखा तो चंदा गहरी नींद में थी। उसके चेहरे पर इतनी शांति थी कि नानी ने उसे जगाया नहीं। उन्होंने केवल उसका कंबल ठीक किया और खिड़की का पर्दा खींच दिया। फिर वे चुपचाप रसोई में चली गईं।","और चाँदनी नगर में एक और सुंदर दिन शुरू हो गया।","सीख: जो बीत गया उसे छोड़ दो और जो आने वाला है उसकी चिंता कल पर छोड़ दो। आराम करना भी एक ज़रूरी काम है, और जब हम साथ मिलकर चमकते हैं तो अँधेरा भी रास्ता बन जाता है।"]],"w":1663},{"id":"hi-deepak-udaan","lang":"hi","title":"दीपक की उड़ान","sub":"प्रेरणादायक कहानी · मेहनत और हिम्मत की","cat":"story","pg":[["उत्तर भारत के एक छोटे-से गाँव रामपुर में एक मोची रहता था, जिसका नाम था हरिराम। वह गाँव के चौराहे पर पीपल के पेड़ के नीचे बैठकर जूते-चप्पल सिलता था। उसकी कमाई बहुत कम थी, पर उसके मन में एक बड़ा सपना था। वह चाहता था कि उसका बेटा दीपक पढ़-लिखकर कुछ बड़ा बने।","दीपक बारह साल का था। वह दुबला-पतला, साँवला और बहुत शांत स्वभाव का था। पर उसकी आँखों में एक अजीब-सी चमक थी, जैसे उनमें कोई सवाल हमेशा जलता रहता हो। वह गाँव के सरकारी स्कूल में पढ़ने जाता था, जहाँ एक कमरे में तीन कक्षाएँ एक साथ बैठती थीं और मास्टर साहब कभी आते, कभी नहीं।","दीपक के घर में बिजली नहीं थी। शाम होते ही अँधेरा छा जाता। तब वह अपनी किताबें उठाकर गाँव के चौराहे पर लगे इकलौते सरकारी लैंप पोस्ट के नीचे बैठ जाता। वहाँ उसे घंटों पढ़ते देखकर लोग हँसते थे।","\"अरे ओ मोची के बेटे,\" कोई कहता, \"तू जितना भी पढ़ ले, बनेगा तो जूते ही सीने वाला।\" कोई कहता, \"किताबों से पेट नहीं भरता। जा, बाप के साथ काम सीख।\" दीपक चुपचाप सुनता और अपनी किताब में खो जाता। वह मन ही मन कहता, \"मैं इन्हें जवाब नहीं दूँगा। मेरा काम जवाब देगा।\""],["दीपक की माँ सावित्री घर-घर जाकर बर्तन माँजती थी। रात को जब वह थककर लौटती, तो भी दीपक के पास बैठकर पूछती, \"आज क्या पढ़ा, बेटा?\" दीपक उसे गिनती सुनाता, कविता सुनाता, विज्ञान की कोई नई बात बताता। माँ को ज़्यादा समझ नहीं आता था, पर वह ध्यान से सुनती और माथा चूम लेती।","आठवीं कक्षा में दीपक पूरे ज़िले में प्रथम आया। गाँव में पहली बार किसी ने इतने अंक पाए थे। हरिराम की आँखों में आँसू आ गए। उसने अपनी सारी जमा-पूँजी निकाली और दीपक के लिए एक नया बस्ता और पाँच किताबें खरीदीं।","पर असली संघर्ष अब शुरू होने वाला था। गाँव में दसवीं तक की पढ़ाई नहीं थी। आगे पढ़ने के लिए दीपक को पंद्रह किलोमीटर दूर कस्बे के स्कूल में जाना पड़ता। बस का किराया रोज़ का दस रुपये था, जो उसके परिवार के लिए बहुत था।","दीपक ने कहा, \"बाबा, मैं पैदल जाऊँगा।\" हरिराम ने रोकना चाहा, पर दीपक की ज़िद के आगे हार गया। अगली सुबह चार बजे उठकर दीपक अपनी रोटी की पोटली लेकर चल पड़ा। सात किलोमीटर पैदल, फिर एक ट्रैक्टर वाले की ट्रॉली में बैठकर आगे, और बचे रास्ते फिर पैदल।"],["हर दिन यही सिलसिला चलता रहा। गर्मियों में सिर पर तपता सूरज, बारिश में कीचड़ भरे रास्ते, और सर्दियों में ठिठुराती सुबहें। पर दीपक ने कभी शिकायत नहीं की। रास्ते में वह मन ही मन पाठ दोहराता चलता। इस तरह उसकी पढ़ाई का आधा हिस्सा सड़क पर चलते-चलते पूरा हो जाता था।","कस्बे के स्कूल में पहला दिन बहुत कठिन था। वहाँ के बच्चे अच्छे कपड़े पहनते थे, अंग्रेज़ी बोलते थे और दीपक को अजीब नज़रों से देखते थे। किसी ने उसके फटे जूतों पर हँसी उड़ाई। एक लड़के ने कहा, \"देखो, गाँव से आया है। इसे तो अंग्रेज़ी का A भी नहीं आता होगा।\"","दीपक का चेहरा लाल हो गया, पर वह कुछ नहीं बोला। उस रात उसने अपनी माँ को कुछ नहीं बताया। उसने बस अपनी कॉपी खोली और अंग्रेज़ी की किताब का पहला पाठ दस बार लिखा। फिर उसने एक संकल्प लिया। \"छह महीने में मैं इन सबसे अच्छी अंग्रेज़ी बोलूँगा।\""],["उसने स्कूल के पुस्तकालय में जाना शुरू किया। वहाँ की बूढ़ी लाइब्रेरियन मैडम शर्मा ने उसे देखा तो पूछा, \"तुम इतनी देर तक यहाँ क्या करते हो?\" दीपक ने झिझकते हुए कहा, \"मैडम, मुझे अंग्रेज़ी सीखनी है। क्या आप मुझे कोई आसान किताब दे सकती हैं?\"","मैडम शर्मा मुस्कुराईं। उन्होंने उसे बच्चों की कहानियों की एक किताब दी और कहा, \"हर दिन एक पन्ना पढ़ो। जो शब्द न समझ आए, उसे इस कॉपी में लिख लो और मुझे दिखाना।\" दीपक रोज़ एक पन्ना पढ़ता, दस नए शब्द लिखता और अगले दिन उन्हें याद करके आता।","छह महीने बाद स्कूल में वाद-विवाद प्रतियोगिता हुई। विषय था, \"मेहनत बनाम भाग्य।\" जिन बच्चों ने कभी दीपक का मज़ाक उड़ाया था, वे भी वहाँ बैठे थे। जब दीपक मंच पर पहुँचा, तो उसके हाथ काँप रहे थे।","पर जैसे ही उसने बोलना शुरू किया, उसका डर गायब हो गया। उसने कहा, \"भाग्य उस दरवाज़े का नाम है जो हमें दिखाई देता है। पर उस दरवाज़े तक पहुँचने वाला रास्ता मेहनत से बनता है। मैं रोज़ पंद्रह किलोमीटर चलकर यहाँ आता हूँ। मेरे लिए हर कदम एक सवाल है, और हर पाठ उसका जवाब।\""],["पूरा हॉल तालियों से गूँज उठा। जिस लड़के ने पहले दिन उसके जूतों पर हँसी उड़ाई थी, वह खड़ा होकर ताली बजा रहा था। प्रतियोगिता के बाद वह दीपक के पास आया और बोला, \"मुझे माफ़ कर दो। मैंने तुम्हारे बारे में बहुत गलत सोचा था।\" दीपक ने मुस्कुराकर उसका हाथ थाम लिया। दोनों उस दिन से पक्के दोस्त बन गए।","दसवीं के नतीजे आए तो दीपक पूरे राज्य की मेरिट सूची में आया। अख़बारों में उसकी तस्वीर छपी। गाँव के जिन लोगों ने कभी उसे ताने मारे थे, वे अब उसके घर बधाई देने आए। हरिराम ने सबको चाय पिलाई और चुपचाप अपनी आँखें पोंछ लीं।","पर जीवन में हमेशा सब कुछ आसान नहीं रहता। ग्यारहवीं में जाते ही हरिराम बीमार पड़ गया। उसकी पीठ में असहनीय दर्द रहने लगा और वह चौराहे पर बैठने लायक भी नहीं रहा। घर की कमाई रुक गई। सावित्री दो-तीन घरों में और काम करने लगी, पर तब भी खर्च पूरा नहीं होता था।"],["दीपक रात को बाप के पास बैठा था। हरिराम ने धीमी आवाज़ में कहा, \"बेटा, शायद तुझे पढ़ाई छोड़कर कोई काम करना पड़ेगा। मैं तेरे सपनों के आड़े नहीं आना चाहता था, पर हालात...\" दीपक ने उसका हाथ पकड़ लिया। \"बाबा, आप ऐसा मत कहिए। मैं सुबह स्कूल जाऊँगा और शाम को आपकी जगह चौराहे पर बैठूँगा। पढ़ाई भी करूँगा और काम भी।\"","अगले दिन से दीपक की दिनचर्या बदल गई। सुबह चार बजे उठकर स्कूल के लिए निकलना, दोपहर को लौटकर चौराहे पर बैठकर जूते सीना, और रात को लैंप पोस्ट के नीचे पढ़ाई। नींद उसे चार घंटे भी मुश्किल से मिलती थी, पर उसने कभी हार नहीं मानी।","एक शाम जब वह जूते सी रहा था, एक सज्जन अपनी चप्पल ठीक कराने आए। वे ध्यान से दीपक के हाथ में रखी भौतिकी की किताब को देख रहे थे। उन्होंने पूछा, \"बेटा, तुम यह किताब क्यों पढ़ रहे हो?\" दीपक ने बताया, \"साहब, मैं डॉक्टर बनना चाहता हूँ।\""],["वे सज्जन मुस्कुराए। उनका नाम डॉक्टर वर्मा था। वे शहर के बड़े अस्पताल में काम करते थे और अपने पुराने गाँव आए हुए थे। उन्होंने दीपक से कुछ सवाल पूछे। हर जवाब सुनकर उनकी आँखों में हैरानी और प्रशंसा बढ़ती गई।","\"बेटा,\" उन्होंने कहा, \"मैं एक संस्था से जुड़ा हूँ जो होनहार बच्चों को डॉक्टर बनने के लिए छात्रवृत्ति देती है। पर इसके लिए तुम्हें एक कठिन परीक्षा पास करनी होगी। क्या तुम तैयार हो?\" दीपक की आँखें चमक उठीं। \"जी, मैं तैयार हूँ।\"","अगले दो साल दीपक के जीवन के सबसे कठिन साल थे। उसने दिन-रात मेहनत की। डॉक्टर वर्मा कभी-कभी उसके लिए किताबें और नोट्स भेजते। मैडम शर्मा उसे अतिरिक्त समय पढ़ाती थीं। उसका दोस्त, जो कभी उसका मज़ाक उड़ाता था, अब उसके साथ बैठकर सवाल हल करता था।","परीक्षा का दिन आया। दीपक पहली बार शहर गया। इतनी ऊँची इमारतें, इतने सारे लोग, इतनी तेज़ गाड़ियाँ। वह घबरा गया। पर उसने मन ही मन माँ का चेहरा याद किया और अपनी साँसें शांत कीं। फिर वह परीक्षा हॉल में गया।"],["तीन घंटे बाद जब वह बाहर निकला, तो उसे नहीं पता था कि उसने कैसा किया है। कुछ सवाल बहुत कठिन थे और कुछ में वह अटक गया था। वह गाँव लौट आया और फिर से रोज़ की दिनचर्या में लग गया।","दो महीने बाद डाक से एक पत्र आया। हरिराम ने काँपते हाथों से लिफ़ाफ़ा खोला, पर पढ़ नहीं पाया। उसने दीपक को दिया। दीपक ने पत्र पढ़ना शुरू किया। जैसे-जैसे वह आगे बढ़ा, उसकी आवाज़ भर्राने लगी। पत्र में लिखा था, \"बधाई हो। आपका चयन पूर्ण छात्रवृत्ति के साथ मेडिकल कॉलेज के लिए हो गया है।\"","सावित्री ने उसे गले से लगा लिया और फूट-फूटकर रो पड़ी। हरिराम चारपाई पर लेटा था। उसने बेटे का हाथ थामा और बस इतना कहा, \"बेटा, आज तूने मेरे सारे जूते सीने का फल दे दिया।\"","दीपक मेडिकल कॉलेज में पाँच साल पढ़ा। वहाँ भी कठिनाइयाँ कम नहीं थीं। कभी भाषा की, कभी पैसों की, कभी अकेलेपन की। पर हर बार उसे गाँव की वह लैंप पोस्ट याद आती, जिसके नीचे बैठकर उसने सपने देखे थे। उस याद से उसे नई ताकत मिल जाती।"],["पढ़ाई पूरी करके उसे शहर के बड़े अस्पताल में नौकरी मिल गई। लोग कहते, \"तुम्हारा भविष्य यहीं है। इतनी अच्छी तनख़्वाह, इतनी सुविधाएँ।\" पर दीपक के मन में एक और सपना था।","एक दिन वह छुट्टी लेकर रामपुर लौटा। गाँव अब भी वैसा ही था। टूटी सड़कें, छोटी दुकानें, और वही पुराना पीपल का पेड़। पर चौराहे पर अब एक बूढ़ा मोची बैठा था, जो उसके पिता की ही तरह जूते सी रहा था। दीपक रुककर देर तक उसे देखता रहा।","फिर वह अपने पुराने स्कूल गया, जहाँ अब भी एक कमरे में तीन कक्षाएँ बैठती थीं। उसने बच्चों को देखा, जो उसी की तरह उत्साही आँखों से किताबों में झाँक रहे थे। उस पल उसने मन में निर्णय ले लिया।","छह महीने बाद दीपक ने नौकरी छोड़ दी और रामपुर आकर गाँव में एक छोटा-सा क्लिनिक खोला। उसने अपने पिता के नाम पर उसका नाम रखा, \"हरिराम स्वास्थ्य केंद्र\"। उसी के पास उसने एक पुस्तकालय भी बनाया, जिसकी हर दीवार पर लैंप पोस्ट की एक तस्वीर टँगी थी।"],["हर शाम उस पुस्तकालय में गाँव के बच्चे इकट्ठे होते। वहाँ बिजली थी, कुर्सियाँ थीं और किताबों की लंबी कतारें थीं। दीपक खुद उन्हें पढ़ाता और कहता, \"तुम्हारे हालात तुम्हारे सपनों की सीमा नहीं हैं। तुम्हारी मेहनत और तुम्हारी हिम्मत ही तुम्हारी असली पहचान हैं।\"","हरिराम अब बूढ़ा हो चुका था। वह रोज़ क्लिनिक के सामने कुर्सी पर बैठता और आते-जाते लोगों को देखता। जब कोई उससे पूछता, \"आपका बेटा तो बहुत बड़ा आदमी बन गया है,\" तो वह मुस्कुराकर कहता, \"बड़ा नहीं, भला आदमी बना है। यही मेरे लिए सबसे बड़ी बात है।\"","और दीपक? वह हर रात सोने से पहले अपनी खिड़की से चौराहे की उसी लैंप पोस्ट को देखता, जो अब भी जल रही थी। उसे लगता था कि वह रोशनी कभी बुझी नहीं थी। वह तो हर उस बच्चे के भीतर जलती रही, जिसने कठिनाइयों के अँधेरे में भी पढ़ने की हिम्मत नहीं छोड़ी।","सीख: हालात कितने भी कठिन हों, सच्ची मेहनत, लगन और धैर्य से हर सपना पूरा हो सकता है। और जब हम सफल हों, तो उन्हें याद रखें जो अभी उसी अँधेरे में हैं, जहाँ से हम चले थे।"]],"w":1767},{"id":"en-lantern-keeper","lang":"en","title":"The Lantern Keeper of Moonvale","sub":"A bedtime story · slow and gentle","cat":"story","pg":[["In a valley so quiet that you could hear the stars moving, there was a village called Moonvale. It was a small place, with low stone houses and crooked chimneys, and a narrow lane that wound up and down the hill like a ribbon someone had dropped. In the evenings, when the sun slipped behind the mountains, a soft blue light settled over everything, and the whole village seemed to take a long, slow breath.","At the very top of the lane stood an old stone tower, and in the tower lived the lantern keeper. His name was Oswin. He was a tall, slow-moving man with white hair that stuck out like dandelion fluff, and a long grey coat with many pockets. Every evening, at exactly the moment when the last light left the sky, he climbed down the tower stairs with a tall ladder on his shoulder and a basket of small glass lanterns on his arm."],["The children of Moonvale loved to watch him. He walked from lamp post to lamp post, setting the ladder against each one, climbing up, opening the little glass door, and lighting the wick with a long taper. Each flame was a different shade. Some were gold, some were pale green, some were the colour of honey. When he had lit them all, the whole lane glowed like a string of sleepy fireflies.","There was one child in the village who did not watch him with the others. Her name was Wren, and she was nine years old. She was a thoughtful, quiet girl who kept a notebook in her pocket and wrote down questions she could not answer. That autumn her notebook had one question underlined three times. Why can I never fall asleep?","Wren was not unhappy. She loved her home, her cat, and her little brother. But every night, when her mother turned down the lamp and said goodnight, her mind began to run. It ran through the day she had just lived, and the day she had to live tomorrow, and a hundred small worries about nothing in particular. By the time the clock struck midnight, she was still wide awake, staring at the ceiling."],["One evening, instead of going to bed, Wren slipped out the back door and followed the sound of Oswin's ladder up the lane. She kept a careful distance, hiding behind garden walls. When he reached the last lamp post and lit it, she took a deep breath and stepped out.","\"Excuse me,\" she said. \"Are you the lantern keeper?\" Oswin turned slowly, as if he had known she was there all along. \"I am,\" he said in his warm, crackling voice. \"And you must be the girl who is not asleep.\" Wren blinked. \"How did you know?\" \"Because the lanterns told me,\" he said, and winked.","He sat down on the lowest rung of his ladder and patted the stone beside him. Wren sat. For a moment neither of them said anything. The village below was quiet. A moth fluttered around the nearest lamp. A distant dog yawned."],["\"I used to have the same trouble,\" Oswin said at last. \"A long time ago, when I was not much older than you. My mind was always busy, like a spinning wheel that would not stop. My grandmother, who was the lantern keeper before me, noticed. She took me up the tower one night and showed me something I have never forgotten. Would you like to see it?\" Wren nodded.","They climbed the spiral stairs of the tower together. There were ninety-nine steps, and Oswin said it was best to count them slowly. At the top, there was a small round room with a single window and a great glass lantern in the middle, taller than Wren herself. It was unlit. Its glass was clear and still.","\"This is the Moonvale lantern,\" said Oswin. \"It does not light the lane. It lights something else.\" He took a small golden key from his pocket and unlocked a little door at the base. Inside there was no wick and no oil. There was only a tiny, round, silver bowl, filled with what looked like moonlight."],["\"Every night,\" he said, \"this bowl fills with whatever the village has left over from the day. Worries and hopes, small angers, little joys, things left unsaid. The lantern gathers them up and burns them gently, so that by morning they are gone, and everyone can wake up light.\" Wren stared. \"Is that really true?\" \"It is as true as you want it to be,\" said Oswin, smiling.","\"But there is a rule,\" he went on. \"The lantern can only take what you are willing to give it. And the only way to give it something is to say it out loud, softly, to the dark.\" He closed the door and handed Wren a small, round, smooth stone from his pocket. \"Hold this, and tell the lantern what is on your mind.\""],["Wren held the stone. It was warm, as if it had been lying in the sun. She felt silly at first, speaking to an empty lantern. But then she said, in a very small voice, \"I am worried that I will forget my lines in the school play.\" The lantern flickered, although it had no flame. \"And I am worried that my brother has a cough.\" The glass glowed a little brighter. \"And I am sad because my friend Lila moved away, and I do not know whether she misses me.\"","With each sentence, she felt something loosen inside her chest, like a knot being untied. The silver bowl shimmered and a thin thread of silvery light rose out of it and drifted up through the roof. When Wren finished, she let out a long breath. She felt as if she had been carrying a heavy basket and had just set it down."],["\"Better?\" asked Oswin. \"Much better,\" Wren whispered. \"But what if the worries come back tomorrow?\" \"They might,\" he said. \"Worries are like weeds. But now you know how to pull them out. Every evening, before you sleep, you can tell them to the dark, and the dark will take them. It is very good at that. It has had a great deal of practice.\"","They stayed in the tower a little longer, watching the village below. One by one, the windows went dark. The lamps on the lane burned steadily, like patient guardians. Far off, an owl called twice, and a faint wind moved through the pine trees.","Oswin took out a flask and poured two small cups of warm milk with a pinch of honey. They drank in silence. Wren felt a pleasant heaviness in her arms and legs, the kind you feel after a long day in the sun. She yawned, and then yawned again."],["\"I think,\" said Oswin gently, \"that it is time to go home.\" He took her hand, and they walked back down the ninety-nine steps, counting slowly. By the time they reached the bottom, Wren was so sleepy that she could barely keep her eyes open. Oswin carried her the rest of the way, along the lit lane, past the sleeping houses, until they reached her door.","Her mother was waiting at the window, but she did not scold. She saw the sleepy child in the lantern keeper's arms, and her eyes softened. \"Thank you,\" she whispered. Oswin only nodded. He placed Wren gently in her bed, tucked the blanket under her chin, and set the smooth stone on her pillow. \"Keep this close,\" he murmured. \"It remembers.\"","Then he tiptoed out, closed the door without a sound, and returned to his tower.","Wren lay in the dark, but this time the dark did not feel empty. It felt soft and full, like a deep, quiet pond. She closed her fingers around the stone. She thought of the silver bowl and the silver thread rising up through the roof. She thought of the ninety-nine steps, and she began to count them, slowly. One. Two. Three."],["She did not get to ninety-nine. Somewhere around forty, her thoughts grew slow and warm and tangled, like wool unwinding from a ball, and the numbers drifted away. The last thing she heard was the faint creak of a ladder in the lane and the whisper of a flame being lit, and then she was asleep.","From that night on, Wren never had trouble sleeping again. Every evening, before she lay down, she held her smooth stone and told the dark whatever was on her mind, and the dark listened. Some nights it was a long list. Some nights it was a single word. And some nights there was nothing at all, and she simply said, \"Thank you for today.\"","In time, she told her little brother about the stone, and he told his friends, and soon half the children of Moonvale had a smooth stone under their pillows. Oswin grew very old, and one spring he did not climb the tower stairs. The village held its breath. But on the very next evening, as the blue light settled over the lane, a tall young woman in a grey coat with many pockets appeared with a ladder on her shoulder and a basket of small glass lanterns on her arm."],["It was Wren. She had grown up, and she had learned the oldest trick of all. She walked from lamp post to lamp post, lighting each flame with a long taper, and the lane glowed gold and green and honey-coloured, just as it always had. And all through Moonvale, children who could not sleep looked out of their windows, saw the lights, and felt the quiet come over them like a warm blanket.","Moral: you do not have to carry every worry through the night. Say it out loud, let it go, and trust that the morning will bring a lighter heart."]],"w":1655},{"id":"en-asha-sea","lang":"en","title":"Asha and the Long Road to the Sea","sub":"A motivational story · about patience and courage","cat":"story","pg":[["Asha lived in a small farming village called Dhanpur, far from any coast. She was twelve years old, with thick braids, a gap in her front teeth and a habit of staring into the distance. The village was surrounded by wheat fields that rolled out like a golden sea, and when the wind blew, the stalks rippled in long waves. Asha loved to stand at the edge of the field and watch them. She had never seen the real sea.","Her grandfather had. Before his legs grew weak, he had been a sailor on a merchant ship, and he used to tell Asha stories of dolphins racing the bow, of storms that turned the waves into mountains, and of mornings when the water was so calm that the sky and sea became one single shining mirror. \"One day, Asha,\" he used to say, \"you must go and see it for yourself. You will understand why I could never stay away.\""],["The year Asha turned twelve, her grandfather passed away. At his funeral, she found a small tin box beneath his bed with her name painted on the lid. Inside were an old brass compass, a folded map, and a note in his wobbly handwriting. It said, \"The sea is waiting. Take this road. Do not hurry. The road is part of the sea.\"","The map showed a long, winding line from Dhanpur all the way to a tiny blue speck labelled Samudrapur. It would take weeks to walk. Asha had never been farther than the market town, two hours away. She sat on the porch and held the compass for a very long time.","That night she told her mother. Her mother was quiet for a while, stirring the lentils. \"It is a long way,\" she said finally. \"You are only twelve.\" \"I know,\" said Asha. \"I do not want to go this minute. But I want to go. I want to see what he saw.\" Her mother looked at her and saw how steady her eyes were. \"Then we shall prepare,\" she said. \"You will not go alone and you will not go unprepared. We will start by making you strong.\""],["So Asha began her training. Every morning before school, she walked to the next village and back. A week later she walked to the village after that. Her uncle taught her how to read a map and use the compass. Her aunt taught her how to mend her shoes and wrap her feet against blisters. The village teacher taught her to keep a journal of her journey, so that she would remember everything.","It was slow, and some days it was boring. Her friends laughed at her. \"Why are you walking so much?\" they asked. \"You will never get to the sea.\" Asha did not argue. She only said, \"Every step I take now is a step I will not have to take later.\" She did not fully understand what she meant, but it felt true.","A year passed. Then two. Asha grew taller and stronger. She had walked, by then, the distance to the market town and back a hundred times. She had filled three journals. She had saved a little money by selling eggs and mending clothes. And on the morning of her fourteenth birthday, she woke before the sun, packed her bag, tied the brass compass around her neck and kissed her mother goodbye."],["Her mother had arranged for her to travel with a group of pilgrims and traders who made the journey every year. They were a cheerful, noisy lot, with carts of grain and cloth and spices. They welcomed Asha, gave her a place in their wagon at night, and taught her songs for the long road.","The first week was the hardest. Her feet blistered in spite of the wrapping. Her shoulders ached from the pack. At night she lay awake missing home. One evening, when she was close to tears, an old trader named Gopal sat down beside her. \"Missing the village?\" he asked. She nodded. \"Everyone does,\" he said. \"Everyone who has ever set out. That ache means you have something worth missing. It will not go away, but it will become lighter, and one day you will carry it like a small stone in your pocket, and it will remind you of where you began.\""],["Asha wiped her eyes and nodded. The next morning she got up and walked.","In the second week they crossed a wide, dry plain where the wind whipped dust into their eyes and there was no shade for miles. Water ran low. The traders rationed it carefully, and Asha, who was the youngest, was given the first cup each time. She tried to refuse, but Gopal said, \"We have walked this plain many times. You are new to it. Drink. We will manage.\"","On the fifth day, one of the oxen fell sick. The caravan stopped for two days. Asha helped nurse it, bringing it water and cooling its head with wet cloth. When it finally stood again, she felt something she had not expected. It was not just relief. It was a quiet pride, the kind that comes from knowing that you were useful.","In the third week they reached the foothills. The road narrowed, climbing steeply through dark pine forests. Rain came and did not leave for four days. The road turned to mud, and the carts sank to their axles. One evening a wheel broke, and the whole company sat in the drizzle, hungry and tired and irritable."],["Someone muttered that the journey was cursed. Someone else wondered aloud if they should turn back. Asha looked at the faces around her. She felt her own courage wobble. She reached for the compass at her neck and held it in her palm. The needle quivered, then settled, pointing steadily northeast.","\"The road is part of the sea,\" she said, almost to herself. Gopal heard her. \"What was that, child?\" \"My grandfather said it,\" Asha replied. \"That the road is part of the sea. I think he meant that we cannot love the end without also loving the way.\" For a moment nobody spoke. Then the old man laughed, a deep, rumbling laugh. \"A wise saying from a wise man. Come, everyone. We will mend the wheel, and we will sing.\"","They mended the wheel by lantern light, and as they worked, they sang. The rain softened to a drizzle. By midnight, the clouds broke and a handful of stars appeared. Asha lay on her back in the wagon, listening to the dripping trees, and for the first time she felt that she belonged to the road."],["After five weeks, the forest ended. The trees thinned, and one morning the caravan came to the top of a long ridge. Below them, the land fell away in green terraces to a wide, flat plain. And beyond the plain, so far away that it seemed a trick of the light, lay a thin, shimmering line of silver-blue.","Asha stopped. Her heart pounded. \"Is that...?\" she whispered. \"That is it,\" said Gopal softly. \"The sea.\"","They walked another two days before they reached it. As they came down the final slope, Asha began to hear a sound she had never heard in her life, a deep, slow breathing, a rushing and a pulling back, like a giant sighing in its sleep. Then she crested the last dune and the whole sea opened before her.","It was bigger than anything she had imagined. The waves rolled in, one after another, white-capped and endless. The sky above was enormous, streaked with the first pink of dawn. Gulls wheeled overhead. The air tasted of salt and something wild and ancient."],["Asha dropped her pack and ran. She ran straight down the sand, kicked off her shoes and plunged into the shallows. The water was cold and shocking and wonderful. A wave broke against her knees, and she laughed out loud, a high, joyful laugh that startled the gulls. She turned in circles, arms wide, the spray soaking her face.","Eventually, she grew still. She stood with the water swirling around her ankles and looked out at the horizon. She thought about her grandfather, about the tin box, about the two years of training and the five weeks of walking. She thought about every blister and every doubt and every night she had missed home. And she understood something.","The sea was beautiful. But what made it matter was the road that had brought her there. Without the long walking, without the rain and the dust and the broken wheel, the sea would only have been a picture. Now it was something she had earned. It was hers."],["She took out her grandfather's compass and held it up. \"I made it,\" she said aloud, to the wind and the water and the old sailor she knew was somewhere listening. \"I made it, Dada. And you were right. The road is part of the sea.\"","She stayed in Samudrapur for a week. She met fishermen who showed her how to mend nets. She learned to swim in the shallows. At night she sat on the sand and wrote in her journal until her hand ached. When it was time to return, she did not feel sad. She felt full, like a cup that had been filled and was ready to be shared.","The journey home was easier. She knew the road now. She knew where the water was, where the best shade lay, where the hardest hills were. Gopal and the others laughed and sang with her, and she realised she was no longer a stranger among them."],["When Asha walked back into Dhanpur, her mother was waiting at the edge of the wheat field, exactly where she had said goodbye. They held each other for a long time. Then Asha opened her pack and took out a small glass bottle. Inside, there was a little sand and a little salt water. \"I brought you the sea,\" she said.","In the years that followed, Asha taught the village children what she had learned. She told them about the plains and the pine forests, the broken wheel and the singing in the rain. She did not tell them it was easy. She told them the truth. That it is slow. That it is sometimes lonely. That it asks you to keep going on the days when you cannot see where you are going.","And when the children grew restless and said, \"But how can we reach our dreams when they are so far away?\" she would take out the brass compass, put it in their palms, and say, \"You do not have to cross the whole distance today. You only have to take the next step. Then the next. One day you will look up and the sea will be right in front of you.\"","Moral: great goals are reached by patient steps, one after another. Courage is not the absence of doubt; it is the decision to keep walking in spite of it, and the road itself becomes part of the reward."]],"w":1861},{"id":"hi-khargosh","lang":"hi","title":"चतुर खरगोश और शेर","sub":"पंचतंत्र की कथा","cat":"story","pg":[["बहुत पुरानी बात है। एक घने जंगल के बीच ऊँचे पेड़ों की छाँव में एक पुरानी गुफा थी, और उस गुफा में भासुरक नाम का एक शेर रहता था। उसकी दहाड़ सुनकर दूर बैठे पंछी भी उड़ जाते थे। वह बहुत ताकतवर था, पर उतना ही घमंडी और लालची भी। उसे लगता था कि पूरा जंगल उसी का है और जंगल के सारे जानवर उसके खाने के लिए ही बने हैं।","वह रोज़ सुबह शिकार पर निकलता। कभी हिरण को पकड़ता, कभी नीलगाय को, कभी खरगोशों के पूरे झुंड पर टूट पड़ता। पेट भर जाने के बाद भी वह रुकता नहीं था, और जितने जानवर मार सकता, मार डालता। जंगल में सन्नाटा छाने लगा। माँएँ अपने बच्चों को सीने से लगाकर छिपातीं, और कोई भी जानवर रात को चैन की नींद नहीं सो पाता था।","एक दिन सब जानवर नदी किनारे वाले बड़े मैदान में इकट्ठा हुए। हिरण, बारहसिंगे, लोमड़ी, गिलहरियाँ, सब चुपचाप खड़े थे। सबकी आँखों में डर था। तब सबसे बूढ़े हाथी ने अपनी भारी आवाज़ में कहा, \"अगर ऐसा ही चलता रहा तो कुछ ही दिनों में इस जंगल में कोई नहीं बचेगा। हमें शेर से बात करनी चाहिए। शायद वह हमारी बात सुन ले।\""],["पर शेर के पास जाने की हिम्मत किसी में नहीं थी। आखिर कई जानवर मिलकर काँपते कदमों से गुफा तक पहुँचे। शेर अभी अभी शिकार करके लौटा था और गुफा के बाहर लेटा हुआ था। सबने हाथ जोड़कर कहा, \"महाराज, आप रोज़ शिकार की मेहनत क्यों करें? इतनी दौड़ भाग से आप थक जाते होंगे। हम हर दिन अपनी तरफ़ से एक जानवर आपके पास भेज देंगे। आपको बैठे बैठे भोजन मिल जाएगा।\"","शेर ने मूँछों पर ताव दिया और कुछ देर सोचता रहा। उसे यह बात ठीक लगी, क्योंकि इसमें उसे कोई मेहनत नहीं करनी थी। उसने गरजकर कहा, \"ठीक है, मुझे मंज़ूर है। पर याद रखना, जिस दिन कोई नहीं आया, उस दिन मैं सबको खा जाऊँगा।\" सब जानवरों ने सिर झुकाया और भारी मन से अपने अपने घर लौट आए।","उस दिन के बाद जंगल में एक अजीब नियम चल पड़ा। हर सुबह जानवर आपस में तय करते कि आज किसकी बारी है। जिसकी बारी आती, वह अपने घरवालों से गले मिलकर रोते हुए शेर की गुफा की ओर चल देता। जंगल में शिकार का शोर तो थम गया था, पर दुख कम नहीं हुआ था। हर घर में किसी न किसी को खोने का डर बैठा रहता था।"],["धीरे धीरे सबकी बारी आती गई। हिरण गया, फिर बारहसिंगा, फिर नीलगाय। और एक दिन एक छोटे से खरगोश की बारी आई। उसके घरवाले रो पड़े। पर खरगोश ने आँसू पोंछे और सोचा कि जाना तो है ही, तो क्यों न बचने की कोशिश करके जाया जाए। वह एक पेड़ के नीचे बैठ गया और देर तक सोचता रहा। उसने खुद से कहा, \"जान बचाने का कोई न कोई रास्ता ज़रूर होगा।\"","अचानक उसके चेहरे पर हल्की सी मुस्कान आ गई। उसे एक तरकीब सूझ गई थी। वह जानबूझकर बहुत धीरे धीरे चला। कभी घास पर रुककर बैठ जाता, कभी तितली को देखने लगता। दोपहर ढल गई और सूरज सिर पर चढ़ आया, तब कहीं जाकर वह शेर की गुफा के पास पहुँचा। उधर शेर भूख के मारे बेचैन होकर गुफा के बाहर चक्कर काट रहा था और बार बार गरज रहा था।","खरगोश को आते देख शेर की आँखें अंगारे जैसी लाल हो गईं। वह दहाड़ा, \"इतनी देर क्यों की? और मेरे भोजन के लिए इतना छोटा सा जानवर भेजा गया है! मैं तुझे अभी खा जाऊँगा!\" खरगोश के पैर काँप रहे थे, पर उसने अपनी आवाज़ को सँभाला और बहुत विनम्रता से सिर झुकाकर खड़ा रहा, जैसे वह सचमुच बहुत डरा हुआ और दुखी हो।"],["उसने कहा, \"महाराज, मेरी कोई गलती नहीं है। हम पाँच खरगोश आपके पास आ रहे थे, क्योंकि आज हमारी बारी थी। रास्ते में एक दूसरा शेर मिल गया। वह अपनी गुफा से निकलकर हमारे सामने आ खड़ा हुआ। वह कहता था कि इस जंगल का राजा वही है, और भासुरक तो उसका नौकर है। उसने हम पाँचों को रोक लिया। मैं बड़ी मुश्किल से उसकी नज़र बचाकर भागकर आया हूँ, ताकि आपको खबर दे सकूँ।\"","शेर आगबबूला हो गया। उसके नथुने फूल गए और वह पूँछ ज़मीन पर पटकने लगा। \"दूसरा शेर? इस जंगल में मेरे सिवा कोई राजा नहीं है! मुझे अभी उसके पास ले चल। मैं उसके टुकड़े टुकड़े कर दूँगा!\" खरगोश ने मन ही मन भगवान को याद किया और बोला, \"जी महाराज, आइए मेरे साथ। मैं आपको वह जगह दिखाता हूँ।\"","खरगोश आगे आगे चलता रहा और शेर पीछे पीछे गुस्से में फुफकारता चलता रहा। कुछ दूर जाकर वे एक पुराने, गहरे कुएँ के पास पहुँचे। कुएँ की मुँडेर पर काई जमी थी और अंदर का पानी शांत शीशे की तरह चमक रहा था। खरगोश ने काँपने का नाटक करते हुए कहा, \"महाराज, वह शेर इसी किले में छिपा बैठा है। वह बहुत खतरनाक है। आप खुद झाँककर देख लीजिए, मैं तो दूर ही रहूँगा।\""],["शेर ने मुँडेर पर पंजे टिकाए और कुएँ में झाँका। पानी में उसे अपनी ही परछाईं दिखाई दी। उसे लगा कि सचमुच कोई दूसरा शेर उसे घूर रहा है। वह ज़ोर से दहाड़ा, और कुएँ की दीवारों से वही दहाड़ दुगनी होकर लौट आई। शेर को लगा कि उस दूसरे शेर ने भी उसे ललकारा है।","गुस्से में अंधे होकर शेर ने कुएँ में छलाँग लगा दी। छपाक की आवाज़ हुई, पानी उछला, और कुछ ही पलों में सब शांत हो गया। शेर फिर कभी ऊपर नहीं आया। खरगोश मुँडेर पर खड़ा देर तक देखता रहा, फिर दौड़ता हुआ जंगल की ओर चल पड़ा।","जंगल में पहुँचकर उसने सबको पूरी बात बताई। पहले तो किसी को यकीन नहीं हुआ, फिर खुशी की लहर दौड़ गई। हाथी ने सूँड़ उठाकर चिंघाड़ लगाई, हिरण नाचने लगे, पंछी गीत गाने लगे। सबने नन्हे खरगोश को कंधों पर उठा लिया और उसका धन्यवाद किया। उस दिन के बाद जंगल में फिर से शांति और हँसी लौट आई, और बच्चे बेफिक्र होकर खेलने लगे।","सीख: ताकत से बड़ी चीज़ बुद्धि है। जो सोच समझकर काम करता है, वह बड़ी से बड़ी मुसीबत से निकल आता है।"]],"w":1007},{"id":"hi-bandar-magar","lang":"hi","title":"बंदर और मगरमच्छ","sub":"जातक कथा","cat":"story","pg":[["एक बड़ी नदी के किनारे जामुन का एक पुराना पेड़ खड़ा था। उसकी डालियाँ नदी के पानी तक झुकी रहती थीं और मौसम आते ही उन पर काले, रसीले जामुन लद जाते थे। उसी पेड़ पर एक समझदार बंदर रहता था। उसे डाल से डाल पर कूदना और सुबह की ठंडी हवा में नदी की लहरें देखना बहुत अच्छा लगता था। उसे कभी किसी चीज़ की कमी महसूस नहीं हुई।","एक दिन नदी से एक मगरमच्छ किनारे पर आया। वह बहुत थका हुआ था और कई दिन से उसे कोई अच्छा भोजन नहीं मिला था। वह रेत पर निढाल होकर लेट गया। बंदर ने ऊपर से उसे देखा और पूछा, \"भाई, तुम इतने उदास क्यों हो?\" मगरमच्छ ने कहा, \"मैं भूखा हूँ और बहुत दूर से तैरकर आया हूँ।\" बंदर को दया आ गई।","बंदर ने डाल हिलाई और ढेर सारे मीठे जामुन नीचे गिरा दिए। मगरमच्छ ने एक जामुन मुँह में डाला तो उसकी आँखें खुशी से चमक उठीं। उसने जीवन में इतना मीठा फल कभी नहीं खाया था। उसने पेट भरकर जामुन खाए और बंदर को बहुत धन्यवाद दिया। बंदर ने मुस्कुराकर कहा, \"कल भी आना, मेरे पास जामुन की कभी कमी नहीं होती।\""],["उस दिन के बाद मगरमच्छ रोज़ आने लगा। दोनों किनारे पर बैठकर घंटों बातें करते। बंदर जंगल की कहानियाँ सुनाता और मगरमच्छ नदी की गहराई के किस्से बताता। कभी वे एक दूसरे की बात पर खूब हँसते, कभी चुपचाप डूबता सूरज देखते। देखते देखते वे पक्के दोस्त बन गए, और दोनों को लगने लगा कि यह दोस्ती कभी नहीं टूटेगी।","एक दिन मगरमच्छ कुछ जामुन अपनी पत्नी के लिए भी ले गया। उसकी पत्नी ने उन्हें चखा तो बोली, \"वाह, ये तो बहुत मीठे हैं! तुम्हें ये कहाँ से मिले?\" मगरमच्छ ने अपने दोस्त बंदर के बारे में सब बता दिया। पत्नी कुछ देर सोचती रही, फिर बोली, \"जो बंदर रोज़ ऐसे मीठे फल खाता है, उसका कलेजा कितना मीठा होगा! मुझे उसका कलेजा चाहिए।\"","मगरमच्छ घबरा गया। \"यह तुम क्या कह रही हो? वह मेरा सबसे अच्छा दोस्त है। मैं उसके साथ ऐसा कैसे कर सकता हूँ?\" पर पत्नी अड़ गई। उसने खाना पीना छोड़ दिया और कहने लगी, \"या तो कलेजा लाओ, या मुझे मरा हुआ समझो।\" दिन भर मगरमच्छ बेचैन रहा। आखिर पत्नी की ज़िद के आगे वह हार गया और भारी मन से राज़ी हो गया।"],["अगले दिन वह रोज़ की तरह किनारे पर आया, पर आज उसके चेहरे पर पहले जैसी हँसी नहीं थी। उसने कहा, \"दोस्त, मेरी पत्नी तुमसे मिलना चाहती है। वह कहती है कि जिसने हमें इतने मीठे जामुन खिलाए, उसे घर बुलाकर दावत देनी चाहिए। चलो, मेरी पीठ पर बैठ जाओ।\" बंदर पहले थोड़ा हिचकिचाया, पर दोस्त की बात कैसे टालता? वह खुशी खुशी उसकी चौड़ी पीठ पर बैठ गया।","मगरमच्छ धीरे धीरे तैरने लगा। लहरें दोनों के आसपास छलकती रहीं। बंदर पानी की छींटों से खेलता हुआ गीत गुनगुना रहा था। पर जैसे जैसे किनारा दूर होता गया, मगरमच्छ चुप होता गया। जब वे नदी के ठीक बीच पहुँचे, जहाँ पानी बहुत गहरा था, तो उसने रुककर लंबी साँस ली और कहा, \"माफ़ करना दोस्त, मेरी पत्नी को तुम्हारा कलेजा चाहिए। मैं तुम्हें उसी के लिए ले जा रहा हूँ।\"","यह सुनकर बंदर का दिल एक पल को धक से रह गया। चारों ओर गहरा पानी था और वह तैरना भी नहीं जानता था। भागने का कोई रास्ता नहीं था। पर उसने सोचा कि घबराने से कुछ नहीं होगा। उसने अपने मन को शांत किया और जल्दी से एक उपाय सोच लिया। फिर वह हँस पड़ा, जैसे कोई बड़ी मज़ेदार बात सुन ली हो।"],["उसने कहा, \"अरे भाई, तुमने पहले क्यों नहीं बताया? इतनी सी बात के लिए इतना परेशान हो रहे थे! मैं अपना कलेजा तो पेड़ की डाल पर टाँगकर आया हूँ। हम बंदर अपना कलेजा हमेशा पेड़ पर सँभालकर रखते हैं, क्योंकि कूदते समय उसके टूटने का डर रहता है। चलो वापस चलें, मैं उसे अपने हाथों से ले आता हूँ और भाभी जी को खुशी से दे दूँगा।\"","भोला मगरमच्छ बंदर की बात पर यकीन कर बैठा। उसे लगा कि अब काम आसानी से हो जाएगा। उसने झट से पलटकर किनारे की ओर तैरना शुरू कर दिया। जैसे ही वे जामुन के पेड़ के पास पहुँचे, बंदर ने पूरी ताकत से छलाँग मारी और एक ही झटके में ऊँची डाल पर जा बैठा। उसने गहरी साँस ली। उसका दिल अब भी तेज़ी से धड़क रहा था।","फिर उसने नीचे झाँककर कहा, \"मूर्ख! कलेजा भला कोई बाहर टाँगकर घूमता है? मैंने तुम्हें अपना दोस्त समझा, तुम्हें अपने सबसे मीठे जामुन खिलाए, और तुमने मेरे साथ धोखा किया। जो दोस्त को धोखा दे, उसके साथ दोस्ती कैसी? अब लौट जाओ और कभी मेरे पेड़ के पास मत आना।\""],["मगरमच्छ शर्म से सिर झुकाए खड़ा रहा। उसे अपनी गलती का एहसास हो गया था, पर अब बहुत देर हो चुकी थी। वह चुपचाप नदी में लौट गया। बंदर देर तक डाल पर बैठा लहरों को देखता रहा। उसे दोस्त के खोने का दुख तो था, पर इस बात की खुशी भी कि उसकी समझदारी ने उसकी जान बचा ली।","सीख: मुसीबत में भी शांत रहना चाहिए, और जो धोखा दे उस पर दोबारा भरोसा नहीं करना चाहिए।"]],"w":854},{"id":"hi-teen-machhliyan","lang":"hi","title":"तीन मछलियाँ","sub":"पंचतंत्र की कथा","cat":"story","pg":[["पहाड़ों की तलहटी में एक सुंदर तालाब था। उसका पानी इतना साफ़ था कि सुबह की धूप में तल तक चमकता दिखाई देता था। किनारे पर कमल खिले रहते थे और हरी काई पर नन्हे मेंढक उछलते रहते थे। उसी तालाब में बहुत सी मछलियाँ रहती थीं, और उनमें तीन मछलियाँ आपस में सबसे गहरी सहेलियाँ थीं।","पहली मछली का नाम था दूरदर्शी। वह हर काम के बारे में पहले से सोचती थी और आने वाले खतरे को दूर से ही भाँप लेती थी। दूसरी मछली का नाम था समयबुद्धि। वह मुसीबत आने पर घबराती नहीं थी और मौके पर तुरंत उपाय निकाल लेती थी। तीसरी मछली का नाम था टालू। वह हर काम को कल पर छोड़ देता था और कहता था कि जो होगा देखा जाएगा।","एक शाम तीनों तालाब के किनारे कमल के पत्तों के नीचे बैठी बातें कर रही थीं। तभी किनारे की पगडंडी से कुछ मछुआरे गुज़रे। उनके कंधों पर बड़े बड़े जाल थे। वे रुककर तालाब को देखने लगे। एक ने कहा, \"देखो तो, यहाँ तो बहुत मछलियाँ हैं। आज हम थके हैं, पर कल सुबह जाल लेकर आएँगे और सारी मछलियाँ पकड़ ले जाएँगे।\" बाकी मछुआरों ने भी हाँ में सिर हिलाया।"],["दूरदर्शी ने यह सब सुन लिया। उसका दिल ज़ोर से धड़कने लगा। वह तुरंत बाकी दोनों को लेकर तालाब के बीच गहरे पानी में गई और बोली, \"तुमने सुना? मछुआरे कल सुबह जाल लेकर आ रहे हैं। हमें आज ही यह तालाब छोड़ देना चाहिए। खतरा आने से पहले ही बच निकलना अक़्लमंदी है। जब जाल पानी में पड़ जाएगा, तब बचना बहुत मुश्किल होगा।\"","समयबुद्धि ने कुछ सोचकर कहा, \"बहन, तुम्हारी चिंता ठीक है, पर अभी जल्दी क्या है? यह तालाब हमारा घर है। जब खतरा सामने आएगा, तब कोई न कोई उपाय निकाल लेंगे। मुझे अपनी सूझबूझ पर भरोसा है।\" दूरदर्शी ने उसे समझाया कि खतरे के बीच फँसकर उपाय सोचना हमेशा काम नहीं आता, पर समयबुद्धि अपनी बात पर टिकी रही।","टालू ने तो जम्हाई लेते हुए बात हँसी में उड़ा दी। वह बोला, \"अरे बहनो, तुम बेकार परेशान हो रही हो। जो होना है वह तो होकर रहेगा। चिंता करने से क्या फ़ायदा? मछुआरे आएँगे भी या नहीं, कौन जानता है। चलो, आज रात चैन से सोते हैं। कल की बात कल देखेंगे।\" यह कहकर वह कीचड़ के पास जाकर पसर गया।"],["दूरदर्शी ने दोनों को बहुत समझाया, पर किसी ने नहीं सुनी। उसे दुख हुआ, पर वह जानती थी कि
