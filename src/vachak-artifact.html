:root {
  --shadow: 0 1px 2px rgba(10,20,25,.08), 0 14px 34px -16px rgba(10,20,25,.28);
  --danger: #A12A2A;
  --f-ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-read: "Tiro Devanagari Hindi", "Noto Serif Devanagari", "Mangal", "Kohinoor Devanagari", serif;
  --read-size: 1.4rem;
}
:root[data-theme="dark"] { --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 34px -16px rgba(0,0,0,.7); --danger: #F08A8A; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  overflow: hidden;
}
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { height: 100%; display: grid; grid-template-columns: 276px minmax(0, 1fr); gap: 20px; }

/* ---------- rail ---------- */
.rail { display: flex; flex-direction: column; gap: 18px; min-height: 0; padding: 4px 4px 0 0; }
.brand { display: flex; align-items: baseline; gap: 10px; padding: 2px 2px 0; margin: 0; font-weight: inherit; font-size: inherit; }
.brand-mark { font-family: var(--f-read); font-size: 2.2rem; line-height: 1; letter-spacing: .01em; color: var(--accent); }
.brand-sub { font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 14px; font-weight: 600; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 6px 16px -8px var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--ink-2); padding: 7px 9px; }
.btn.quiet:hover { background: var(--panel); border-color: var(--line); }
.drop { margin: 0; }
.drop .btn { width: 100%; padding: 12px 14px; }
.drop small { display: block; margin-top: 7px; color: var(--ink-3); font-size: .8rem; }
.sr:focus { position: fixed; left: 12px; top: 12px; width: auto; height: auto; clip: auto; z-index: 100; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.swatch { text-align: left; border: 2px solid var(--line); background: var(--sheet); border-radius: 12px; padding: 8px; display: grid; gap: 6px; }
.swatch:hover { border-color: var(--ink-3); }
.swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.swatch .prev { display: grid; grid-template-columns: 1.6fr 1fr 1fr; height: 30px; border-radius: 7px; overflow: hidden; border: 1px solid rgba(128,128,128,.35); }
.swatch b { font-size: .88rem; } .swatch span.d { font-size: .74rem; color: var(--ink-3); line-height: 1.25; }
.meter { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 8px; } .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .2s; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
body.dragging .sheet { outline: 2px dashed var(--accent); outline-offset: -8px; }

.sec-label { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--ink-3); margin: 0 0 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.doc-title { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.doc-meta { color: var(--ink-3); font-size: .85rem; margin-top: 3px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: .76rem; font-weight: 600; border-radius: 99px; padding: 3px 9px; background: var(--accent-soft); color: var(--accent); }
.chip.off { background: transparent; border: 1px solid var(--line); color: var(--ink-3); }
.lib { display: grid; gap: 6px; }
.lib button { text-align: left; display: grid; gap: 1px; padding: 9px 12px; background: transparent; border: 1px solid transparent; border-radius: 10px; }
.lib button:hover { background: var(--panel); border-color: var(--line); }
.lib button b { font-weight: 600; }
.lib button span { color: var(--ink-3); font-size: .82rem; }
.toc-wrap { min-height: 0; display: flex; flex-direction: column; flex: 1; }
.toc { overflow: auto; margin: 0 -6px 0 -4px; padding: 0 6px 12px 4px; display: grid; gap: 1px; align-content: start; }
.toc button { text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 7px 10px; color: var(--ink-2); display: flex; gap: 10px; align-items: baseline; }
.toc button:hover { background: var(--panel); }
.toc button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toc button[aria-current="true"] .e { color: var(--ink-2); }
.toc .n { font-variant-numeric: tabular-nums; min-width: 1.6em; color: var(--ink-3); font-size: .85rem; }
.toc .t { font-family: var(--f-read); font-size: 1.02rem; line-height: 1.35; }
.toc .t.lat { font-family: var(--f-ui); font-size: .92rem; }
.toc .e { display: block; font-family: var(--f-ui); font-size: .76rem; color: var(--ink-3); }

/* ---------- main ---------- */
.main { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.menu-btn { display: none; }
.tabs { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: transparent; padding: 6px 13px; border-radius: 7px; font-weight: 600; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.spacer { flex: 1; }
.pager { display: inline-flex; align-items: center; gap: 4px; }
.pager input { width: 4.4em; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px; font-variant-numeric: tabular-nums; }
.pager .tot { color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 3.2em; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--ink-2); }
.icon-btn:hover { background: var(--panel); border-color: var(--line); }
.icon-btn:disabled { opacity: .35; cursor: default; }

.sheet { position: relative; flex: 1; min-height: 0; background: radial-gradient(120% 55% at 50% 0%, color-mix(in srgb, var(--accent-soft) 70%, var(--sheet)) 0%, var(--sheet) 62%); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
.stage { flex: 1; overflow: auto; scroll-behavior: auto; padding: 28px clamp(18px, 4vw, 56px) 60px; }
.reading { max-width: 40rem; margin: 0 auto; font-family: var(--f-read); font-size: var(--read-size); line-height: 2; color: var(--ink); }
.reading p { margin: 0 0 1.05em; text-wrap: pretty; }
.u { cursor: pointer; border-radius: 4px; padding: 1px 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: background .18s; }
.u:hover { background: var(--accent-soft); }
.u.on { background: var(--mark); color: var(--mark-ink); }
.u.silent { cursor: default; color: var(--ink-3); }
.chapter-head { text-align: center; margin: 0 0 1.4em; }
.chapter-head .kicker { font-family: var(--f-ui); font-size: .76rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.chapter-head h2 { font-weight: 400; font-size: 1.9em; line-height: 1.25; margin: .15em 0 0; }
.chapter-head .sub { font-family: var(--f-ui); color: var(--ink-3); font-size: .9rem; margin-top: 4px; }
.verse { display: grid; grid-template-columns: 3.1rem minmax(0, 1fr); gap: 4px 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.verse:first-of-type { border-top: 0; }
.verse .no { font-family: var(--f-ui); font-variant-numeric: tabular-nums; font-size: .78rem; font-weight: 700; color: var(--ink-3); padding-top: .85em; }
.verse .tx { line-height: 1.95; white-space: pre-line; }
.notice { max-width: 34rem; margin: 40px auto; text-align: center; color: var(--ink-2); font-family: var(--f-ui); }
.notice h3 { margin: 0 0 6px; font-size: 1.1rem; color: var(--ink); }
.page-wrap { position: relative; margin: 0 auto; width: max-content; max-width: 100%; box-shadow: 0 0 0 1px var(--line), var(--shadow); background: #fff; }
.page-wrap canvas { display: block; max-width: 100%; }
.page-wrap .ov { position: absolute; border-radius: 3px; cursor: pointer; }
.page-wrap .ov:hover { background: rgba(20,96,107,.18); }
.page-wrap .ov.on { background: rgba(245,196,60,.5); mix-blend-mode: multiply; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--sheet) 82%, transparent); font-weight: 600; color: var(--ink-2); z-index: 3; }
.loading[hidden] { display: none !important; }
.bar { width: 190px; height: 4px; border-radius: 4px; background: var(--line); margin-top: 10px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

/* ---------- dock ---------- */
.dock { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 12px; display: grid; gap: 8px; box-shadow: var(--shadow); margin-bottom: env(safe-area-inset-bottom, 0px); }
.seek { width: 100%; accent-color: var(--accent); height: 18px; margin: 0; }
.dock-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.transport { display: inline-flex; align-items: center; gap: 6px; }
.play { width: 56px; height: 56px; border-radius: 50%; border: 0; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 8px 20px -8px var(--accent); color: var(--accent-ink); display: grid; place-items: center; transition: transform .1s, filter .15s; }
.play:hover { filter: brightness(1.1); }
.play:active { transform: scale(.96); }
.play svg { width: 24px; height: 24px; fill: currentColor; stroke: none; }
.now { min-width: 0; flex: 1 1 200px; }
.now .l1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now .l2 { color: var(--ink-3); font-size: .84rem; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: .82rem; font-weight: 600; }
.field select, .select { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; color: var(--ink); max-width: 100%; }
.toggle { display: inline-flex; align-items: center; gap: 7px; font-size: .86rem; color: var(--ink-2); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

/* ---------- settings sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8,14,17,.5); z-index: 40; display: none; }
.scrim.open { display: block; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 60; transform: translateX(105%); visibility: hidden; transition: transform .22s ease, visibility 0s .22s; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.panel.open { transform: none; visibility: visible; transition-delay: 0s; }
.panel header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 12px max(18px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.panel h2 { margin: 0; font-size: 1.05rem; }
.panel .body { overflow: auto; padding: 8px max(18px, env(safe-area-inset-right, 0px)) 28px 18px; display: grid; gap: 22px; align-content: start; }
.group { display: grid; gap: 12px; padding-top: 14px; }
.group h3 { margin: 0; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.row { display: grid; gap: 5px; }
.row label, .row .lab { font-weight: 600; font-size: .9rem; }
.row .hint { color: var(--ink-3); font-size: .82rem; line-height: 1.4; }
.row .select, .row input[type="text"], .row input[type="password"], .row textarea { width: 100%; background: var(--sheet); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.row input[type="range"] { width: 100%; accent-color: var(--accent); }
.row .val { float: right; color: var(--ink-3); font-variant-numeric: tabular-nums; font-weight: 500; }
.seg { display: inline-flex; background: var(--sheet); border: 1px solid var(--line); border-radius: 9px; padding: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; color: var(--ink-2); font-weight: 600; font-size: .86rem; }
